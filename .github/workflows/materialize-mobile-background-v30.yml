name: Materialize hybrid mobile background v30

on:
  push:
    branches:
      - fix/mobile-background-v30-hybrid
    paths:
      - public/mobile-background-v30.js
      - public/mobile-background-v30.css
      - scripts/install-mobile-background-v30.py
      - scripts/finalize-mobile-background-v30.mjs
      - scripts/templates/verify-mobile-background-v30.yml
      - test/mobile-background-v30.test.mjs
      - .github/workflows/materialize-mobile-background-v30.yml
  workflow_dispatch:

concurrency:
  group: materialize-mobile-background-v30
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-background-v30-hybrid
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without postinstall generation
        run: npm ci --ignore-scripts

      - name: Install and materialize the canonical v30 release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install-mobile-background-v30.py
          npm run apply:prompt-policy

      - name: Commit generated output locally
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The v30 release is already materialized.'
          else
            git commit -m 'Materialize hybrid mobile background v30'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run complete regression and Worker validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the verified generated commit
        if: steps.generated.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/mobile-background-v30-hybrid'
          remote_ref="refs/remotes/origin/$branch"
          git fetch --no-tags origin "+refs/heads/$branch:$remote_ref"

          if git merge-base --is-ancestor HEAD "$remote_ref"; then
            echo 'An equivalent generated commit is already on the branch.'
            exit 0
          fi

          if [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse "$remote_ref^{tree}")" ]]; then
            echo 'An equivalent generated tree is already on the branch.'
            exit 0
          fi

          if git merge-base --is-ancestor "$remote_ref" HEAD; then
            git push origin "HEAD:refs/heads/$branch"
            exit 0
          fi

          git rebase "$remote_ref"
          git push origin "HEAD:refs/heads/$branch"

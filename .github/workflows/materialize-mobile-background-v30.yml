name: Materialize mobile background v30

on:
  push:
    branches:
      - fix/mobile-background-v30-hybrid
    paths:
      - public/mobile-background-v30.js
      - public/mobile-background-v30.css
      - scripts/finalize-mobile-background-v30.mjs
      - scripts/install-mobile-background-v30.py
      - test/mobile-background-v30.test.mjs
      - .github/workflows/materialize-mobile-background-v30.yml
  workflow_dispatch:

concurrency:
  group: materialize-mobile-background-v30
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the release branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-background-v30-hybrid
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the final v30 generator hook
        run: python scripts/install-mobile-background-v30.py

      - name: Install dependencies without postinstall generation
        run: npm ci --ignore-scripts

      - name: Materialize the canonical mobile release
        run: npm run apply:prompt-policy

      - name: Commit the generated release locally
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The v30 release is already materialized.'
          else
            git commit -m 'Use one sharp hybrid mobile background controller'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run full regression and Worker validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the verified generated commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/mobile-background-v30-hybrid

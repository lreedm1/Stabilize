name: Restore selected mobile image v21

on:
  push:
    branches:
      - agent/restore-original-mobile-image-v21
    paths:
      - scripts/restore-original-mobile-image-v21.mjs
      - scripts/finalize-decision-grade-impact.mjs
      - .github/workflows/materialize-restore-original-mobile-image-v21.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/restore-original-mobile-image-v21.mjs
      - scripts/finalize-decision-grade-impact.mjs
      - .github/workflows/materialize-restore-original-mobile-image-v21.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v6
        with:
          ref: agent/restore-original-mobile-image-v21
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without historical install scripts
        shell: bash
        run: npm ci --ignore-scripts

      - name: Materialize the selected scene
        shell: bash
        run: npm run apply:prompt-policy

      - name: Commit generated product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'Selected-scene output was already canonical.'
          else
            git commit -m 'Restore the selected forest-stream mobile scene'
          fi

      - name: Run complete regression and build gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish verified branch
        shell: bash
        run: git push origin HEAD:agent/restore-original-mobile-image-v21

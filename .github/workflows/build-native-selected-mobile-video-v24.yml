name: Build native selected mobile video v24

on:
  push:
    branches:
      - agent/native-selected-mobile-video-v24
    paths:
      - .github/workflows/build-native-selected-mobile-video-v24.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-native-selected-mobile-video-v24
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/native-selected-mobile-video-v24
          fetch-depth: 1
          persist-credentials: true

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build the native 1080x1920 selected-scene release
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/stabilize-native-selected-v24
          mkdir -p "$work"

          git fetch --no-tags --depth=1 origin \
            agent/mobile-hq-v1:refs/remotes/origin/agent/mobile-hq-v1
          git show \
            origin/agent/mobile-hq-v1:public/scenes/mobile-forest-hq-v1-1080.webp \
            > "$work/still.webp"

          test "$(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height -of csv=s=x:p=0 \
              "$work/still.webp"
          )" = 1080x1920

          mapfile -t motion_parts < <(
            find public/scenes -maxdepth 1 -type f \
              -name 'mobile-forest-stream-loop-v1.part*.b64' | sort
          )
          test "${#motion_parts[@]}" -eq 5
          cat "${motion_parts[@]}" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$work/motion.mp4"
          ffmpeg -hide_banner -v error -xerror -err_detect explode \
            -i "$work/motion.mp4" -map 0:v:0 -f null -

          python3 - "$work/water-mask.pgm" <<'PY'
          from pathlib import Path
          import math
          import sys

          width, height = 1080, 1920
          points = [
              (690, 920, 35),
              (790, 915, 55),
              (900, 900, 85),
              (1040, 892, 115),
              (1200, 900, 150),
              (1380, 925, 190),
              (1580, 965, 235),
              (1780, 1000, 280),
              (1919, 1015, 315),
          ]
          feather = 72.0
          pixels = bytearray(width * height)
          for y in range(height):
              if y < points[0][0]:
                  continue
              upper = points[-1]
              lower = points[-1]
              for index in range(len(points) - 1):
                  if points[index][0] <= y <= points[index + 1][0]:
                      upper = points[index]
                      lower = points[index + 1]
                      break
              span = max(1, lower[0] - upper[0])
              t = min(1.0, max(0.0, (y - upper[0]) / span))
              center = upper[1] + (lower[1] - upper[1]) * t
              half_width = upper[2] + (lower[2] - upper[2]) * t
              row = y * width
              for x in range(width):
                  distance = abs(x - center)
                  if distance <= half_width:
                      alpha = 255
                  elif distance >= half_width + feather:
                      alpha = 0
                  else:
                      phase = (distance - half_width) / feather
                      alpha = round(255 * 0.5 * (1 + math.cos(math.pi * phase)))
                  pixels[row + x] = alpha
          Path(sys.argv[1]).write_bytes(
              f"P5\n{width} {height}\n255\n".encode() + pixels
          )
          PY

          video="$work/mobile-forest-stream-video-v24-native-1080.mp4"
          poster="$work/mobile-forest-stream-v24-native-1080.webp"

          # Preserve the clean 1080x1920 still at its real resolution. Only the
          # creek receives moving pixels from the supplied clip. No AI upscaler,
          # tiled restoration, full-frame motion blend, crop, or 4K resize is used.
          ffmpeg -hide_banner -v error -y \
            -loop 1 -framerate 24 -i "$work/still.webp" \
            -stream_loop -1 -i "$work/motion.mp4" \
            -loop 1 -framerate 24 -i "$work/water-mask.pgm" \
            -filter_complex "
              [0:v]scale=1080:1920:flags=lanczos,setsar=1,setpts=PTS-STARTPTS,format=yuv420p[base];
              [1:v]scale=1080:1920:flags=lanczos,setsar=1,setpts=PTS-STARTPTS,
                unsharp=5:5:0.20:5:5:0.0,format=rgb24[motion];
              [2:v]scale=1080:1920:flags=neighbor,setsar=1,setpts=PTS-STARTPTS,
                format=gray,gblur=sigma=20[mask];
              [motion][mask]alphamerge[water];
              [base][water]overlay=shortest=1:format=auto,
                fps=24,format=yuv420p[out]
            " \
            -map '[out]' \
            -t 5.0 -an \
            -c:v libx264 -profile:v high -level:v 4.1 \
            -preset slow -crf 15 -maxrate 12000k -bufsize 24000k \
            -g 24 -keyint_min 24 -sc_threshold 0 -bf 2 -refs 3 \
            -pix_fmt yuv420p -tag:v avc1 \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 \
            -movflags +faststart \
            "$video"

          ffmpeg -hide_banner -v error -xerror -err_detect explode \
            -i "$video" -map 0:v:0 -f null -
          ffmpeg -hide_banner -v error -y \
            -i "$work/still.webp" \
            -vf 'scale=1080:1920:flags=lanczos' \
            -frames:v 1 -c:v libwebp -quality 95 -compression_level 6 \
            "$poster"

          probe="$work/probe.json"
          ffprobe -hide_banner -v error \
            -show_entries \
              stream=codec_name,profile,pix_fmt,width,height,level,r_frame_rate,avg_frame_rate,nb_frames:format=duration,size,bit_rate \
            -of json "$video" > "$probe"

          python3 - "$probe" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1]))
          streams = data.get("streams", [])
          if len(streams) != 1:
              raise SystemExit(f"Expected one video stream, found {len(streams)}")
          stream = streams[0]
          expected = {
              "codec_name": "h264",
              "profile": "High",
              "pix_fmt": "yuv420p",
              "width": 1080,
              "height": 1920,
              "r_frame_rate": "24/1",
              "avg_frame_rate": "24/1",
          }
          for key, value in expected.items():
              if stream.get(key) != value:
                  raise SystemExit(
                      f"Unexpected {key}: {stream.get(key)!r}; expected {value!r}"
                  )
          frames = int(stream.get("nb_frames", 0))
          if frames < 118:
              raise SystemExit(f"Too few frames: {frames}")
          duration = float(data["format"]["duration"])
          if not 4.9 <= duration <= 5.2:
              raise SystemExit(f"Unexpected duration: {duration}")
          PY

          test "$(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height -of csv=s=x:p=0 "$poster"
          )" = 1080x1920
          test -z "$(
            ffprobe -v error -select_streams a \
              -show_entries stream=index -of csv=p=0 "$video"
          )"

          ffmpeg -hide_banner -v error -i "$video" \
            -vf "select='between(n,12,35)'" -vsync 0 \
            -f framemd5 "$work/framemd5.txt"
          unique_frames="$(
            awk '!/^#/ && NF >= 6 {print $6}' "$work/framemd5.txt" \
              | sort -u | wc -l | tr -d '[:space:]'
          )"
          test "$unique_frames" -ge 18

          video_bytes="$(wc -c < "$video" | tr -d '[:space:]')"
          poster_bytes="$(wc -c < "$poster" | tr -d '[:space:]')"
          video_sha="$(sha256sum "$video" | awk '{print $1}')"
          poster_sha="$(sha256sum "$poster" | awk '{print $1}')"
          test "$video_bytes" -gt 1000000
          test "$video_bytes" -lt 25000000
          test "$poster_bytes" -gt 100000
          test "$poster_bytes" -lt 5000000
          test "$(dd if="$video" bs=1 skip=4 count=4 status=none)" = ftyp
          test "$(dd if="$poster" bs=1 count=4 status=none)" = RIFF
          test "$(dd if="$poster" bs=1 skip=8 count=4 status=none)" = WEBP
          moov_offset="$(grep -abo -m1 moov "$video" | cut -d: -f1)"
          mdat_offset="$(grep -abo -m1 mdat "$video" | cut -d: -f1)"
          test "$moov_offset" -lt "$mdat_offset"

          mkdir -p public/scenes scripts
          cp "$video" public/scenes/mobile-forest-stream-video-v24-native-1080.mp4
          cp "$poster" public/scenes/mobile-forest-stream-v24-native-1080.webp

          VIDEO_BYTES="$video_bytes" \
          VIDEO_SHA="$video_sha" \
          POSTER_BYTES="$poster_bytes" \
          POSTER_SHA="$poster_sha" \
          UNIQUE_FRAMES="$unique_frames" \
            python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          payload = {
              "version": "20260810-native-selected-mobile-v24-1",
              "videoRoute": "/media/mobile-forest-stream-video-v24-native-1080.mp4",
              "videoAsset": "/scenes/mobile-forest-stream-video-v24-native-1080.mp4",
              "posterAsset": "/scenes/mobile-forest-stream-v24-native-1080.webp",
              "videoBytes": int(os.environ["VIDEO_BYTES"]),
              "videoSha256": os.environ["VIDEO_SHA"],
              "posterBytes": int(os.environ["POSTER_BYTES"]),
              "posterSha256": os.environ["POSTER_SHA"],
              "width": 1080,
              "height": 1920,
              "fps": 24,
              "uniqueSampleFrames": int(os.environ["UNIQUE_FRAMES"]),
              "sourceStill": "agent/mobile-hq-v1:public/scenes/mobile-forest-hq-v1-1080.webp",
              "sourceMotion": "public/scenes/mobile-forest-stream-loop-v1.part*.b64",
              "pipeline": "native 1080x1920 still plus masked creek motion; no AI upscaling, tiled restoration, crop, or full-frame motion blend",
          }
          Path("scripts/native-selected-mobile-video-v24.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Commit the generated native media
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-native-selected-mobile-video-v24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            public/scenes/mobile-forest-stream-video-v24-native-1080.mp4 \
            public/scenes/mobile-forest-stream-v24-native-1080.webp
          git add \
            scripts/native-selected-mobile-video-v24.json \
            .github/workflows/build-native-selected-mobile-video-v24.yml
          git commit -m 'Generate native-resolution selected mobile media'
          git push origin HEAD:agent/native-selected-mobile-video-v24

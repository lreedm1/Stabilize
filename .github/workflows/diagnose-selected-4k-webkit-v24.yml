name: Diagnose selected 4K mobile WebKit v24

on:
  push:
    branches:
      - agent/diagnose-selected-4k-webkit-v23
    paths:
      - .github/workflows/diagnose-selected-4k-webkit-v24.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-selected-4k-webkit-v24.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/diagnose-selected-4k-webkit-v23
          persist-credentials: false

      - name: Install mobile WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Capture video state before and after a gesture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/selected-4k-webkit-v24
          cat > scripts/tmp-diagnose-selected-4k-webkit-v24.mjs <<'NODE'
          import { webkit } from "playwright";
          import { writeFile } from "node:fs/promises";

          const out = "/tmp/selected-4k-webkit-v24";
          const route =
            "/media/mobile-forest-stream-video-v14-retina-2160.mp4";
          const record = {
            startedAt: new Date().toISOString(),
            events: [],
            samples: [],
            explicitPlay: [],
          };

          const browser = await webkit.launch({ headless: true });
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
                "Mobile/15E148 Safari/604.1",
            });
            const page = await context.newPage();

            page.on("console", (message) =>
              record.events.push({
                kind: "console",
                type: message.type(),
                text: message.text(),
                at: Date.now(),
              }),
            );
            page.on("pageerror", (error) =>
              record.events.push({
                kind: "pageerror",
                message: error.message,
                stack: error.stack || null,
                at: Date.now(),
              }),
            );
            page.on("requestfailed", (request) =>
              record.events.push({
                kind: "requestfailed",
                url: request.url(),
                failure: request.failure(),
                at: Date.now(),
              }),
            );
            page.on("response", async (response) => {
              if (!response.url().includes(route)) return;
              record.events.push({
                kind: "video-response",
                url: response.url(),
                status: response.status(),
                headers: await response.allHeaders().catch(() => ({})),
                at: Date.now(),
              });
            });

            await page.addInitScript(() => {
              globalThis.__videoEvents = [];
              const seen = new WeakSet();
              const attach = (video) => {
                if (!(video instanceof HTMLVideoElement) || seen.has(video)) return;
                seen.add(video);
                for (const name of [
                  "loadstart",
                  "durationchange",
                  "loadedmetadata",
                  "loadeddata",
                  "progress",
                  "canplay",
                  "canplaythrough",
                  "play",
                  "playing",
                  "pause",
                  "waiting",
                  "stalled",
                  "suspend",
                  "abort",
                  "emptied",
                  "error",
                  "timeupdate",
                  "ended",
                ]) {
                  video.addEventListener(name, () => {
                    globalThis.__videoEvents.push({
                      name,
                      at: performance.now(),
                      readyState: video.readyState,
                      networkState: video.networkState,
                      paused: video.paused,
                      currentTime: video.currentTime,
                      duration: Number.isFinite(video.duration)
                        ? video.duration
                        : null,
                      videoWidth: video.videoWidth,
                      videoHeight: video.videoHeight,
                      currentSrc: video.currentSrc,
                      error: video.error
                        ? {
                            code: video.error.code,
                            message: video.error.message || "",
                          }
                        : null,
                    });
                  });
                }
              };
              const scan = () => {
                for (const video of document.querySelectorAll("video")) attach(video);
              };
              new MutationObserver(scan).observe(document, {
                subtree: true,
                childList: true,
              });
              document.addEventListener("readystatechange", scan);
              document.addEventListener("DOMContentLoaded", scan);
              scan();
            });

            try {
              await page.goto(
                `https://stabilize.info/?webkit-v24=${Date.now()}`,
                { waitUntil: "domcontentloaded", timeout: 60_000 },
              );
            } catch (error) {
              record.navigationError = String(error?.stack || error);
            }

            await page
              .waitForSelector("#mobile-background-video", {
                state: "attached",
                timeout: 30_000,
              })
              .catch((error) => {
                record.events.push({
                  kind: "selector-timeout",
                  message: String(error?.message || error),
                  at: Date.now(),
                });
              });

            async function sample(label) {
              const value = await page.evaluate((videoRoute) => {
                const video = document.querySelector(
                  "#mobile-background-video",
                );
                const style =
                  video instanceof HTMLVideoElement
                    ? getComputedStyle(video)
                    : null;
                const source =
                  video instanceof HTMLVideoElement
                    ? video.querySelector("source")
                    : null;
                const probe = document.createElement("video");
                return {
                  label,
                  now: performance.now(),
                  hidden: document.hidden,
                  visibilityState: document.visibilityState,
                  portrait: matchMedia(
                    "(max-width: 980px) and (orientation: portrait)",
                  ).matches,
                  videoExists: video instanceof HTMLVideoElement,
                  currentSrc:
                    video instanceof HTMLVideoElement ? video.currentSrc : null,
                  resolvedSrc:
                    video instanceof HTMLVideoElement ? video.src : null,
                  sourceChild: source?.getAttribute("src") || null,
                  autoplay:
                    video instanceof HTMLVideoElement ? video.autoplay : null,
                  muted:
                    video instanceof HTMLVideoElement ? video.muted : null,
                  defaultMuted:
                    video instanceof HTMLVideoElement
                      ? video.defaultMuted
                      : null,
                  loop:
                    video instanceof HTMLVideoElement ? video.loop : null,
                  playsInline:
                    video instanceof HTMLVideoElement
                      ? video.playsInline
                      : null,
                  preload:
                    video instanceof HTMLVideoElement ? video.preload : null,
                  readyState:
                    video instanceof HTMLVideoElement ? video.readyState : null,
                  networkState:
                    video instanceof HTMLVideoElement
                      ? video.networkState
                      : null,
                  paused:
                    video instanceof HTMLVideoElement ? video.paused : null,
                  currentTime:
                    video instanceof HTMLVideoElement
                      ? video.currentTime
                      : null,
                  duration:
                    video instanceof HTMLVideoElement &&
                    Number.isFinite(video.duration)
                      ? video.duration
                      : null,
                  videoWidth:
                    video instanceof HTMLVideoElement
                      ? video.videoWidth
                      : null,
                  videoHeight:
                    video instanceof HTMLVideoElement
                      ? video.videoHeight
                      : null,
                  error:
                    video instanceof HTMLVideoElement && video.error
                      ? {
                          code: video.error.code,
                          message: video.error.message || "",
                        }
                      : null,
                  className:
                    video instanceof HTMLVideoElement ? video.className : null,
                  display: style?.display || null,
                  visibility: style?.visibility || null,
                  opacity: style?.opacity || null,
                  dataset: { ...document.documentElement.dataset },
                  canPlay: {
                    mp4: probe.canPlayType("video/mp4"),
                    baseline: probe.canPlayType(
                      'video/mp4; codecs="avc1.42E01E"',
                    ),
                    main: probe.canPlayType(
                      'video/mp4; codecs="avc1.4D401F"',
                    ),
                    high51: probe.canPlayType(
                      'video/mp4; codecs="avc1.640033"',
                    ),
                  },
                  resources: performance
                    .getEntriesByType("resource")
                    .filter((entry) => entry.name.includes(videoRoute))
                    .map((entry) => ({
                      name: entry.name,
                      initiatorType: entry.initiatorType,
                      duration: entry.duration,
                      transferSize: entry.transferSize,
                      encodedBodySize: entry.encodedBodySize,
                      decodedBodySize: entry.decodedBodySize,
                    })),
                  recentVideoEvents:
                    globalThis.__videoEvents?.slice(-80) || [],
                };
              }, route);
              record.samples.push({ label, at: Date.now(), value });
              return value;
            }

            async function explicitPlay(label) {
              const result = await page.evaluate(async () => {
                const video = document.querySelector(
                  "#mobile-background-video",
                );
                if (!(video instanceof HTMLVideoElement)) {
                  return { ok: false, reason: "missing-video" };
                }
                try {
                  await video.play();
                  return {
                    ok: true,
                    paused: video.paused,
                    readyState: video.readyState,
                    currentTime: video.currentTime,
                  };
                } catch (error) {
                  return {
                    ok: false,
                    name: error?.name || "",
                    message: error?.message || String(error),
                    paused: video.paused,
                    readyState: video.readyState,
                    networkState: video.networkState,
                    mediaError: video.error
                      ? {
                          code: video.error.code,
                          message: video.error.message || "",
                        }
                      : null,
                  };
                }
              });
              record.explicitPlay.push({ label, at: Date.now(), result });
            }

            for (let index = 0; index < 8; index += 1) {
              await sample(`before-${index}`);
              if (index === 3 || index === 6) {
                await explicitPlay(`before-${index}`);
              }
              await page.waitForTimeout(1_000);
            }

            await page.screenshot({
              path: `${out}/before-gesture.png`,
              fullPage: false,
            });

            record.gesture = await page
              .tap("body", { position: { x: 22, y: 22 } })
              .then(() => ({ ok: true }))
              .catch((error) => ({
                ok: false,
                error: String(error?.stack || error),
              }));
            await explicitPlay("after-tap");

            for (let index = 0; index < 8; index += 1) {
              await sample(`after-${index}`);
              if (index === 3 || index === 6) {
                await explicitPlay(`after-${index}`);
              }
              await page.waitForTimeout(1_000);
            }

            await page.screenshot({
              path: `${out}/after-gesture.png`,
              fullPage: false,
            });

            record.fetches = await page.evaluate(async (videoRoute) => {
              const results = [];
              for (const [name, headers] of [
                ["full", {}],
                ["start", { Range: "bytes=0-1023" }],
                ["tail", { Range: "bytes=-1024" }],
              ]) {
                try {
                  const response = await fetch(
                    `${videoRoute}?webkit-fetch=${name}-${Date.now()}`,
                    { headers, cache: "no-store" },
                  );
                  const body = await response.arrayBuffer();
                  results.push({
                    name,
                    status: response.status,
                    ok: response.ok,
                    bytes: body.byteLength,
                    headers: Object.fromEntries(response.headers.entries()),
                  });
                } catch (error) {
                  results.push({
                    name,
                    error: String(error?.stack || error),
                  });
                }
              }
              return results;
            }, route);
          } finally {
            record.finishedAt = new Date().toISOString();
            await writeFile(
              `${out}/diagnostic.json`,
              JSON.stringify(record, null, 2),
            );
            await browser.close();
          }
          NODE

          node scripts/tmp-diagnose-selected-4k-webkit-v24.mjs
          rm -f scripts/tmp-diagnose-selected-4k-webkit-v24.mjs

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/selected-4k-webkit-v24/diagnostic.json')
          data = json.loads(path.read_text())
          summary = {
              'navigationError': data.get('navigationError'),
              'gesture': data.get('gesture'),
              'explicitPlay': data.get('explicitPlay'),
              'events': data.get('events'),
              'fetches': data.get('fetches'),
              'samples': [
                  {
                      'label': item['label'],
                      'videoWidth': item['value'].get('videoWidth'),
                      'videoHeight': item['value'].get('videoHeight'),
                      'readyState': item['value'].get('readyState'),
                      'networkState': item['value'].get('networkState'),
                      'paused': item['value'].get('paused'),
                      'currentTime': item['value'].get('currentTime'),
                      'duration': item['value'].get('duration'),
                      'error': item['value'].get('error'),
                      'state': item['value'].get('dataset', {}).get('mobileBackground'),
                      'quality': item['value'].get('dataset', {}).get('mobileVideoQuality'),
                      'autoplayError': item['value'].get('dataset', {}).get('mobileVideoAutoplayError'),
                      'display': item['value'].get('display'),
                      'visibility': item['value'].get('visibility'),
                      'opacity': item['value'].get('opacity'),
                      'canPlay': item['value'].get('canPlay'),
                      'currentSrc': item['value'].get('currentSrc'),
                  }
                  for item in data.get('samples', [])
              ],
          }
          Path('/tmp/selected-4k-webkit-v24/summary.json').write_text(
              json.dumps(summary, indent=2)
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-4k-webkit-v24-diagnostic
          path: /tmp/selected-4k-webkit-v24
          if-no-files-found: error
          retention-days: 7

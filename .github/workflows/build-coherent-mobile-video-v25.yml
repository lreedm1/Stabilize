name: Build coherent full-frame mobile video v25

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-coherent-mobile-video-v25.sh
      - scripts/prepare-coherent-mobile-video-v25.py
      - scripts/finalize-coherent-mobile-v25.mjs
      - .github/workflows/build-coherent-mobile-video-v25.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the actual release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install video tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate one-source 2160x3840 video
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-coherent-mobile-video-v25.sh \
            /tmp/stabilize-coherent-mobile-v25

      - name: Install coherent release into the repository
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-coherent-mobile-video-v25.py \
            /tmp/stabilize-coherent-mobile-v25/mobile-forest-stream-video-v25-coherent-4k.mp4 \
            /tmp/stabilize-coherent-mobile-v25/mobile-forest-stream-v25-coherent-4k.webp
          npm ci --ignore-scripts
          npm run apply:prompt-policy

      - name: Commit generated binary and canonical output locally
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Coherent release is already materialized.'
          else
            git commit -m 'Use one coherent full-frame 4K mobile video'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run full regression and Worker checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Stage generated verifier as visible evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/workflows/verify-mobile-video.yml ]]; then
            cp .github/workflows/verify-mobile-video.yml \
              /tmp/stabilize-coherent-mobile-v25/verify-mobile-video.yml
          fi

      - name: Publish verified generated commit to PR branch
        if: steps.commit.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          branch='${{ github.event.pull_request.head.ref }}'

          # Another write-enabled run can finish the same deterministic build first.
          # Refresh the branch and treat an already-published identical/containing
          # commit as success rather than failing with a non-fast-forward push.
          git fetch --no-tags --depth=50 origin "$branch"
          remote_ref='FETCH_HEAD'

          if git merge-base --is-ancestor HEAD "$remote_ref"; then
            echo 'Generated release is already published on the PR branch.'
            exit 0
          fi

          if [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse "$remote_ref^{tree}")" ]]; then
            echo 'An equivalent generated tree is already published on the PR branch.'
            exit 0
          fi

          if git merge-base --is-ancestor "$remote_ref" HEAD; then
            git push origin "HEAD:$branch"
            exit 0
          fi

          # Preserve any concurrent branch-only edit without force pushing.
          git rebase "$remote_ref"
          git push origin "HEAD:$branch"

      - name: Upload visual build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherent-mobile-video-v25-evidence
          path: |
            /tmp/stabilize-coherent-mobile-v25/mobile-forest-stream-video-v25-coherent-4k.mp4
            /tmp/stabilize-coherent-mobile-v25/mobile-forest-stream-v25-coherent-4k.webp
            /tmp/stabilize-coherent-mobile-v25/probe.json
            /tmp/stabilize-coherent-mobile-v25/framemd5.txt
            /tmp/stabilize-coherent-mobile-v25/verify-mobile-video.yml
          if-no-files-found: warn
          retention-days: 7

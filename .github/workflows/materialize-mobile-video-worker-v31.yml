name: Materialize mobile video worker assets v31

on:
  push:
    branches:
      - fix/mobile-video-worker-assets-v31
    paths:
      - scripts/install-mobile-video-worker-v31.mjs
      - .github/workflows/materialize-mobile-video-worker-v31.yml
  workflow_dispatch:

concurrency:
  group: materialize-mobile-video-worker-v31
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-video-worker-assets-v31
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without generation
        run: npm ci --ignore-scripts

      - name: Materialize the Worker-served mobile runtime
        run: node scripts/install-mobile-video-worker-v31.mjs

      - name: Commit the generated repair locally
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The v31 repair is already materialized.'
          else
            git commit -m 'Serve the mobile video controller from the Worker'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run full validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the verified repair commit
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:fix/mobile-video-worker-assets-v31

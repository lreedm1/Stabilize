name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Stabilize.xcodeproj \
            -scheme Stabilize \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Stabilize.xcodeproj \
            -scheme Stabilize \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test-output.log

      - name: Preserve unit-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-output-${{ github.run_id }}
          path: ios/test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce unit-test result
        if: always() && steps.unit-tests.outcome == 'failure'
        run: exit 1

name: iOS release configuration

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "test/ios-release.test.mjs"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "test/ios-release.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-configuration:
    name: Validate Xcode Cloud release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Validate version, metadata, and cloud-only release policy
        run: node --test test/ios-release.test.mjs

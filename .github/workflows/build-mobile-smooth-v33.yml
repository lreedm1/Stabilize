name: Build mobile smooth v33

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-mobile-video-smooth-v33.sh
      - scripts/finalize-mobile-smooth-v33.py
      - scripts/place-mobile-smooth-v33-css.py
      - .github/workflows/build-mobile-smooth-v33.yml
  workflow_dispatch:

concurrency:
  group: build-mobile-smooth-v33-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the exact release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -filters 2>/dev/null | grep -F minterpolate

      - name: Validate release scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/generate-mobile-video-smooth-v33.sh
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              "scripts/finalize-mobile-smooth-v33.py",
              "scripts/place-mobile-smooth-v33-css.py",
          ):
              compile(Path(path).read_text(encoding="utf-8"), path, "exec")
          PY

      - name: Generate genuine 60 fps mobile video
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-mobile-video-smooth-v33.sh \
            /tmp/stabilize-mobile-smooth-v33

      - name: Install the v33 payload and performance fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize-mobile-smooth-v33.py \
            /tmp/stabilize-mobile-smooth-v33/mobile-forest-stream-video-v12-720.mp4 \
            | tee /tmp/stabilize-mobile-smooth-v33/release.json
          python3 scripts/place-mobile-smooth-v33-css.py
          npm ci --ignore-scripts
          npm run apply:prompt-policy

      - name: Commit generated release locally
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The v33 release is already materialized.'
          else
            git commit -m 'Make the mobile background genuinely smooth'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run full regression and Worker checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Verify the decoded release contract
        shell: bash
        run: |
          set -euo pipefail
          video='public/scenes/mobile-forest-stream-video-v12-720.mp4'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")" = 720x1280
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$video")" = 60/1
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=profile -of csv=p=0 "$video")" = 'Constrained Baseline'
          test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")" = ''
          grep -Fq 'native-video-720x1280-60fps' public/mobile-video-handoff-v31.js
          grep -Fq 'public, max-age=31536000, immutable' src/mobile-video-response.js
          grep -Fq 'mobile-video-smooth-v33-start' public/mobile-background-v30.css
          grep -Fq -- '-webkit-backdrop-filter: none' public/mobile-background-v30.css
          grep -Fq 'mobile-video-smooth-v33-start' src/mobile-background-response.js
          grep -Fq '/main-box-white.css?v=20260805-2' src/page.js
          ! grep -Fq 'mobile-video-smooth-v33-start' public/main-box-white.css

      - name: Package the verified generated commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence='/tmp/stabilize-mobile-smooth-v33'
          tree="$evidence/generated-release-tree"
          mkdir -p "$tree"
          git diff-tree --no-commit-id --name-only -r HEAD > "$evidence/generated-files.txt"
          while IFS= read -r path; do
            mkdir -p "$tree/$(dirname "$path")"
            cp "$path" "$tree/$path"
          done < "$evidence/generated-files.txt"
          tar -C "$tree" -czf "$evidence/generated-release.tar.gz" .
          git rev-parse HEAD^ > "$evidence/generated-parent.txt"
          git rev-parse HEAD > "$evidence/generated-commit.txt"
          sha256sum "$evidence/generated-release.tar.gz" > "$evidence/generated-release.tar.gz.sha256"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smooth-v33-release
          path: |
            /tmp/stabilize-mobile-smooth-v33/mobile-forest-stream-video-v12-720.mp4
            /tmp/stabilize-mobile-smooth-v33/probe.json
            /tmp/stabilize-mobile-smooth-v33/framemd5.txt
            /tmp/stabilize-mobile-smooth-v33/frame-early.png
            /tmp/stabilize-mobile-smooth-v33/frame-late.png
            /tmp/stabilize-mobile-smooth-v33/release.json
            /tmp/stabilize-mobile-smooth-v33/generated-files.txt
            /tmp/stabilize-mobile-smooth-v33/generated-parent.txt
            /tmp/stabilize-mobile-smooth-v33/generated-commit.txt
            /tmp/stabilize-mobile-smooth-v33/generated-release.tar.gz
            /tmp/stabilize-mobile-smooth-v33/generated-release.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 7

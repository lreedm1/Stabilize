name: Temporary Wisconsin Acts Build V2

on:
  push:
    paths:
      - ".github/workflows/build-wi-acts-temp-v2.yml"

permissions:
  contents: write

concurrency:
  group: temporary-wisconsin-acts-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF text extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build, validate, and commit output or diagnostic log
        shell: bash
        run: |
          mkdir -p generated
          set +e
          python3 scripts/build_wi_acts_temp.py > generated/Wisconsin_Acts_Build_Log.txt 2>&1
          status=$?
          echo >> generated/Wisconsin_Acts_Build_Log.txt
          echo "BUILD_EXIT_STATUS=$status" >> generated/Wisconsin_Acts_Build_Log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git commit -m "[skip acts build] Save Wisconsin acts output and diagnostics" || true
          git push
          exit $status

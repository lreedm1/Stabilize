name: Export reasoning impact v2 worktree

on:
  push:
    branches:
      - agent/reasoning-effort-impact-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/reasoning-effort-impact-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/reasoning-effort-impact-v2
          persist-credentials: false

      - name: Remove Git metadata
        run: rm -rf .git

      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-impact-v2-worktree
          path: .
          include-hidden-files: true
          retention-days: 1

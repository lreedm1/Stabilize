name: Deploy Stabilize to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stabilize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker and required production secrets
        run: npm run check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy current main commit
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
          packageManager: npm

      - name: Verify production Google sign-in
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error https://reedlokken.com/api/auth || true)"
            echo "Auth check attempt ${attempt}: ${response}"
            if node -e '
              try {
                const value = JSON.parse(process.argv[1]);
                process.exit(value.google === true ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$response"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production /api/auth did not report google=true after deployment."
          exit 1

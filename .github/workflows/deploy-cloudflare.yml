name: Deploy Stabilize to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stabilize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build clean prompt-policy branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ ! -f .github/deploy-cloudflare.original || ! -f .github/prompt-policy-trigger ]]; then
            echo "No prompt-policy migration is staged."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label}; found {count}")
              return text.replace(old, new, 1)

          path = Path('src/index.js')
          text = path.read_text()
          text = once(text, 'const MAX_BODY_BYTES = 32_000;\n', '', 'body-size cap')
          text = once(text, 'const MAX_MESSAGE_CHARS = 4_000;\n', '', 'message cap')
          text = once(text, '// OpenAI counts visible output, hidden reasoning, and formatting tokens here.\nconst MAX_MODEL_OUTPUT_TOKENS = 500;\n', '', 'model-output cap')
          start = text.index('async function readBoundedJson(request) {')
          end = text.index('\nfunction normalizeMessages(messages) {', start)
          text = text[:start] + '''async function readRequestJson(request) {
            try {
              return await request.json();
            } catch {
              throw new HttpError(400, COPY.api.invalidJson);
            }
          }
          ''' + text[end:]
          text = once(text, 'text: String(message.content || "").trim().slice(0, MAX_MESSAGE_CHARS),', 'text: String(message.content || "").trim(),', 'normalized-message truncation')
          text = once(text, '''      previous.text = (previous.text + "\\n" + message.text).slice(
                0,
                MAX_MESSAGE_CHARS,
              );''', '''      previous.text = previous.text + "\\n" + message.text;''', 'merged-message truncation')
          text = once(text, 'if (direct) return direct.slice(0, MAX_MESSAGE_CHARS);', 'if (direct) return direct;', 'direct-message truncation')
          text = once(text, 'return String(latestUser?.content || "").trim().slice(0, MAX_MESSAGE_CHARS);', 'return String(latestUser?.content || "").trim();', 'conversation-message truncation')
          text = once(text, 'readBoundedJson(request)', 'readRequestJson(request)', 'bounded JSON reader call')
          text = once(text, '      max_output_tokens: MAX_MODEL_OUTPUT_TOKENS,\n', '', 'chat output token field')
          path.write_text(text)

          path = Path('src/page.js')
          text = path.read_text()
          text = once(text, '                maxlength="4000"\n', '', 'textarea maxlength')
          text = text.replace('/app.js?v=20260802-context-aware-actions-1', '/app.js?v=20260802-unbounded-prompts-1')
          path.write_text(text)

          path = Path('src/copy.js')
          text = path.read_text()
          rule = 'LENGTH: Keep ordinary responses to 500 words or fewer. When the user asks you to create, draft, expand, or revise a document, report, letter, bill, résumé, plan, brief, or other document-ready content, use the length needed to complete it well and do not apply the 500-word ceiling.'
          text = once(text, '\n\nFINAL: Use the smallest sufficient intervention.', f'\n\n{rule}\n\nFINAL: Use the smallest sufficient intervention.', 'final instruction anchor')
          path.write_text(text)

          path = Path('test/worker.test.mjs')
          text = path.read_text()
          text = once(text, '    assert.equal(providerBody.max_output_tokens, 500);', '    assert.equal("max_output_tokens" in providerBody, false);', 'output-token assertion')
          text = once(text, '    assert.match(providerBody.instructions, /Systems > willpower/i);', '    assert.match(providerBody.instructions, /Systems > willpower/i);\n    assert.match(providerBody.instructions, /500 words or fewer/i);\n    assert.match(providerBody.instructions, /document-ready content/i);', 'instruction assertion')
          marker = 'test("rate limits return a retry time and a safe traceable error"'
          long_test = r'''

test("chat forwards long prompts without app-level truncation", async () => {
  const originalFetch = globalThis.fetch;
  let providerBody;
  globalThis.fetch = async (_input, init) => {
    providerBody = JSON.parse(init.body);
    return responseWithText("Received the full request.");
  };
  try {
    const longMessage = "Long prompt detail. ".repeat(700);
    const response = await worker.fetch(
      new Request("https://stabilize.test/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: longMessage }),
      }),
      createEnv({ DEMO_MODE: "false", OPENAI_API_KEY: "test-openai-key" }),
    );
    assert.equal(response.status, 200);
    assert.equal(providerBody.input.at(-1).content, longMessage.trim());
    assert.ok(providerBody.input.at(-1).content.length > 4_000);
    assert.equal("max_output_tokens" in providerBody, false);
  } finally {
    globalThis.fetch = originalFetch;
  }
});

'''
          position = text.index(marker)
          text = text[:position] + long_test + text[position:]
          path.write_text(text)

          path = Path('test/prompt-submit.test.mjs')
          text = path.read_text() + r'''

test("prompt and reply lengths use instructions rather than app hard caps", async () => {
  const [pageSource, workerSource, copySource] = await Promise.all([
    readFile(new URL("../src/page.js", import.meta.url), "utf8"),
    readFile(new URL("../src/index.js", import.meta.url), "utf8"),
    readFile(new URL("../src/copy.js", import.meta.url), "utf8"),
  ]);
  assert.doesNotMatch(pageSource, /maxlength="4000"/);
  assert.doesNotMatch(workerSource, /MAX_BODY_BYTES|MAX_MESSAGE_CHARS|MAX_MODEL_OUTPUT_TOKENS/);
  assert.match(copySource, /Keep ordinary responses to 500 words or fewer/);
  assert.match(copySource, /document-ready content/);
  assert.match(copySource, /do not apply the 500-word ceiling/);
});
'''
          path.write_text(text)

          path = Path('test/mobile-quality.test.mjs')
          text = path.read_text()
          text = once(text, '''  assert.match(mobileQuality, /eightKPhoto/);
            assert.match(mobileQuality, /lake-valley-landscape-7680\\.webp/);''', '''  assert.match(mobileQuality, /matchMedia\\?\\.\\("\\(max-width: 980px\\)"\\)/);
            assert.match(mobileQuality, /data-mobile-animation/);''', 'stale mobile-quality assertions')
          path.write_text(text)
          PY
          cp .github/deploy-cloudflare.original .github/workflows/deploy-cloudflare.yml
          rm .github/deploy-cloudflare.original .github/prompt-policy-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove hard prompt caps and use a 500-word instruction"
          git push --force origin HEAD:feature/remove-hard-prompt-limits-output

      - name: Mark Cloudflare deployment pending
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{"state":"pending","context":"deployment/cloudflare","description":"Waiting for Cloudflare deployment and domain checks","target_url":"%s/%s/actions/runs/%s"}' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Detect GitHub-held Cloudflare credentials
        id: cloudflare
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy current main commit with Wrangler
        if: github.event_name != 'pull_request' && steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
          packageManager: npm

      - name: Verify canonical production domain
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --max-time 15 --silent --show-error https://stabilize.info/api/auth || true)"
            if node -e 'try { const value = JSON.parse(process.argv[1]); process.exit(value.google === true ? 0 : 1); } catch { process.exit(1); }' "$response"; then
              redirect="$(curl --max-time 15 --silent --show-error --output /dev/null --write-out "%{http_code} %{redirect_url}" https://reedlokken.com/ || true)"
              case "$redirect" in "308 https://stabilize.info/"*) exit 0 ;; esac
            fi
            sleep 10
          done
          exit 1

      - name: Publish Cloudflare deployment result
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then state="success"; description="Cloudflare deployment and domain checks passed"; else state="failure"; description="Cloudflare deployment or domain checks failed"; fi
          payload="$(printf '{"state":"%s","context":"deployment/cloudflare","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" --data "$payload" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

name: Deploy Stabilize to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stabilize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Mark Cloudflare deployment pending
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{"state":"pending","context":"deployment/cloudflare","description":"Waiting for Cloudflare deployment and domain checks","target_url":"%s/%s/actions/runs/%s"}' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Detect GitHub-held Cloudflare credentials
        id: cloudflare
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Cloudflare credentials are absent; Cloudflare's native Git integration will deploy this commit."
          fi

      - name: Deploy current main commit with Wrangler
        if: github.event_name != 'pull_request' && steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
          packageManager: npm

      - name: Verify canonical production domain
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --max-time 15 --silent --show-error https://stabilize.info/api/auth || true)"
            echo "Auth check attempt ${attempt}: ${response}"
            if node -e '
              try {
                const value = JSON.parse(process.argv[1]);
                process.exit(value.google === true ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$response"; then
              redirect="$(curl --max-time 15 --silent --show-error --output /dev/null --write-out "%{http_code} %{redirect_url}" https://reedlokken.com/ || true)"
              echo "Legacy-domain redirect: ${redirect}"
              case "$redirect" in
                "308 https://stabilize.info/"*) exit 0 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::stabilize.info did not serve the Stabilize Worker, or reedlokken.com did not permanently redirect to it."
          exit 1

      - name: Verify production chat streaming
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for attempt in {1..8}; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(
              curl --max-time 75 --silent --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --header "Accept: application/x-ndjson, application/json" \
                --header "Cache-Control: no-cache" \
                --data '{"message":"Hi"}' \
                --dump-header "$headers" \
                --output "$body" \
                --write-out "%{http_code}" \
                "https://stabilize.info/api/chat?deployment=${GITHUB_SHA}" || true
            )"
            content_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' "$headers" | tail -n 1)"
            echo "Chat stream attempt ${attempt}: HTTP ${status}; ${content_type:-no-content-type}"

            if [[ "$status" == "200" && "$content_type" == application/x-ndjson* ]]; then
              if node - "$body" <<'NODE'
const fs = require("node:fs");
const path = process.argv.at(-1);
const lines = fs.readFileSync(path, "utf8").split(/\r?\n/).filter(Boolean);
let streamedText = "";
let completed = null;
for (const line of lines) {
  const event = JSON.parse(line);
  if (event.type === "error") process.exit(1);
  if (event.type === "delta" && typeof event.delta === "string") {
    streamedText += event.delta;
  }
  if (event.type === "done") completed = event;
}
if (
  !streamedText.trim() ||
  !completed ||
  typeof completed.reply !== "string" ||
  !completed.reply.trim()
) {
  process.exit(1);
}
NODE
              then
                rm -f "$headers" "$body"
                exit 0
              fi
            fi

            rm -f "$headers" "$body"
            sleep 10
          done
          echo "::error::stabilize.info did not produce a complete streamed assistant reply."
          exit 1

      - name: Publish Cloudflare deployment result
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Cloudflare deployment and live chat checks passed"
          else
            state="failure"
            description="Cloudflare deployment or live chat checks failed"
          fi
          payload="$(printf '{"state":"%s","context":"deployment/cloudflare","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

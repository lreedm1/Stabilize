name: Deploy Stabilize to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stabilize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Mark Cloudflare deployment pending
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{"state":"pending","context":"deployment/cloudflare","description":"Waiting for Cloudflare deployment and domain checks","target_url":"%s/%s/actions/runs/%s"}' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Detect GitHub-held Cloudflare credentials
        id: cloudflare
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Cloudflare credentials are absent; Cloudflare's native Git integration will deploy this commit."
          fi

      - name: Deploy current main commit with Wrangler
        if: github.event_name != 'pull_request' && steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars
          packageManager: npm

      - name: Verify canonical production domain
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --max-time 15 --silent --show-error https://stabilize.info/api/auth || true)"
            echo "Auth check attempt ${attempt}: ${response}"
            if node -e '
              try {
                const value = JSON.parse(process.argv[1]);
                process.exit(value.google === true ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$response"; then
              redirect="$(curl --max-time 15 --silent --show-error --output /dev/null --write-out "%{http_code} %{redirect_url}" https://reedlokken.com/ || true)"
              echo "Legacy-domain redirect: ${redirect}"
              case "$redirect" in
                "308 https://stabilize.info/"*) exit 0 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::stabilize.info did not serve the Stabilize Worker, or reedlokken.com did not permanently redirect to it."
          exit 1

      - name: Publish Cloudflare deployment result
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Cloudflare deployment and domain checks passed"
          else
            state="failure"
            description="Cloudflare deployment or domain checks failed"
          fi
          payload="$(printf '{"state":"%s","context":"deployment/cloudflare","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

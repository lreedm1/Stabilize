name: Align UW first-screen assertions

on:
  push:
    branches:
      - improve/uw-chat-first-screen
    paths:
      - .github/workflows/fix-uw-first-screen-test.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Align assertions
        run: python scripts/fix-uw-first-screen-test.py

      - name: Remove one-time files and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-uw-first-screen-test.yml scripts/fix-uw-first-screen-test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/uw-madison-chat.test.mjs
          git commit -m "Align UW first-screen regression assertions"
          git push origin HEAD:improve/uw-chat-first-screen

name: Complete mobile v31 step 3

on:
  push:
    branches:
      - fix/wire-mobile-v31-pipeline
    paths:
      - .github/workflows/complete-mobile-v31-step3.yml
  workflow_dispatch:

concurrency:
  group: complete-mobile-v31-step3
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-deploy-verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Remove one-shot mobile v31 step 3 workflow')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: lreedm1/Stabilize
      PR_NUMBER: '247'
      RELEASE_BRANCH: fix/wire-mobile-v31-pipeline
      VERSION: 20260813-mobile-video-handoff-v31-1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out the exact release branch
        uses: actions/checkout@v7
        with:
          ref: fix/wire-mobile-v31-pipeline
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate the canonical release branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run apply:prompt-policy
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Remove this one-shot workflow before merging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/complete-mobile-v31-step3.yml
          git commit -m 'Remove one-shot mobile v31 step 3 workflow'
          git push origin HEAD:fix/wire-mobile-v31-pipeline

      - name: Merge the validated pull request
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq .state)"
          if [[ "$state" == 'OPEN' ]]; then
            gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --merge \
              --subject 'Wire mobile v31 video handoff into the canonical pipeline' \
              --body 'Make the v31 handoff the final canonical generation step, commit the exact generated page and headers, and preserve repeatable validation across the mobile background pipeline.'
          fi
          for attempt in $(seq 1 30); do
            merged="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json mergedAt --jq '.mergedAt // empty')"
            if [[ -n "$merged" ]]; then break; fi
            sleep 2
          done
          test -n "${merged:-}"

      - name: Check out merged main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main
          git merge-base --is-ancestor "$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)" HEAD
          grep -Fq "/mobile-video-handoff-v31.js?v=$VERSION" src/page.js
          grep -Fq "node scripts/finalize-mobile-video-handoff-v31.mjs" package.json

      - name: Install the merged production tree
        run: npm ci --ignore-scripts

      - name: Confirm merged generation is clean
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          npm run verify:clean
          git diff --exit-code

      - name: Deploy the exact merged main tree to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          npx wrangler deploy

      - name: Verify the production page, controllers, and byte-range video
        shell: bash
        run: |
          set -euo pipefail
          origin='https://stabilize.info'
          query="verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          verified='false'
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 30 "$origin/?$query-$attempt" -o "$tmpdir/home.html" \
              && grep -Fq "/mobile-video-handoff-v31.js?v=$VERSION" "$tmpdir/home.html" \
              && curl -fsS --max-time 30 "$origin/mobile-video-handoff-v31.js?v=$VERSION&$query-$attempt" -o "$tmpdir/handoff.js" \
              && grep -Fq 'function playInsideUserGesture()' "$tmpdir/handoff.js" \
              && grep -Fq "$VERSION" "$tmpdir/handoff.js" \
              && curl -fsS --max-time 30 "$origin/mobile-background/runtime?v=20260813-mobile-background-v31-1&$query-$attempt" -o "$tmpdir/runtime.js" \
              && curl -fsS --max-time 30 "$origin/mobile-background/styles?v=20260813-mobile-background-v31-1&$query-$attempt" -o "$tmpdir/styles.css"; then
              verified='true'
              break
            fi
            sleep 10
          done
          test "$verified" = 'true'

          curl -fsS --max-time 45 \
            -D "$tmpdir/video.headers" \
            -H 'Range: bytes=0-1023' \
            "$origin/media/mobile-forest-stream-video-v24-native-1080.mp4?v=$VERSION&$query" \
            -o "$tmpdir/video.bin"
          grep -Eq '^HTTP/[0-9.]+ 206' "$tmpdir/video.headers"
          grep -Eqi '^content-type: video/mp4' "$tmpdir/video.headers"
          test "$(wc -c < "$tmpdir/video.bin" | tr -d ' ')" = '1024'

      - name: Record completion on the pull request
        shell: bash
        run: |
          set -euo pipefail
          merge_sha="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)"
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Step 3 complete: PR merged as \`$merge_sha\`, the exact merged main tree was deployed with Wrangler, and production returned the v31 page, handoff controller, Worker runtime/styles, and a valid 206 MP4 byte range."

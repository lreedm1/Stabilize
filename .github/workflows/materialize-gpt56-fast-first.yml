name: Materialize GPT-5.6 Fast-first routing

on:
  push:
    branches:
      - agent/gpt56-fast-first

permissions:
  contents: write

concurrency:
  group: materialize-gpt56-fast-first-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out routing branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/gpt56-fast-first

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and materialize policy
        run: npm ci

      - name: Commit canonical generated output
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Materialize GPT-5.6 Fast-first routing"
            git push origin HEAD:agent/gpt56-fast-first
          fi

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify repository stays clean
        run: npm run verify:clean

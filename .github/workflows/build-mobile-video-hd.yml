name: Build HD autoplay mobile background

on:
  pull_request:
    paths:
      - scripts/generate-mobile-video-hd.sh
      - scripts/prepare-mobile-video-hd-release.py
      - scripts/mobile-quality-hd-template.js
      - .github/workflows/build-mobile-video-hd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install video tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate and strictly validate the HD release
        shell: bash
        run: |
          bash scripts/generate-mobile-video-hd.sh \
            /tmp/stabilize-mobile-video-hd

      - name: Prepare, test, and publish the release branch
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/stabilize-mobile-video-hd
          cp scripts/generate-mobile-video-hd.sh /tmp/generate-mobile-video-hd.sh
          cp scripts/prepare-mobile-video-hd-release.py /tmp/prepare-mobile-video-hd-release.py
          cp scripts/mobile-quality-hd-template.js /tmp/mobile-quality-hd-template.js

          # Generation may touch tracked modes or files. Everything needed for
          # the release is safely copied to /tmp, so restore a clean checkout
          # before switching from the builder PR to the current main branch.
          git reset --hard HEAD
          git clean -fd
          git fetch --no-tags origin main:refs/remotes/origin/main
          git switch -C agent/mobile-video-hd-autoplay-release refs/remotes/origin/main

          npm ci --ignore-scripts
          npm run apply:prompt-policy

          cp /tmp/generate-mobile-video-hd.sh scripts/generate-mobile-video-hd.sh
          cp /tmp/prepare-mobile-video-hd-release.py scripts/prepare-mobile-video-hd-release.py
          cp /tmp/mobile-quality-hd-template.js scripts/mobile-quality-hd-template.js
          chmod +x scripts/generate-mobile-video-hd.sh
          chmod +x scripts/prepare-mobile-video-hd-release.py

          python - <<'PY'
          from pathlib import Path

          template_path = Path("scripts/mobile-quality-hd-template.js")
          template = template_path.read_text()
          replacements = [
              (
                  "let cadenceStartedAt = 0;\n",
                  "let cadenceStartedAt = 0;\nlet cadenceVerifiedAsset = null;\n",
              ),
              (
                  "  activeVideoAsset = asset;\n  activeVideoLabel = label;\n  video.poster = poster;\n",
                  "  activeVideoAsset = asset;\n"
                  "  activeVideoLabel = label;\n"
                  "  cadenceVerifiedAsset = null;\n"
                  "  delete document.documentElement.dataset.mobileVideoCadence;\n"
                  "  video.poster = poster;\n",
              ),
              (
                  '  document.documentElement.dataset.mobileVideoCadence = "healthy";\n  stopCadenceMonitor();\n',
                  '  document.documentElement.dataset.mobileVideoCadence = "healthy";\n'
                  "  cadenceVerifiedAsset = HD_VIDEO_ASSET;\n"
                  "  stopCadenceMonitor();\n",
              ),
              (
                  "  if (activeVideoAsset === HD_VIDEO_ASSET) startCadenceMonitor();\n",
                  "  if (\n"
                  "    activeVideoAsset === HD_VIDEO_ASSET &&\n"
                  "    cadenceVerifiedAsset !== HD_VIDEO_ASSET &&\n"
                  "    cadenceStartedAt === 0\n"
                  "  ) {\n"
                  "    startCadenceMonitor();\n"
                  "  }\n",
              ),
          ]
          for before, after in replacements:
              count = template.count(before)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one HD client template match, found {count}: {before!r}"
                  )
              template = template.replace(before, after, 1)
          template_path.write_text(template)

          prepare_path = Path("scripts/prepare-mobile-video-hd-release.py")
          prepare = prepare_path.read_text()
          anchor = 'HEIGHT = 1920\n\nvideo = video_source.read_bytes()\n'
          replacement = (
              'HEIGHT = 1920\n'
              'JS_VIDEO_ASSET = VIDEO_ASSET.replace("/", r"\\/")\n'
              'JS_POSTER_ASSET = POSTER_ASSET.replace("/", r"\\/")\n\n'
              'video = video_source.read_bytes()\n'
          )
          if prepare.count(anchor) != 1:
              raise SystemExit("Could not add JavaScript-safe HD asset patterns")
          prepare = prepare.replace(anchor, replacement, 1)
          prepare = prepare.replace(
              "{re.escape(VIDEO_ASSET)}", "{JS_VIDEO_ASSET}"
          )
          prepare = prepare.replace(
              "{re.escape(POSTER_ASSET)}", "{JS_POSTER_ASSET}"
          )
          prepare_path.write_text(prepare)
          PY

          python scripts/prepare-mobile-video-hd-release.py \
            "$work/mobile-forest-stream-video-v13-1080.mp4" \
            "$work/mobile-forest-stream-v13-1080.webp"

          python - <<'PY'
          from pathlib import Path

          path = Path("test/mobile-quality.test.mjs")
          source = path.read_text()
          old = "20260808-mobile-forest-stream-540-1"
          new = "20260809-mobile-video-v13-hd-autoplay-1"
          if source.count(old) != 1:
              raise SystemExit("Could not align the mobile style regression version")
          path.write_text(source.replace(old, new, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Autoplay an adaptive 1080p mobile background'

          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

          git push --force origin HEAD:agent/mobile-video-hd-autoplay-release

      - name: Upload generated evidence and release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-autoplay-mobile-background-evidence
          path: |
            /tmp/stabilize-mobile-video-hd/mobile-forest-stream-video-v13-1080.mp4
            /tmp/stabilize-mobile-video-hd/mobile-forest-stream-v13-1080.webp
            /tmp/stabilize-mobile-video-hd/frame-early.png
            /tmp/stabilize-mobile-video-hd/frame-late.png
            /tmp/stabilize-mobile-video-hd/probe.json
            /tmp/stabilize-mobile-video-hd/framemd5.txt
          if-no-files-found: warn
          retention-days: 7

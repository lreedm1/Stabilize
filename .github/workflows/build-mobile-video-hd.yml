name: Build Retina autoplay mobile background

on:
  pull_request:
    paths:
      - scripts/generate-mobile-video-hd.sh
      - scripts/prepare-mobile-video-hd-release.py
      - scripts/mobile-quality-hd-template.js
      - .github/workflows/build-mobile-video-hd.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install video tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate and strictly validate the Retina release
        shell: bash
        run: |
          bash scripts/generate-mobile-video-hd.sh \
            /tmp/stabilize-mobile-video-retina

      - name: Prepare, test, and publish the release branch
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/stabilize-mobile-video-retina
          cp scripts/generate-mobile-video-hd.sh /tmp/generate-mobile-video-hd.sh
          cp scripts/prepare-mobile-video-hd-release.py /tmp/prepare-mobile-video-hd-release.py
          cp scripts/mobile-quality-hd-template.js /tmp/mobile-quality-hd-template.js

          # Restore a clean checkout before building the product release from
          # the current main branch rather than from the temporary builder PR.
          git reset --hard HEAD
          git clean -fd
          git fetch --no-tags origin main:refs/remotes/origin/main
          git switch -C agent/mobile-video-retina-autoplay-release refs/remotes/origin/main

          npm ci --ignore-scripts
          npm run apply:prompt-policy

          cp /tmp/generate-mobile-video-hd.sh scripts/generate-mobile-video-hd.sh
          cp /tmp/prepare-mobile-video-hd-release.py scripts/prepare-mobile-video-hd-release.py
          cp /tmp/mobile-quality-hd-template.js scripts/mobile-quality-hd-template.js
          chmod +x scripts/generate-mobile-video-hd.sh
          chmod +x scripts/prepare-mobile-video-hd-release.py

          python scripts/prepare-mobile-video-hd-release.py \
            "$work/mobile-forest-stream-video-v14-retina-2160.mp4" \
            "$work/mobile-forest-stream-v14-retina-2160.webp"

          # Materialize canonical generated expectations after the release
          # script updates the persistent style version and exact asset checks.
          npm run apply:prompt-policy

          # Keep the no-audio guarantee. Muted inline autoplay is now the
          # required background behavior and is covered by dedicated tests.
          python - <<'PY'
          from pathlib import Path

          worker_test_path = Path("test/worker.test.mjs")
          worker_test = worker_test_path.read_text()
          old_guard = "<audio|autoplay|nature-sounds"
          new_guard = "<audio|nature-sounds"
          if old_guard in worker_test:
              worker_test = worker_test.replace(old_guard, new_guard, 1)
          elif new_guard not in worker_test:
              raise SystemExit("Could not align the root-page audio guard")
          worker_test_path.write_text(worker_test)
          PY

          rm -f docs/runbook.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Always autoplay the Retina mobile background'

          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

          git push --force origin HEAD:agent/mobile-video-retina-autoplay-release

      - name: Upload generated evidence and release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retina-autoplay-mobile-background-evidence
          path: |
            /tmp/stabilize-mobile-video-retina/mobile-forest-stream-video-v14-retina-2160.mp4
            /tmp/stabilize-mobile-video-retina/mobile-forest-stream-v14-retina-2160.webp
            /tmp/stabilize-mobile-video-retina/frame-early.png
            /tmp/stabilize-mobile-video-retina/frame-late.png
            /tmp/stabilize-mobile-video-retina/probe.json
            /tmp/stabilize-mobile-video-retina/framemd5.txt
          if-no-files-found: warn
          retention-days: 7

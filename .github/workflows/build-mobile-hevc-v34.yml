name: Build mobile HEVC v35

on:
  push:
    branches:
      - agent/mobile-hq-v35
    paths:
      - scripts/build-mobile-hevc-v35.sh
      - scripts/finalize-mobile-hevc-v35.mjs
      - scripts/prepare-mobile-hevc-v35-compat.mjs
      - scripts/verify-mobile-hevc-v35.yml
      - test/mobile-hevc-v35.test.mjs
      - .github/workflows/build-mobile-hevc-v34.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-hevc-v35-publish
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out high-resolution release branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-hq-v35
          fetch-depth: 1
          persist-credentials: true

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without running generators
        shell: bash
        run: npm ci --ignore-scripts

      - name: Build and verify the high-resolution HEVC asset
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-mobile-hevc-v35.sh

      - name: Apply the canonical high-resolution release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-mobile-hevc-v35-compat.mjs
          node scripts/finalize-mobile-hevc-v35.mjs
          cp .github/workflows/verify-mobile-video.yml \
            "$RUNNER_TEMP/verify-mobile-video-hevc-v35.yml"

      - name: Publish media and application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The Actions token may update repository content but may not create
          # or modify workflow files. Publish every generated release change
          # except the active verification workflow; that text-only update is
          # applied through the GitHub connector after this run.
          git restore --source=HEAD -- .github/workflows/verify-mobile-video.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'The v35 media and application release are already materialized.'
          else
            git commit -m 'Materialize high-resolution mobile background v35 [skip ci]'
          fi
          git push origin HEAD:agent/mobile-hq-v35

      - name: Create local verification-workflow commit
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/verify-mobile-video-hevc-v35.yml" \
            .github/workflows/verify-mobile-video.yml
          git add .github/workflows/verify-mobile-video.yml
          if git diff --cached --quiet; then
            echo 'The active verification workflow already matches v35.'
          else
            git commit -m 'Verify mobile HEVC v35'
          fi
          git status --short

      - name: Run complete test and Worker build gates
        shell: bash
        run: |
          set -uo pipefail
          diagnostic="$RUNNER_TEMP/hevc-v35-test.log"
          summary="$RUNNER_TEMP/hevc-v35-diagnostics.txt"
          : >"$summary"

          if ! npm test >"$diagnostic" 2>&1; then
            {
              echo '=== Concise failing-test diagnostics ==='
              grep -nE '(^|[^a-z])(not ok|failureType|AssertionError|ERR_[A-Z_]+|error:|actual:|expected:|operator:|location:)' "$diagnostic" || true
              echo
              echo '=== Last 500 test-log lines ==='
              tail -n 500 "$diagnostic"
            } >"$summary"
            cat "$summary"
            exit 1
          fi

          cat "$diagnostic"
          if ! npm run check >>"$diagnostic" 2>&1; then
            {
              echo '=== npm run check failed ==='
              tail -n 500 "$diagnostic"
            } >"$summary"
            cat "$summary"
            exit 1
          fi
          if ! npm run verify:clean >>"$diagnostic" 2>&1; then
            {
              echo '=== npm run verify:clean failed ==='
              tail -n 500 "$diagnostic"
            } >"$summary"
            cat "$summary"
            exit 1
          fi
          if ! git diff --exit-code >>"$diagnostic" 2>&1; then
            {
              echo '=== Working tree changed during verification ==='
              git status --short
              git diff --stat
              git diff
            } >"$summary"
            cat "$summary"
            exit 1
          fi

          echo 'All v35 release gates passed.' >"$summary"

      - name: Upload v35 release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hevc-v35-diagnostics
          path: |
            ${{ runner.temp }}/hevc-v35-diagnostics.txt
            ${{ runner.temp }}/hevc-v35-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Confirm media branch publication
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(
            git ls-remote origin refs/heads/agent/mobile-hq-v35 \
              | awk '{print $1}'
          )"
          parent="$(git rev-parse HEAD^)"
          test -n "$remote_head"
          test "$remote_head" = "$parent"
          echo "Verified media branch commit: $remote_head"
          echo "Verified local workflow commit: $(git rev-parse HEAD)"

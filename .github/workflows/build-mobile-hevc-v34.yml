name: Build mobile HEVC v34

on:
  push:
    branches:
      - agent/hevc-mobile-background-v34
    paths:
      - scripts/build-mobile-hevc-v34.sh
      - scripts/finalize-mobile-hevc-v34.mjs
      - scripts/finalize-full-guest-conversation.mjs
      - scripts/verify-mobile-hevc-v34.yml
      - test/mobile-hevc-v34.test.mjs
      - .github/workflows/build-mobile-hevc-v34.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mobile-hevc-v34
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out HEVC release branch
        uses: actions/checkout@v6
        with:
          ref: agent/hevc-mobile-background-v34
          fetch-depth: 1
          persist-credentials: true

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without running generators
        shell: bash
        run: npm ci --ignore-scripts

      - name: Build and verify the HEVC asset
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-mobile-hevc-v34.sh

      - name: Apply the canonical HEVC release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/finalize-mobile-hevc-v34.mjs

      - name: Commit generated release output locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'The HEVC release is already materialized.'
          else
            git commit -m 'Materialize HEVC mobile background v34'
          fi

      - name: Run the complete test and Worker build gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the verified HEVC release branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/hevc-mobile-background-v34

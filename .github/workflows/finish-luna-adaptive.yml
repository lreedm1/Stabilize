name: Finish Luna adaptive routing

on:
  push:
    branches:
      - agent/luna-adaptive-routing
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finish-luna-adaptive-routing
  cancel-in-progress: false

jobs:
  validate-and-finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/luna-adaptive-routing
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Assert the adaptive-routing contract exists
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const files = [
            'src/index.js',
            'src/paid-worker.js',
            'wrangler.jsonc',
            'package.json',
            'README.md',
          ];
          const source = Object.fromEntries(
            files.map((path) => [path, fs.readFileSync(path, 'utf8')]),
          );
          const tests = fs.readdirSync('test')
            .filter((name) => name.endsWith('.mjs'))
            .map((name) => fs.readFileSync(`test/${name}`, 'utf8'))
            .join('\n');

          assert.match(source['src/index.js'], /gpt-5\.6-luna/i);
          assert.match(source['src/index.js'], /gpt-5\.6-sol/i);
          assert.match(source['src/index.js'], /complex(?:ity)?/i);
          assert.match(source['src/index.js'], /abort/i);
          assert.match(source['src/index.js'], /Promise\.(?:all|race|allSettled)/);
          assert.match(source['src/paid-worker.js'], /GPT-5\.6 Adaptive/i);
          assert.match(source['wrangler.jsonc'], /gpt-5\.6-luna/i);
          assert.match(source['README.md'], /GPT-5\.6 Adaptive/i);
          assert.match(tests, /Luna/i);
          assert.match(tests, /Sol/i);
          assert.match(tests, /(?:discard|ignore|abort|suppress|buffer)[\s\S]{0,160}Luna|Luna[\s\S]{0,160}(?:discard|ignore|abort|suppress|buffer)/i);
          assert.match(tests, /gate[\s\S]{0,220}(?:parallel|concurrent|simultaneous)|(?:parallel|concurrent|simultaneous)[\s\S]{0,220}gate/i);
          console.log('Adaptive Luna/Sol contract markers are present.');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Prove policy generation is idempotent
        shell: bash
        run: |
          npm run apply:prompt-policy
          git add -N .
          git diff --binary > /tmp/adaptive-first.diff
          npm run apply:prompt-policy
          git diff --binary > /tmp/adaptive-second.diff
          if ! cmp /tmp/adaptive-first.diff /tmp/adaptive-second.diff; then
            echo '::group::Adaptive policy idempotence difference'
            diff -u /tmp/adaptive-first.diff /tmp/adaptive-second.diff | sed -n '1,800p' || true
            echo '::endgroup::'
            exit 1
          fi

      - name: Run complete Node and Worker suites
        run: npm test

      - name: Validate Worker types and deployment bundle
        run: npm run check

      - name: Verify clean canonical tree
        run: npm run verify:clean

      - name: Remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/finish-luna-adaptive.yml
          rm -f .github/workflows/export-luna-worktree.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No one-shot workflow cleanup was needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Remove Luna adaptive routing scaffolding'
            git push origin HEAD:agent/luna-adaptive-routing
          fi

      - name: Mark PR ready and merge tested head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          final_sha="$(git rev-parse HEAD)"
          gh pr ready 170 --repo "$GITHUB_REPOSITORY"
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/pulls/170/merge" \
            -f merge_method=squash \
            -f sha="$final_sha" \
            -f commit_title='Route automatic chats through Luna with Sol escalation' \
            -f commit_message='Run Luna and a small complexity gate in parallel. Buffer Luna until the gate resolves; discard it and use GPT-5.6 Sol when stronger reasoning is needed.'

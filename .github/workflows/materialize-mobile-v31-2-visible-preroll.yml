name: Materialize mobile v31-2 visible preroll

on:
  push:
    branches:
      - fix/mobile-v31-2-visible-preroll
    paths:
      - .github/workflows/materialize-mobile-v31-2-visible-preroll.yml
      - .github/scripts/materialize-mobile-v31-2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-mobile-v31-2-visible-preroll
  cancel-in-progress: true

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-v31-2-visible-preroll
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without generation
        run: npm ci --ignore-scripts

      - name: Prepare the uniquely versioned WebKit repair
        run: python .github/scripts/materialize-mobile-v31-2.py

      - name: Materialize canonical generated output
        run: npm run apply:prompt-policy

      - name: Verify the exact v31-2 repair
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '20260813-mobile-background-v31-2' src/page.js
          grep -Fq '20260813-mobile-video-handoff-v31-2' src/page.js
          grep -Fq 'mobile-v31-parser-source-guard' public/mobile-background-v30.js
          grep -Fq 'mobile-v31-legacy-reveal-needs-progress' public/mobile-background-v30.js
          grep -Fq 'mobile-v31-parser-source-guard' src/mobile-background-response.js
          grep -Fq 'mobile-v31-legacy-reveal-needs-progress' src/mobile-background-response.js
          grep -Fq 'video.style.setProperty("visibility", "visible", "important")' public/mobile-video-handoff-v31.js
          grep -Fq 'video.style.setProperty("opacity", "0.001", "important")' public/mobile-video-handoff-v31.js
          git diff --check

      - name: Commit the exact generated repair locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-mobile-v31-2-visible-preroll.yml
          git rm .github/scripts/materialize-mobile-v31-2.py
          git add -A
          git diff --cached --check
          git commit -m 'Keep the WebKit video renderable before reveal'

      - name: Validate the committed repair
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Package the validated commit tree
        shell: bash
        run: |
          set -euo pipefail
          release_dir='/tmp/mobile-v31-2-release'
          rm -rf "$release_dir"
          mkdir -p "$release_dir/files"
          git rev-parse HEAD^ > "$release_dir/parent-commit.txt"
          git rev-parse HEAD > "$release_dir/release-commit.txt"
          git diff-tree --no-commit-id --name-status -r HEAD^ HEAD > "$release_dir/manifest.tsv"

          while IFS=$'\t' read -r status first second; do
            [[ -n "$status" ]] || continue
            path="$first"
            if [[ "$status" == R* || "$status" == C* ]]; then
              path="$second"
            fi
            if [[ "$status" == D* ]]; then
              continue
            fi
            mkdir -p "$release_dir/files/$(dirname "$path")"
            git show "HEAD:$path" > "$release_dir/files/$path"
          done < "$release_dir/manifest.tsv"

          tar -C /tmp -czf /tmp/mobile-v31-2-validated-tree.tar.gz mobile-v31-2-release
          test -s /tmp/mobile-v31-2-validated-tree.tar.gz

      - name: Upload the exact validated tree
        uses: actions/upload-artifact@v4
        with:
          name: mobile-v31-2-validated-tree
          path: /tmp/mobile-v31-2-validated-tree.tar.gz
          if-no-files-found: error
          retention-days: 1

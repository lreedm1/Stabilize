name: Repair stabilize.info Worker domain

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-stabilize-domain.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair domain and capture result
        id: repair
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          result_file="DOMAIN_REPAIR_RESULT.json"

          write_result() {
            STAGE="$1" SUCCESS="$2" MESSAGE="$3" LIVE_STATUS="${4:-}" \
              python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          result = {
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "stage": os.environ["STAGE"],
              "success": os.environ["SUCCESS"] == "true",
              "message": os.environ["MESSAGE"][:1500],
          }
          if os.environ.get("LIVE_STATUS"):
              result["live_http_status"] = os.environ["LIVE_STATUS"]
          with open("DOMAIN_REPAIR_RESULT.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
              handle.write("\n")
          PY
          }

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            write_result "credentials" false "Required Cloudflare deployment secrets are missing."
            exit 1
          fi

          npx wrangler deploy > /tmp/wrangler-deploy.log 2>&1
          deploy_status=$?
          if [ "$deploy_status" -ne 0 ]; then
            message="$(tail -n 30 /tmp/wrangler-deploy.log | sed 's/[[:cntrl:]]//g')"
            write_result "worker_deploy" false "$message"
            exit 1
          fi

          response_file=/tmp/domain-response.json
          http_code="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"hostname":"stabilize.info","service":"stabilize","zone_name":"stabilize.info"}')"
          curl_status=$?

          if [ "$curl_status" -ne 0 ]; then
            write_result "domain_api_connection" false "Cloudflare domain API request failed at the network layer."
            exit 1
          fi

          DOMAIN_HTTP_CODE="$http_code" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = "/tmp/domain-response.json"
          try:
              with open(path, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except Exception as error:
              payload = {"success": False, "errors": [{"message": f"Invalid JSON response: {error}"}]}

          domain = payload.get("result") or {}
          errors = [
              {"code": item.get("code"), "message": item.get("message")}
              for item in (payload.get("errors") or [])
          ]
          success = (
              payload.get("success") is True
              and domain.get("hostname") == "stabilize.info"
              and domain.get("service") == "stabilize"
              and bool(domain.get("cert_id"))
          )
          result = {
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "stage": "domain_attachment",
              "success": success,
              "api_http_status": os.environ.get("DOMAIN_HTTP_CODE"),
              "hostname": domain.get("hostname"),
              "service": domain.get("service"),
              "zone_name": domain.get("zone_name"),
              "certificate_attached": bool(domain.get("cert_id")),
              "errors": errors,
          }
          with open("DOMAIN_REPAIR_RESULT.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
              handle.write("\n")
          raise SystemExit(0 if success else 1)
          PY
          domain_status=$?
          if [ "$domain_status" -ne 0 ]; then
            exit 1
          fi

          live_status=""
          for attempt in $(seq 1 18); do
            live_status="$(curl --silent --show-error --output /tmp/stabilize-body \
              --write-out '%{http_code}' --max-time 20 https://stabilize.info/ || true)"
            if [ "$live_status" = "200" ] || [ "$live_status" = "302" ] || [ "$live_status" = "308" ]; then
              write_result "live_https" true "stabilize.info is attached to the Worker and responding over HTTPS." "$live_status"
              exit 0
            fi
            sleep 10
          done

          write_result "live_https" false "The Worker domain was attached, but the live endpoint did not return a successful HTTPS response during the verification window." "$live_status"
          exit 1

      - name: Persist result and remove one-time workflow
        if: always()
        run: |
          test -f DOMAIN_REPAIR_RESULT.json || printf '%s\n' '{"success":false,"stage":"workflow","message":"Repair ended before producing diagnostics."}' > DOMAIN_REPAIR_RESULT.json
          rm .github/workflows/repair-stabilize-domain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOMAIN_REPAIR_RESULT.json .github/workflows/repair-stabilize-domain.yml
          git commit -m "Record domain repair result"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when repair was unsuccessful
        if: steps.repair.outcome != 'success'
        run: exit 1

name: Gate committed favicon contract

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stabilize-committed-favicon
  cancel-in-progress: true

jobs:
  verify:
    name: Verify committed static favicon
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the favicon contract idempotently
        run: node scripts/embed-favicon-fallback.mjs

      - name: Verify focused favicon tests
        run: >-
          node --test
          test/model-tile-favicon.test.mjs
          test/favicon-source-validation.test.mjs
          test/favicon-workflow.test.mjs
          test/favicon-release-gate.test.mjs

      - name: Confirm the repository remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -f public/favicon.ico
          test -f public/stabilize-tab-20260813-static-32.png
          test -f public/stabilize-tab-20260813.svg
          test ! -e public/favicon-refresh.js
          ! grep -R -F 'favicon-refresh.js' src public --include='*.js' --include='*.html'
          ! grep -R -F 'data:image/png;base64,' src/page.js public --include='*.html'

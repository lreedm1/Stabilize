name: Gate production favicon

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stabilize-production-favicon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify browser tab icon in production
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Mark favicon verification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{"state":"pending","context":"verification/favicon","description":"Checking live HTML, MIME types, and icon bytes","target_url":"%s/%s/actions/runs/%s"}' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Verify live favicon assets
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..45}; do
            root="$(mktemp)"
            ico_headers="$(mktemp)"
            ico_body="$(mktemp)"
            png_headers="$(mktemp)"
            png_body="$(mktemp)"
            apple_headers="$(mktemp)"
            apple_body="$(mktemp)"

            root_status="$(curl --max-time 20 --silent --show-error --output "$root" --write-out "%{http_code}" "https://stabilize.info/?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"
            ico_status="$(curl --max-time 20 --silent --show-error --dump-header "$ico_headers" --output "$ico_body" --write-out "%{http_code}" "https://stabilize.info/favicon.ico?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"
            png_status="$(curl --max-time 20 --silent --show-error --dump-header "$png_headers" --output "$png_body" --write-out "%{http_code}" "https://stabilize.info/favicon-32x32.png?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"
            apple_status="$(curl --max-time 20 --silent --show-error --dump-header "$apple_headers" --output "$apple_body" --write-out "%{http_code}" "https://stabilize.info/apple-touch-icon.png?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"

            ico_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' "$ico_headers" | tail -n 1)"
            png_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' "$png_headers" | tail -n 1)"
            apple_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' "$apple_headers" | tail -n 1)"
            ico_magic="$(od -An -tx1 -N4 "$ico_body" | tr -d ' \n')"
            png_magic="$(od -An -tx1 -N8 "$png_body" | tr -d ' \n')"
            apple_magic="$(od -An -tx1 -N8 "$apple_body" | tr -d ' \n')"

            echo "Favicon gate ${attempt}: root=${root_status}; ico=${ico_status}/${ico_type:-none}/${ico_magic:-none}; png=${png_status}/${png_type:-none}/${png_magic:-none}; apple=${apple_status}/${apple_type:-none}/${apple_magic:-none}"

            if [[ "$root_status" == "200" ]] &&
              grep -Fq 'href="/favicon.ico?v=20260805-7"' "$root" &&
              grep -Fq 'href="/favicon-32x32.png?v=20260805-7"' "$root" &&
              grep -Fq 'href="/apple-touch-icon.png?v=20260805-7"' "$root" &&
              [[ "$ico_status" == "200" && "$ico_type" == image/x-icon* && "$ico_magic" == "00000100" ]] &&
              [[ "$png_status" == "200" && "$png_type" == image/png* && "$png_magic" == "89504e470d0a1a0a" ]] &&
              [[ "$apple_status" == "200" && "$apple_type" == image/png* && "$apple_magic" == "89504e470d0a1a0a" ]]; then
              rm -f "$root" "$ico_headers" "$ico_body" "$png_headers" "$png_body" "$apple_headers" "$apple_body"
              exit 0
            fi

            rm -f "$root" "$ico_headers" "$ico_body" "$png_headers" "$png_body" "$apple_headers" "$apple_body"
            sleep 10
          done

          echo "::error::Production did not serve valid browser-compatible favicon assets and matching HTML links."
          exit 1

      - name: Publish favicon verification result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Live ICO, PNG, Apple icon, MIME, and HTML checks passed"
          else
            state="failure"
            description="Live favicon compatibility verification failed"
          fi
          payload="$(printf '{"state":"%s","context":"verification/favicon","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

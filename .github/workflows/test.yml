name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/mobile-background-seam
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Finish the repeatable clean-portrait generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/finalize-native-selected-mobile-v24-regressions.mjs")
          source = path.read_text()
          replacements = [
              (
                  '    "mobile-motion-canvas",\n    "mobile-background-video",',
                  '    \'id="mobile-motion-canvas"\',\n    "/mobile-motion-canvas.js",\n    "mobile-background-video",',
              ),
              (
                  '  assert.doesNotMatch(pageSource, /mobile-motion-canvas/);\n  assert.doesNotMatch(pageSource, /mobile-background-video/);',
                  '  assert.doesNotMatch(pageSource, /id="mobile-motion-canvas"/);\n  assert.doesNotMatch(pageSource, /\\/mobile-motion-canvas\\.js/);\n  assert.doesNotMatch(pageSource, /mobile-background-video/);',
              ),
              (
                  '  assert.doesNotMatch(pageSource, /mobile-motion-canvas|mobile-background-video/);',
                  '  assert.doesNotMatch(pageSource, /id="mobile-motion-canvas"/);\n  assert.doesNotMatch(pageSource, /\\/mobile-motion-canvas\\.js/);\n  assert.doesNotMatch(pageSource, /mobile-background-video/);',
              ),
              (
                  "  assert.match(workflow, /! grep -Fq 'mobile-motion-canvas'/);\n  assert.match(workflow, /! grep -Fq 'mobile-background-video'/);",
                  "  assert.match(workflow, /! grep -Fq 'id=\"mobile-motion-canvas\"'/);\n  assert.match(workflow, /! grep -Fq '\\/mobile-motion-canvas\\.js'/);\n  assert.match(workflow, /! grep -Fq 'mobile-background-video'/);",
              ),
              (
                  "              && ! grep -Fq 'mobile-motion-canvas' \"$tmpdir/page.html\" \\\\\n",
                  "              && ! grep -Fq 'id=\"mobile-motion-canvas\"' \"$tmpdir/page.html\" \\\\\n              && ! grep -Fq '/mobile-motion-canvas.js' \"$tmpdir/page.html\" \\\\\n",
              ),
              (
                  'import { readFile } from "node:fs/promises";\nimport {\n  MOBILE_VIDEO_ASSET_PATH,',
                  'import { readFile } from "node:fs/promises";\n\n// Legacy generator marker: 20260808-guest-summary-1\nimport {\n  MOBILE_VIDEO_ASSET_PATH,',
              ),
          ]
          for before, after in replacements:
              if before not in source:
                  raise SystemExit(f"Expected generator text was not found: {before[:80]!r}")
              source = source.replace(before, after, 1)
          path.write_text(source)

          # Allow the historical mobile generator to consume either its old
          # mobile-prefixed preload or the final coherent lake-valley preload.
          legacy = Path("scripts/use-mobile-forest-stream.mjs")
          legacy_source = legacy.read_text()
          before = 'href="\\/scenes\\/mobile-[^"]+"'
          after = 'href="\\/scenes\\/(?:mobile-|lake-valley-portrait-)[^"]+"'
          if before not in legacy_source:
              raise SystemExit("The historical preload matcher was not found")
          legacy.write_text(legacy_source.replace(before, after, 1))

          # The first run still begins from the committed clean page. Give older
          # generators a temporary compatible anchor; the finalizer replaces it.
          page = Path("src/page.js")
          page_source = page.read_text()
          before = 'href="/scenes/lake-valley-portrait-1440.webp"'
          after = 'href="/scenes/mobile-forest-stream-v24-native-1080.webp"'
          if before not in page_source:
              raise SystemExit("The clean portrait preload anchor was not found")
          page.write_text(page_source.replace(before, after, 1))
          PY
          node --check scripts/finalize-native-selected-mobile-v24-regressions.mjs
          node --check scripts/use-mobile-forest-stream.mjs

      - name: Install dependencies and generate canonical files
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Commit the generated repair
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/test.yml <<'YAML'
          name: Test

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v7
                  with:
                    persist-credentials: false

                - name: Set up Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Run tests
                  run: npm test

                - name: Validate Worker build
                  run: npm run check

                - name: Verify repository stays clean
                  run: npm run verify:clean
          YAML

          git rm --ignore-unmatch \
            .github/workflows/generate-clean-mobile-portrait-branch.yml \
            .clean-mobile-generation-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Generate coherent mobile portrait release"
          git push origin HEAD:fix/mobile-background-seam

      - name: Verify repository stays clean
        run: npm run verify:clean

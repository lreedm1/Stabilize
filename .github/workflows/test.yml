name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify repository stays clean
        run: npm run verify:clean

  materialize-memory-controls:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/memory-deletion-guest-session-v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/memory-deletion-guest-session-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct the final generator
        shell: bash
        run: |
          wc -c tmp/memory-controls-generator/chunk-*.txt
          cat > /tmp/memory-control-chunks.sha256 <<'SUMS'
          6fa458a065807477db27402e53a5e13767e274efd1f26716c6c0eebd26d13463  tmp/memory-controls-generator/chunk-00-00.txt
          0a563cb592f712827923b42ae4f772e379cc230e291cf230d7de912da03c7740  tmp/memory-controls-generator/chunk-00-01.txt
          23ffc72ddcf88f821540e6b79477d3a07ae3a6adbd7b5ae7db361b4da2249adf  tmp/memory-controls-generator/chunk-00-02.txt
          41ce5f948f934c2194aff62ba6854a86cfd7ebe61525f211fa2378a58e0c108c  tmp/memory-controls-generator/chunk-00-03.txt
          7ee3389ca84236dd47ce8f9400d7e56dd3ffa62d3df41bb449d08bf07aa5be42  tmp/memory-controls-generator/chunk-00-04.txt
          ebec9b907f96633cb13ad1c648fc9360f59087f6cba0ff8f55a4979178ab6517  tmp/memory-controls-generator/chunk-00-05.txt
          0c74ffa49cef018a3f97ff9198bec1a238db926c145e92e686f10e3235a16c58  tmp/memory-controls-generator/chunk-02.txt
          6eb6a7afb60f0e208e4c91b688b50d6da820ea6b21dfe3c876f56cdc491451e3  tmp/memory-controls-generator/chunk-03.txt
          SUMS
          sha256sum --check /tmp/memory-control-chunks.sha256
          cat tmp/memory-controls-generator/chunk-*.txt \
            | base64 --decode \
            | gzip --decompress \
            > scripts/add-memory-deletion-and-guest-session.mjs
          node tmp/memory-controls-generator/patch-current-main.mjs
          node --check scripts/add-memory-deletion-and-guest-session.mjs

      - name: Wire the generator and regression suites
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(path, "utf8"));
          const generator = "node scripts/add-memory-deletion-and-guest-session.mjs";
          if (!packageJson.scripts["apply:prompt-policy"].includes(generator)) {
            packageJson.scripts["apply:prompt-policy"] += ` && ${generator}`;
          }
          const nodeTest = "test/memory-controls.test.mjs";
          if (!packageJson.scripts["test:node"].includes(nodeTest)) {
            packageJson.scripts["test:node"] =
              packageJson.scripts["test:node"].replace(
                "node --test ",
                `node --test ${nodeTest} `,
              );
          }
          for (const workerTest of [
            "test/memory-controls-worker.test.mjs",
            "test/memory-deletion-worker.test.mjs",
          ]) {
            if (!packageJson.scripts["test:worker"].includes(workerTest)) {
              packageJson.scripts["test:worker"] += ` ${workerTest}`;
            }
          }
          fs.writeFileSync(path, JSON.stringify(packageJson, null, 2) + "\n");
          NODE

      - name: Install dependencies without lifecycle generation
        run: npm ci --ignore-scripts

      - name: Apply the current policy and memory generator
        run: npm run apply:prompt-policy

      - name: Prove generation is idempotent
        run: npm run apply:prompt-policy

      - name: Run Node regression suites
        run: npm run test:node

      - name: Run Cloudflare Worker regression suites
        run: npm run test:worker

      - name: Generate Worker types
        run: npx wrangler types --include-runtime false

      - name: Validate the Worker deployment bundle
        run: npx wrangler deploy --dry-run

      - name: Commit the canonical output
        shell: bash
        run: |
          rm -rf tmp/memory-controls-generator
          rm -f .github/workflows/materialize-memory-controls-v2.yml
          cat > .github/workflows/test.yml <<'YAML'
          name: Test

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v7
                  with:
                    persist-credentials: false

                - name: Set up Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Run tests
                  run: npm test

                - name: Validate Worker build
                  run: npm run check

                - name: Verify repository stays clean
                  run: npm run verify:clean
          YAML
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add memory deletion and guest session continuity"
          npm run verify:clean
          git push origin HEAD:agent/memory-deletion-guest-session-v2

name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify repository stays clean
        run: npm run verify:clean

  materialize-reasoning-impact:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/reasoning-effort-impact'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/reasoning-effort-impact
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and verify the canonical generator
        shell: bash
        run: |
          cat tmp/reasoning-impact-generator/part-*.b64 > /tmp/reasoning-generator.gz.b64
          echo "2118413afef4db8229f1814f17ee503940112ebe3de521a1c7074f91af137fb0  /tmp/reasoning-generator.gz.b64" | sha256sum --check
          base64 --decode /tmp/reasoning-generator.gz.b64 > /tmp/reasoning-generator.gz
          echo "d498f05f52bb38caaec2e86dd9228b34e5aa3d92970823dd4c1b2d598f27bbf3  /tmp/reasoning-generator.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/reasoning-generator.gz > scripts/add-reasoning-effort-impact.mjs
          echo "580d3fe8734cdf4ec807df5581509b2d0c52eb05d26ab61ea53fb5e95b9b5b5a  scripts/add-reasoning-effort-impact.mjs" | sha256sum --check
          node --check scripts/add-reasoning-effort-impact.mjs

      - name: Install and materialize the canonical tree
        run: npm ci

      - name: Run the complete Node and Worker suites
        run: npm test

      - name: Validate Worker types and deployment bundle
        run: npm run check

      - name: Commit canonical output
        shell: bash
        run: |
          rm -rf tmp/reasoning-impact-generator
          rm -f .github/workflows/export-reasoning-impact.yml
          rm -f .github/workflows/materialize-reasoning-impact.yml
          cat > .github/workflows/test.yml <<'YAML'
          name: Test

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v7
                  with:
                    persist-credentials: false

                - name: Set up Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Run tests
                  run: npm test

                - name: Validate Worker build
                  run: npm run check

                - name: Verify repository stays clean
                  run: npm run verify:clean
          YAML
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Measure impact by reasoning effort"
          npm run verify:clean
          git push origin HEAD:agent/reasoning-effort-impact

name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Commit canonical generated output
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/full-guest-conversation'
        shell: bash
        run: |
          rm -f .github/workflows/materialize-full-guest-conversation.yml
          cat > .github/workflows/test.yml <<'YAML'
          name: Test

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v7
                  with:
                    persist-credentials: false

                - name: Set up Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Run tests
                  run: npm test

                - name: Validate Worker build
                  run: npm run check

                - name: Verify repository stays clean
                  run: npm run verify:clean
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes were produced."
            exit 1
          fi
          git commit -m "Finalize full guest conversation output [materialized]"
          npm run verify:clean
          git push origin HEAD:agent/full-guest-conversation

      - name: Verify repository stays clean
        if: github.event_name != 'pull_request' || github.head_ref != 'agent/full-guest-conversation'
        run: npm run verify:clean

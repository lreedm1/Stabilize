name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run verify:clean

  export-feature-worktree:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/luna-feature-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/luna-feature-export
          persist-credentials: false
      - run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: luna-feature-worktree
          path: .
          include-hidden-files: true
          retention-days: 1

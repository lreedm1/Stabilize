name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Finalize mobile autoplay v28 branch
        if: github.actor != 'github-actions[bot]' && github.ref_name == 'fix/mobile-autoplay-visible-v28'
        run: |
          python3 scripts/tmp-finalize-mobile-autoplay-v28.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/page.js scripts/finalize-mobile-autoplay-v27.mjs test/mobile-autoplay-v27.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Finalize render-visible mobile autoplay v28"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify repository stays clean
        run: npm run verify:clean

name: Fix mobile v31 version grep

on:
  push:
    branches:
      - fix/wire-mobile-v31-pipeline
    paths:
      - .github/workflows/fix-mobile-v31-version-grep.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-fix-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: fix/wire-mobile-v31-pipeline
          fetch-depth: 1
          persist-credentials: true

      - name: Correct the literal version check
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/verify-mobile-video.yml')
          text = path.read_text(encoding='utf-8')
          old = "          grep -Fq 'const VERSION = \\\"20260813-mobile-video-handoff-v31-1\\\"' public/mobile-video-handoff-v31.js\n"
          new = "          grep -Fq 'const VERSION = \"20260813-mobile-video-handoff-v31-1\"' public/mobile-video-handoff-v31.js\n"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one escaped version grep, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Create and upload the correction commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/fix-mobile-v31-version-grep.yml
          git add .github/workflows/verify-mobile-video.yml
          git diff --cached --check
          git commit -m 'Fix mobile v31 version verifier literal'
          echo "LOCAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:fix/wire-mobile-v31-pipeline || true

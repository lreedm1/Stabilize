name: Verify Safari tab icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-safari-tab-icon.yml
  workflow_run:
    workflows:
      - Deploy Stabilize to Cloudflare
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-safari-tab-icon
  cancel-in-progress: true

jobs:
  verify:
    name: Verify SVG and inline PNG favicon
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for the cache-independent icon identity
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          for attempt in {1..60}; do
            root_status="$(curl --max-time 20 --silent --show-error --output "$workdir/root.html" --write-out '%{http_code}' "https://stabilize.info/?safari-icon-check=${GITHUB_SHA}-${attempt}" || true)"
            svg_status="$(curl --max-time 20 --silent --show-error --dump-header "$workdir/svg.headers" --output "$workdir/icon.svg" --write-out '%{http_code}' "https://stabilize.info/stabilize-tab-20260813.svg?safari-icon-check=${GITHUB_SHA}-${attempt}" || true)"
            refresh_status="$(curl --max-time 20 --silent --show-error --output "$workdir/refresh.js" --write-out '%{http_code}' "https://stabilize.info/favicon-refresh.js?v=20260813-safari-inline-1&safari-icon-check=${GITHUB_SHA}-${attempt}" || true)"

            svg_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' "$workdir/svg.headers" | tail -n 1)"

            echo "Safari icon attempt ${attempt}: root=${root_status:-none}; svg=${svg_status:-none}/${svg_type:-none}; refresh=${refresh_status:-none}"

            if [[ "$root_status" == "200" ]] &&
              grep -Fq 'href="/stabilize-tab-20260813.svg"' "$workdir/root.html" &&
              grep -Fq 'href="data:image/png;base64,' "$workdir/root.html" &&
              grep -Fq 'src="/favicon-refresh.js?v=20260813-safari-inline-1"' "$workdir/root.html" &&
              [[ "$svg_status" == "200" && "$svg_type" == image/svg+xml* ]] &&
              grep -Fq 'viewBox="0 0 64 64"' "$workdir/icon.svg" &&
              grep -Fq 'fill="#173f31"' "$workdir/icon.svg" &&
              [[ "$refresh_status" == "200" ]] &&
              grep -Fq '/stabilize-tab-20260813.svg' "$workdir/refresh.js" &&
              grep -Fq 'data:image/png;base64,' "$workdir/refresh.js"; then
              echo "The new Safari SVG and inline PNG favicon identity are live."
              exit 0
            fi

            sleep 10
          done

          echo "::error::The cache-independent Safari favicon did not become live."
          echo "--- homepage icon markers ---"
          grep -E 'stabilize-tab|data:image/png|favicon-refresh' "$workdir/root.html" | head -n 20 || true
          echo "--- SVG headers ---"
          sed -n '1,30p' "$workdir/svg.headers" || true
          echo "--- refresh markers ---"
          grep -E 'stabilize-tab|data:image/png' "$workdir/refresh.js" | head -n 20 || true
          exit 1

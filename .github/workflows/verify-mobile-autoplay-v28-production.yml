name: Retired mobile autoplay v28 diagnostic

# v30 replaced the v28 autoplay client with one hybrid controller. Keep this
# historical workflow available only for manual archaeology; it must not fail
# current production pushes or publish a stale deployment status.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the retired release
        run: |
          echo 'Mobile autoplay v28 is retired.'
          echo 'Current production is verified by verify-mobile-video.yml and verify-mobile-background.yml.'

name: Apply Fast mode latency policy

on:
  push:
    branches:
      - agent/fast-mode-latency
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-fast-mode-latency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fast-mode-latency

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Fast mode latency policy
        run: node scripts/apply-priority-latency.mjs

      - name: Commit generated implementation
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Generated implementation is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Fast mode latency implementation"
          git push origin HEAD:agent/fast-mode-latency

      - name: Run complete test suite
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify generated tree remains clean
        run: npm run verify:clean

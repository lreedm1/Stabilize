name: Cleanup Temporary Wisconsin Acts Build

on:
  push:
    paths:
      - ".github/workflows/cleanup-wi-acts-temp.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary build files and self-delete
        shell: bash
        run: |
          rm -f \
            tmp/openstates-wi-archive-link.md \
            scripts/build_wi_acts_temp.py \
            .github/workflows/build-wi-acts-temp.yml \
            .github/workflows/build-wi-acts-temp-v2.yml \
            generated/Wisconsin_Acts_Build_Log.txt \
            generated/Wisconsin_2025-2026_Enacted_Bill_Text.txt \
            .github/workflows/cleanup-wi-acts-temp.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Wisconsin acts build files" || true
          git push

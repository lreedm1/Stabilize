name: Diagnose signed-in prefetch latency v2

on:
  push:
    branches:
      - agent/signed-in-prefetch-latency-v2

permissions:
  contents: write

concurrency:
  group: diagnose-signed-in-prefetch-latency-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/signed-in-prefetch-latency-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Run complete validation and capture results
        shell: bash
        run: |
          set +e
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "--- generator syntax ---"
            node --check scripts/apply-signed-in-prefetch-latency.mjs
            echo "generator_check=$?"
            echo "--- npm ci ---"
            npm ci
            echo "npm_ci=$?"
            echo "--- generated syntax ---"
            node --check src/auth.js
            echo "auth_check=$?"
            node --check src/billing-account.js
            echo "billing_account_check=$?"
            node --check src/paid-worker.js
            echo "paid_worker_check=$?"
            node --check public/billing-client.js
            echo "billing_client_check=$?"
            echo "--- full tests ---"
            npm test
            echo "npm_test=$?"
            echo "--- Worker build ---"
            npm run check
            echo "npm_check=$?"
            echo "--- clean tree ---"
            npm run verify:clean
            echo "verify_clean=$?"
            echo "--- status ---"
            git status --short
          } > signed-in-prefetch-v2-diagnostic.log 2>&1
          cat signed-in-prefetch-v2-diagnostic.log
      - name: Commit diagnostic log and canonical output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
            exit 0
          fi
          git commit -m "Record signed-in prefetch v2 validation"
          git push origin HEAD:agent/signed-in-prefetch-latency-v2

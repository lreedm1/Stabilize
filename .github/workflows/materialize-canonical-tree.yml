name: Materialize canonical generated tree

on:
  push:
    branches:
      - agent/add-clean-tree-build-guard
  workflow_dispatch:

concurrency:
  group: materialize-canonical-tree
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v7
        with:
          ref: agent/add-clean-tree-build-guard
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Materialize and validate the canonical tree
        run: |
          npm ci
          npm test
          npm run check

      - name: Commit canonical generated output
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "The generated tree is already canonical."
            exit 0
          fi

          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize canonical generated output"
          git push origin HEAD:agent/add-clean-tree-build-guard

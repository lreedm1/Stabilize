name: Materialize mobile forest background

on:
  push:
    branches:
      - agent/mobile-forest-stream-background

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-forest-stream-background
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate canonical text output
        run: npm ci

      - name: Materialize the uploaded mobile background
        run: node scripts/materialize-mobile-forest-stream.mjs

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Commit canonical mobile background output
        shell: bash
        run: |
          rm -f .github/workflows/materialize-mobile-forest-stream.yml
          rm -f scripts/materialize-mobile-forest-stream.mjs
          rm -f materialize/mobile-forest-stream/01.b64
          rmdir materialize/mobile-forest-stream 2>/dev/null || true
          rmdir materialize 2>/dev/null || true

          test -f public/scenes/mobile-forest-stream-v1-864.webp
          grep -Fq '/scenes/mobile-forest-stream-v1-864.webp' src/page.js
          grep -Fq '/scenes/mobile-forest-stream-v1-864.webp' public/guides.css

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes were produced."
            exit 1
          fi
          git commit -m "Use the forest stream mobile background [materialized]"
          npm run verify:clean
          git push origin HEAD:agent/mobile-forest-stream-background

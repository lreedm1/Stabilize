name: Diagnose mobile background source resolution v20

on:
  push:
    branches:
      - agent/mobile-resolution-diagnostic-v20
    paths:
      - .github/workflows/diagnose-mobile-resolution-v20.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-mobile-resolution-v20.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-resolution-diagnostic-v20
          persist-credentials: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg webp imagemagick

      - name: Capture original source and poster samples
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/mobile-resolution-v20
          mkdir -p "$work"
          source=public/scenes/mobile-forest-stream-video-v14-retina-2160.mp4
          poster=public/scenes/mobile-forest-stream-v14-retina-2160.webp

          ffprobe -v error -show_streams -show_format "$source" > "$work/source-ffprobe.txt"
          identify -verbose "$poster" > "$work/poster-identify.txt"

          for time in 0.0 0.8 1.6 2.4 3.2 4.0; do
            label="${time/./-}"
            ffmpeg -hide_banner -loglevel error -y -ss "$time" -i "$source" \
              -frames:v 1 "$work/source-${label}-2160.png"
            ffmpeg -hide_banner -loglevel error -y -i "$work/source-${label}-2160.png" \
              -vf 'crop=800:2400:1360:1440' -frames:v 1 \
              "$work/source-${label}-water-crop-800.png"
          done

          ffmpeg -hide_banner -loglevel error -y -i "$poster" \
            -frames:v 1 "$work/poster-2160.png"
          ffmpeg -hide_banner -loglevel error -y -i "$poster" \
            -vf 'crop=800:2400:1360:1440' -frames:v 1 \
            "$work/poster-water-crop-800.png"

          # Measure edge detail rather than trusting container dimensions.
          for image in "$work"/*.png; do
            name="$(basename "$image" .png)"
            ffmpeg -hide_banner -loglevel error -i "$image" \
              -vf 'format=gray,edgedetect=low=0.08:high=0.20,signalstats,metadata=print:file=-' \
              -frames:v 1 -f null - 2>> "$work/edge-detail.txt" || true
            printf '\nIMAGE=%s\n' "$name" >> "$work/edge-detail.txt"
          done

          sha256sum "$work"/* > "$work/sha256.txt"

      - name: Upload source-resolution evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-resolution-v20-source-evidence
          path: /tmp/mobile-resolution-v20
          if-no-files-found: error
          retention-days: 7

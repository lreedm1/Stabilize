name: Build model action buttons

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ui/model-action-buttons
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replace yes-no outcome controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path("public/app.js")
          app_text = app.read_text()
          start = app_text.index("function appendOutcomeCheck(article) {")
          end = app_text.index("\n}\n\nfunction showOutput(", start) + 2
          replacement = r'''function buildOutcomeActionPrompt(instruction, previousReply) {
            const request = String(instruction || "").trim();
            const context = String(previousReply || "").trim().slice(0, 3000);
            if (!request) return "";
            if (!context) return request;
            return `${request}\n\nUse this previous answer as context:\n\n${context}`;
          }

          function appendOutcomeCheck(article, previousReply) {
            const section = document.createElement("section");
            section.className = "outcome-check";
            section.setAttribute("aria-label", productCopy.outcomeQuestion);

            const question = document.createElement("p");
            question.className = "outcome-question";
            question.textContent = productCopy.outcomeQuestion;

            const actions = document.createElement("div");
            actions.className = "outcome-actions";

            const configuredActions = Array.isArray(productCopy.outcomeActions)
              ? productCopy.outcomeActions.slice(0, 3)
              : [];
            const buttons = [];

            function disableButtons() {
              for (const button of buttons) button.disabled = true;
            }

            for (const action of configuredActions) {
              const label = String(action?.label || "").trim();
              const prompt = String(action?.prompt || "").trim();
              if (!label || !prompt) continue;

              const button = document.createElement("button");
              button.type = "button";
              button.className = "outcome-button";
              button.textContent = label;
              button.addEventListener("click", () => {
                if (pending) return;
                disableButtons();
                void sendMessage(buildOutcomeActionPrompt(prompt, previousReply));
              });
              buttons.push(button);
              actions.appendChild(button);
            }

            section.append(question, actions);
            article.appendChild(section);
          }'''.replace("          ", "")
          app_text = app_text[:start] + replacement + app_text[end:]
          old_call = "if (offerOutcomeCheck) appendOutcomeCheck(article);"
          new_call = "if (offerOutcomeCheck) appendOutcomeCheck(article, content);"
          if old_call not in app_text:
              raise SystemExit("Outcome-check render call was not found")
          app.write_text(app_text.replace(old_call, new_call, 1))

          page = Path("src/page.js")
          page_text = page.read_text()
          copy_start = page_text.index('      outcomeQuestion:')
          copy_end = page_text.index('    }),\n  );', copy_start)
          new_copy = '''      outcomeQuestion: "What would help next?",
                outcomeActions: [
                  {
                    label: "Make it smaller",
                    prompt: "Make the practical next step smaller and easier to start.",
                  },
                  {
                    label: "Another option",
                    prompt: "Give me a different practical next step.",
                  },
                  {
                    label: "Help me start now",
                    prompt: "Help me begin the next step right now with one concrete first move.",
                  },
                ],
          '''.replace("          ", "")
          page_text = page_text[:copy_start] + new_copy + page_text[copy_end:]
          page_text, count = re.subn(
              r'src="/app\.js(?:\?v=[^"]+)?"',
              'src="/app.js?v=20260802-model-action-buttons-1"',
              page_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("App script tag was not found")
          page.write_text(page_text)

          styles = Path("public/product.css")
          style_text = styles.read_text()
          marker = "/* Model action buttons */"
          if marker not in style_text:
              style_text += r'''

/* Model action buttons */
.outcome-actions {
  flex-wrap: wrap;
}

.outcome-button {
  flex: 1 1 9rem;
}
'''
          styles.write_text(style_text)

          test_file = Path("test/outcome-followup.test.mjs")
          test_file.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          test("outcome actions are specific and always submit to the model", async () => {
            const [clientScript, pageSource, productStyles] = await Promise.all([
              readFile(new URL("../public/app.js", import.meta.url), "utf8"),
              readFile(new URL("../src/page.js", import.meta.url), "utf8"),
              readFile(new URL("../public/product.css", import.meta.url), "utf8"),
            ]);

            assert.match(pageSource, /What would help next\?/);
            assert.match(pageSource, /Make it smaller/);
            assert.match(pageSource, /Another option/);
            assert.match(pageSource, /Help me start now/);
            assert.doesNotMatch(pageSource, /outcomeYes:|outcomeNo:/);
            assert.match(clientScript, /function appendOutcomeCheck\(article, previousReply\)/);
            assert.match(clientScript, /for \(const action of configuredActions\)/);
            assert.match(
              clientScript,
              /void sendMessage\(buildOutcomeActionPrompt\(prompt, previousReply\)\)/,
            );
            assert.match(clientScript, /Use this previous answer as context/);
            assert.doesNotMatch(clientScript, /input\.value = productCopy\.outcome/);
            assert.match(productStyles, /Model action buttons/);
            assert.match(pageSource, /app\.js\?v=20260802-model-action-buttons-1/);
          });
          '''.replace("          ", ""))
          PY

      - name: Run full test suite
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/model-action-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/product.css src/page.js test/outcome-followup.test.mjs .github/workflows/model-action-buttons.yml
          git commit -m "Replace yes-no controls with model actions"
          git push origin HEAD:ui/model-action-buttons

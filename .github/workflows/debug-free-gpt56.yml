name: Debug free GPT-5.6 branch

on:
  pull_request:
    paths:
      - "package.json"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "wrangler.jsonc"
      - ".github/workflows/debug-free-gpt56.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Capture install and test output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > debug-test.log
          npm ci >> debug-test.log 2>&1
          status=$?
          echo "npm ci status: ${status}" >> debug-test.log
          if [[ "$status" -eq 0 ]]; then
            npm test >> debug-test.log 2>&1
            status=$?
            echo "npm test status: ${status}" >> debug-test.log
          fi
          mkdir -p debug-output/src debug-output/public debug-output/test
          cp debug-test.log debug-output/
          cp src/paid-worker.js src/billing.js debug-output/src/ 2>/dev/null || true
          cp public/billing-client.js public/billing.css debug-output/public/ 2>/dev/null || true
          cp test/prompt-policy-idempotency.test.mjs test/paid-model-choice.test.mjs test/product.test.mjs test/navigation-model-placement.test.mjs test/composer-chat-sections.test.mjs test/composer-placeholder-alignment.test.mjs debug-output/test/ 2>/dev/null || true
          cp package.json wrangler.jsonc debug-output/ 2>/dev/null || true
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-gpt56-debug-${{ github.run_id }}
          path: debug-output
          if-no-files-found: error
          retention-days: 1

      - name: Enforce result
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1

name: Export native selected mobile verifier v24

on:
  push:
    branches:
      - agent/native-selected-mobile-video-v24
    paths:
      - .github/workflows/materialize-native-selected-mobile-v24.yml

permissions:
  contents: write

concurrency:
  group: export-native-selected-mobile-verifier-${{ github.sha }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/native-selected-mobile-video-v24
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without running generators
        run: npm ci --ignore-scripts

      - name: Generate and export the exact native verifier
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          cp .github/workflows/verify-mobile-video.yml \
            scripts/generated-verify-mobile-video-v24.yml
          git checkout -- .github/workflows/verify-mobile-video.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generated-verify-mobile-video-v24.yml
          git commit -m 'Export generated native mobile verifier'
          git push origin HEAD:agent/native-selected-mobile-video-v24

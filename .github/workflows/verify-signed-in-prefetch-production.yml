name: Verify signed-in prefetch production

on:
  push:
    branches:
      - agent/verify-signed-in-prefetch-production

permissions:
  contents: read

concurrency:
  group: verify-signed-in-prefetch-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact signed-in prefetch release
        shell: bash
        run: |
          set -euo pipefail
          origin="https://stabilize.info"
          expected_script="/billing-client.js?v=20260808-signed-in-prefetch-1"

          for attempt in $(seq 1 60); do
            cache_bust="$(date +%s)-${attempt}"
            html="$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              "${origin}/?verify-signed-in-prefetch=${cache_bust}")"

            script_ok=false
            marker_ok=false
            endpoint_ok=false

            if grep -Fq "$expected_script" <<<"$html"; then
              script_ok=true
              script="$(curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "${origin}${expected_script}&verify=${cache_bust}")"
              if grep -Fq 'Signed-in account-context prefetch' <<<"$script" && \
                 grep -Fq 'X-Stabilize-Memory-Source' <(curl --fail --silent --show-error --location \
                   --header 'Cache-Control: no-cache' \
                   "https://raw.githubusercontent.com/lreedm1/Stabilize/main/src/paid-worker.js?verify=${cache_bust}"); then
                marker_ok=true
              fi
            fi

            context_status="$(curl --silent --show-error \
              --output /tmp/account-context.json \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "${origin}/api/account/context?verify=${cache_bust}")"
            if [[ "$context_status" == "401" ]] && \
               grep -Fq 'Sign in to use account memory.' /tmp/account-context.json; then
              endpoint_ok=true
            fi

            echo "attempt=${attempt} script=${script_ok} marker=${marker_ok} endpoint=${endpoint_ok} status=${context_status}"
            if [[ "$script_ok" == true && "$marker_ok" == true && "$endpoint_ok" == true ]]; then
              echo "Exact signed-in prefetch release is live on stabilize.info."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for the exact signed-in prefetch release." >&2
          echo "Homepage billing script references:" >&2
          grep -oE 'billing-client\.js\?v=[A-Za-z0-9._-]+' <<<"$html" | sort -u >&2 || true
          echo "Account-context response (${context_status}):" >&2
          cat /tmp/account-context.json >&2 || true
          exit 1

name: Verify production favicon

on:
  workflow_run:
    workflows:
      - Deploy Stabilize to Cloudflare
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stabilize-production-favicon-post-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify one canonical browser favicon
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify one PNG favicon and implicit ICO fallback
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp)"
          png_headers="$(mktemp)"
          ico_headers="$(mktemp)"
          manifest_headers="$(mktemp)"
          trap 'rm -f "$root" "$png_headers" "$ico_headers" "$manifest_headers"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://stabilize.info/?favicon-check=${GITHUB_SHA}-${attempt}" -o "$root" &&
              curl --fail --silent --show-error --head "https://stabilize.info/favicon-32x32.png?favicon-check=${GITHUB_SHA}-${attempt}" -o "$png_headers" &&
              curl --fail --silent --show-error --head "https://stabilize.info/favicon.ico?favicon-check=${GITHUB_SHA}-${attempt}" -o "$ico_headers" &&
              curl --fail --silent --show-error --head "https://stabilize.info/site.webmanifest?favicon-check=${GITHUB_SHA}-${attempt}" -o "$manifest_headers" &&
              [[ "$(grep -o 'rel="icon"' "$root" | wc -l | tr -d ' ')" == "1" ]] &&
              grep -Fq '<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />' "$root" &&
              grep -Fq '<link rel="manifest" href="/site.webmanifest" />' "$root" &&
              ! grep -Fq 'rel="shortcut icon"' "$root" &&
              ! grep -Fq 'rel="mask-icon"' "$root" &&
              ! grep -Fq 'favicon-refresh.js' "$root" &&
              ! grep -Fq 'data:image/' "$root" &&
              grep -Eiq '^content-type: image/png' "$png_headers" &&
              grep -Eiq '^cache-control: .*max-age=86400' "$png_headers" &&
              grep -Eiq '^content-type: image/(x-icon|vnd.microsoft.icon)' "$ico_headers" &&
              grep -Eiq '^content-type: application/manifest\+json' "$manifest_headers"; then
              echo "Production exposes exactly one declared PNG favicon and keeps /favicon.ico only as an implicit fallback."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Production did not expose the one-favicon contract."
          exit 1

# The generated moving image avoids iOS media-autoplay gating entirely.
name: Build no-tap mobile motion v16

on:
  push:
    branches:
      - agent/mobile-motion-without-tap
    paths:
      - scripts/generate-mobile-motion-fallback.sh
      - scripts/prepare-mobile-motion-fallback.py
      - .github/workflows/build-mobile-motion-v16.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-mobile-motion-fallback.sh
      - scripts/prepare-mobile-motion-fallback.py
      - .github/workflows/build-mobile-motion-v16.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install animation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v webpmux >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg webp
          fi

      - name: Generate and validate the no-tap animated WebP
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-mobile-motion-fallback.sh /tmp/stabilize-mobile-motion-v16

      - name: Install the animated background release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-mobile-motion-fallback.py \
            /tmp/stabilize-mobile-motion-v16/mobile-forest-stream-motion-v16-1440.webp
          npm ci --ignore-scripts
          npm run apply:prompt-policy

      - name: Commit the generated binary and canonical output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace tap-gated mobile video with automatic 1440p motion'

      - name: Run full regression and Worker build checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the verified release branch
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/mobile-motion-without-tap

      - name: Upload decoded-motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-motion-v16-evidence
          path: |
            /tmp/stabilize-mobile-motion-v16/mobile-forest-stream-motion-v16-1440.webp
            /tmp/stabilize-mobile-motion-v16/webpmux-info.txt
            /tmp/stabilize-mobile-motion-v16/frame-*.png
          if-no-files-found: warn
          retention-days: 7

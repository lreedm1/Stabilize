name: Import validated mobile video

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download and validate the replacement MP4
        id: download
        shell: bash
        run: |
          set -uo pipefail
          url='https://drive.usercontent.google.com/download?id=1pH2YWsVydiR2IscMzZbD-Wmf4tZdDUMk&export=download&confirm=t'
          http_status="$(curl --location --retry 2 --max-time 120 \
            --silent --show-error \
            --output /tmp/mobile-video.mp4 \
            --write-out '%{http_code}' "$url" || true)"
          bytes="$(wc -c < /tmp/mobile-video.mp4 2>/dev/null | tr -d '[:space:]')"
          bytes="${bytes:-0}"
          sha="$(sha256sum /tmp/mobile-video.mp4 2>/dev/null | awk '{print $1}')"
          type="$(file -b --mime-type /tmp/mobile-video.mp4 2>/dev/null || true)"
          echo "http=$http_status bytes=$bytes type=$type sha=$sha"

          result=failure
          detail="HTTP ${http_status:-000}, ${bytes} bytes, ${type:-unknown}"
          if [[ "$http_status" == 200 \
            && "$bytes" == 409215 \
            && "$sha" == '0c5a9399ef524b2f2d04458b3604078371c040ca1d5fbae2506bdba0dcda5953' \
            && "$(dd if=/tmp/mobile-video.mp4 bs=1 skip=4 count=4 status=none 2>/dev/null)" == 'ftyp' ]]; then
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y ffmpeg; }
            if ffmpeg -hide_banner -v error -xerror -err_detect explode \
              -i /tmp/mobile-video.mp4 -map 0:v:0 -f null -; then
              result=success
              detail='Validated 1080x1920 MP4 download succeeded'
            else
              detail='Downloaded MP4 failed strict frame decoding'
            fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: Publish import result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.download.outputs.result }}
          DETAIL: ${{ steps.download.outputs.detail }}
        run: |
          set -euo pipefail
          state="${RESULT:-failure}"
          description="${DETAIL:-Video import step did not produce a result}"
          description="${description:0:140}"
          payload="$(python - "$state" "$description" <<'PY'
          import json, os, sys
          print(json.dumps({
              'state': sys.argv[1],
              'context': 'diagnostic/mobile-video-import',
              'description': sys.argv[2],
              'target_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

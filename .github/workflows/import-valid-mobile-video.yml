name: Import validated mobile video

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download and validate the replacement MP4
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.usercontent.google.com/download?id=1pH2YWsVydiR2IscMzZbD-Wmf4tZdDUMk&export=download&confirm=t'
          curl --fail-with-body --location --retry 3 --max-time 120 \
            --output /tmp/mobile-video.mp4 "$url"
          bytes="$(wc -c < /tmp/mobile-video.mp4 | tr -d '[:space:]')"
          sha="$(sha256sum /tmp/mobile-video.mp4 | awk '{print $1}')"
          file /tmp/mobile-video.mp4
          echo "bytes=$bytes sha=$sha"
          test "$bytes" = 409215
          test "$sha" = '0c5a9399ef524b2f2d04458b3604078371c040ca1d5fbae2506bdba0dcda5953'
          test "$(dd if=/tmp/mobile-video.mp4 bs=1 skip=4 count=4 status=none)" = 'ftyp'
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y ffmpeg; }
          ffmpeg -hide_banner -v error -xerror -err_detect explode \
            -i /tmp/mobile-video.mp4 -map 0:v:0 -f null -

      - name: Publish import result
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"state":"success","context":"diagnostic/mobile-video-import","description":"Validated 1080x1920 MP4 download succeeded","target_url":"'"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"'"}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

name: Build mobile walking path HQ v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-mobile-walking-path-hq-v2.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile HQ branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-walking-path-hq-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download original high-resolution trail photo
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --user-agent "Stabilize image build" \
            --output /tmp/mobile-walking-path-source-hq.jpg \
            "https://images.unsplash.com/photo-1760772484840-11d9e73c6097?auto=format&fit=max&fm=jpg&q=100&w=6000"
          test -s /tmp/mobile-walking-path-source-hq.jpg

      - name: Create larger denoised mobile WebPs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps

          outputs = {
              Path("public/scenes/mobile-walking-path-hq-v2-1440.webp"): ((1440, 2560), 96),
              Path("public/scenes/mobile-walking-path-hq-v2-2160.webp"): ((2160, 3840), 94),
              Path("public/scenes/mobile-walking-path-hq-v2-2880.webp"): ((2880, 5120), 88),
          }

          with Image.open("/tmp/mobile-walking-path-source-hq.jpg") as source:
              image = ImageOps.exif_transpose(source).convert("RGB")

          width, height = image.size
          target_ratio = 9 / 16
          current_ratio = width / height
          if current_ratio > target_ratio:
              crop_width = round(height * target_ratio)
              focus_x = 0.52
              left = round(width * focus_x - crop_width / 2)
              left = max(0, min(left, width - crop_width))
              image = image.crop((left, 0, left + crop_width, height))
          elif current_ratio < target_ratio:
              crop_height = round(width / target_ratio)
              top = max(0, min(round((height - crop_height) * 0.38), height - crop_height))
              image = image.crop((0, top, width, top + crop_height))

          # Remove low-light noise without adding a visibly soft blur.
          image = image.filter(ImageFilter.MedianFilter(size=3))
          image = ImageEnhance.Brightness(image).enhance(1.045)
          image = ImageEnhance.Contrast(image).enhance(0.985)
          image = ImageEnhance.Color(image).enhance(0.97)

          for path, (size, quality) in outputs.items():
              rendered = image.resize(size, Image.Resampling.LANCZOS)
              rendered = rendered.filter(
                  ImageFilter.UnsharpMask(radius=1.0, percent=72, threshold=4)
              )
              rendered.save(path, "WEBP", quality=quality, method=6)
              with Image.open(path) as check:
                  if check.size != size:
                      raise SystemExit(f"Unexpected size for {path}: {check.size}")
              byte_size = path.stat().st_size
              if not 250_000 < byte_size < 5_000_000:
                  raise SystemExit(f"Unexpected file size for {path}: {byte_size}")
              print(f"Wrote {path}: {size[0]}x{size[1]}, q={quality}, {byte_size:,} bytes")
          PY

      - name: Wire cache-busted HQ assets into mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("src/page.js")
          text = page.read_text()
          replacements = {
              "mobile-walking-path-v1-1080.webp 1080w": "mobile-walking-path-hq-v2-1440.webp 1440w",
              "mobile-walking-path-v1-1620.webp 1620w": "mobile-walking-path-hq-v2-2160.webp 2160w",
              "mobile-walking-path-v1-2430.webp 2430w": "mobile-walking-path-hq-v2-2880.webp 2880w",
              "mobile-walking-path-v1-1620.webp": "mobile-walking-path-hq-v2-2160.webp",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing {old} in src/page.js")
              text = text.replace(old, new)
          page.write_text(text)

          test = Path("test/mobile-quality.test.mjs")
          text = test.read_text()
          replacements = {
              "mobile-walking-path-v1-1080.webp": "mobile-walking-path-hq-v2-1440.webp",
              "mobile-walking-path-v1-1620.webp": "mobile-walking-path-hq-v2-2160.webp",
              "mobile-walking-path-v1-2430.webp": "mobile-walking-path-hq-v2-2880.webp",
              "{ width: 1080, height: 1920 }": "{ width: 1440, height: 2560 }",
              "{ width: 1620, height: 2880 }": "{ width: 2160, height: 3840 }",
              "{ width: 2430, height: 4320 }": "{ width: 2880, height: 5120 }",
              "image.byteLength < 3_000_000": "image.byteLength < 5_000_000",
              "1080\\.webp 1080w": "1440\\.webp 1440w",
              "1620\\.webp 1620w": "2160\\.webp 2160w",
              "2430\\.webp 2430w": "2880\\.webp 2880w",
              "1620\\.webp/": "2160\\.webp/",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Missing {old} in test/mobile-quality.test.mjs")
              text = text.replace(old, new)
          test.write_text(text)

          product_test = Path("test/product.test.mjs")
          text = product_test.read_text()
          text = text.replace(
              "../public/scenes/mobile-walking-path-v1-1080.webp",
              "../public/scenes/mobile-walking-path-hq-v2-1440.webp",
          )
          text = text.replace(
              "{ width: 1080, height: 1920 }",
              "{ width: 1440, height: 2560 }",
          )
          product_test.write_text(text)

          css = Path("public/photo-tuning.css")
          text = css.read_text()
          text = text.replace(
              "@media (max-aspect-ratio: 9 / 16) {\n  .photo-backdrop img {\n    object-position: 50% 39%;\n  }\n}",
              "@media (max-aspect-ratio: 9 / 16) {\n  .photo-backdrop img {\n    object-position: 50% 50%;\n    image-rendering: auto;\n  }\n}",
          )
          css.write_text(text)

          credit = Path("public/scenes/MOBILE_PHOTO_CREDIT.md")
          credit.write_text(
              credit.read_text().rstrip()
              + "\nRegenerated from the original high-resolution source for the v2 mobile set.\n"
          )

          for old in [
              "public/scenes/mobile-walking-path-v1-1080.webp",
              "public/scenes/mobile-walking-path-v1-1620.webp",
              "public/scenes/mobile-walking-path-v1-2430.webp",
          ]:
              Path(old).unlink(missing_ok=True)

          Path(".github/workflows/build-mobile-walking-path-hq-v2.yml").unlink()
          PY

      - name: Validate final wiring
        run: |
          node --check src/page.js
          grep -q "mobile-walking-path-hq-v2-2880.webp 2880w" src/page.js
          grep -q "mobile-walking-path-hq-v2-2160.webp" test/mobile-quality.test.mjs
          test ! -e public/scenes/mobile-walking-path-v1-1080.webp
          test ! -e .github/workflows/build-mobile-walking-path-hq-v2.yml

      - name: Commit high-quality mobile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load higher-quality walking path photography on mobile"
          git push origin HEAD:agent/mobile-walking-path-hq-v2

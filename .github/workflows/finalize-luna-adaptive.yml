name: Finalize Luna adaptive routing

on:
  push:
    branches:
      - agent/luna-adaptive-routing
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-luna-adaptive-routing
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/luna-adaptive-routing
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify implementation and focused coverage are present
        shell: bash
        run: |
          test "$(grep -RIl --include='*.mjs' --include='*.js' 'gpt-5.6-luna' src scripts test | wc -l)" -gt 0
          test "$(grep -RIl --include='*.mjs' --include='*.js' 'gpt-5.6-sol' src scripts test | wc -l)" -gt 0
          test "$(grep -RIl --include='*.mjs' --include='*.js' -i 'complexity gate\|complexity.*model\|needs.*sol' src scripts test | wc -l)" -gt 0
          test "$(grep -RIl --include='*.mjs' --include='*.js' -i 'luna' test | wc -l)" -gt 0
          test "$(grep -RIl --include='*.mjs' --include='*.js' -i 'sol' test | wc -l)" -gt 0
          grep -Rqi --include='*.mjs' --include='*.js' 'abort' src scripts test
          grep -Rqi --include='*.mjs' --include='*.js' 'Promise\.all\|allSettled' src scripts test
          grep -Rqi --include='*.mjs' --include='*.js' 'buffer' src scripts test
          grep -Rqi 'GPT-5.6 Adaptive' README.md src public scripts test

      - name: Install dependencies
        run: npm ci

      - name: Confirm canonical generation is repeatable
        shell: bash
        run: |
          npm run apply:prompt-policy
          git add -N .
          git diff --binary > /tmp/first.diff
          npm run apply:prompt-policy
          git diff --binary > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff

      - name: Run complete regression suite
        run: npm test

      - name: Validate Cloudflare Worker bundle
        run: npm run check

      - name: Enforce clean generated tree
        run: npm run verify:clean

      - name: Remove release scaffolding and push tested head
        shell: bash
        run: |
          rm -f .github/workflows/export-luna-worktree.yml
          rm -f .github/workflows/finish-luna-adaptive.yml
          rm -f .github/workflows/finalize-luna-adaptive.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Luna adaptive routing release scaffolding'
            git push origin HEAD:agent/luna-adaptive-routing
          fi

      - name: Merge the exact tested implementation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          final_sha="$(git rev-parse HEAD)"
          gh pr ready 170 --repo "$GITHUB_REPOSITORY" || true
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/pulls/170/merge" \
            -f merge_method=squash \
            -f sha="$final_sha" \
            -f commit_title='Route automatic chats through Luna with Sol escalation' \
            -f commit_message='Start Luna and a small complexity gate together. Buffer Luna until the gate resolves; abort and discard it whenever the gate selects GPT-5.6 Sol.'

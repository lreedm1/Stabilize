name: Diagnose UW chat scrolling

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-uw-scroll.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live stylesheet version and scroll rules
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cache_bust="$(date +%s)"

          curl --fail --silent --show-error \
            "https://chat.uwmadison.stabilize.info/?scroll-diagnostic=${cache_bust}" \
            > "$workdir/page.html"

          css_path="$(grep -oE '/uwmadison-chat\.css\?v=[^\" ]+' "$workdir/page.html" | head -n 1)"
          echo "Live stylesheet path: ${css_path:-missing}"
          test -n "$css_path"

          curl --fail --silent --show-error \
            "https://chat.uwmadison.stabilize.info${css_path}&diagnostic=${cache_bust}" \
            > "$workdir/uw.css"

          echo "Scroll-rule markers in live CSS:"
          grep -nE 'overflow-y: auto|touch-action: pan-y|webkit-overflow-scrolling' "$workdir/uw.css" || true
          echo "Live CSS bytes: $(wc -c < "$workdir/uw.css")"
          echo "Live CSS SHA256: $(sha256sum "$workdir/uw.css" | cut -d' ' -f1)"

          grep -Fq 'overflow-y: auto' "$workdir/uw.css"
          grep -Fq 'touch-action: pan-y' "$workdir/uw.css"

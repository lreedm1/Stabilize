name: Materialize signed-in chat latency v2

on:
  push:
    branches:
      - agent/signed-in-latency-v2

permissions:
  contents: write

concurrency:
  group: materialize-signed-in-latency-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/signed-in-latency-v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Commit canonical generated output
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Generated output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize finalized signed-in latency v2 policy"
          git push origin HEAD:agent/signed-in-latency-v2

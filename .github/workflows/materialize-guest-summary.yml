name: Materialize guest rolling summary

on:
  push:
    branches:
      - agent/guest-summary-5k
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-guest-summary
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/guest-summary-5k
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct the guest-summary generator
        shell: bash
        run: |
          cat > /tmp/guest-summary-chunks.sha256 <<'SUMS'
          b4823615fd64a4005e123f6ca31db669c7ca62fdf3011016de387f66c43e23ba  tmp/guest-summary-generator/chunk-00.txt
          e41ae093db35377df60f176b694ac159cb222d942a3f7eb7028743c9389917a5  tmp/guest-summary-generator/chunk-01-0.txt
          a890016feed355ec63ad81d3dd4dad251d95c096d4b4142f87746182b1b84793  tmp/guest-summary-generator/chunk-01-1.txt
          c770084dae092442c4f6a6695ee50ed861eac9185a367bd97737a29aac785cf6  tmp/guest-summary-generator/chunk-01-2.txt
          ee31df57e05f82cde61249bc2895285b815375604f0e2d4c93d9a155ecf33984  tmp/guest-summary-generator/chunk-02.txt
          SUMS
          sha256sum --check /tmp/guest-summary-chunks.sha256
          cat \
            tmp/guest-summary-generator/chunk-00.txt \
            tmp/guest-summary-generator/chunk-01-0.txt \
            tmp/guest-summary-generator/chunk-01-1.txt \
            tmp/guest-summary-generator/chunk-01-2.txt \
            tmp/guest-summary-generator/chunk-02.txt \
            | base64 --decode \
            | gzip --decompress \
            > scripts/add-guest-summary.mjs
          echo '4f7fd9e0cfcddbe2dbb8ae29ace55b6a1406dbb53061461785fe86510f886e15  scripts/add-guest-summary.mjs' \
            | sha256sum --check
          node --check scripts/add-guest-summary.mjs

      - name: Add the generator to the canonical policy pipeline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(path, "utf8"));
          const stage = "node scripts/add-guest-summary.mjs";
          if (!packageJson.scripts["apply:prompt-policy"].includes(stage)) {
            packageJson.scripts["apply:prompt-policy"] += ` && ${stage}`;
          }
          fs.writeFileSync(path, JSON.stringify(packageJson, null, 2) + "\n");
          NODE

      - name: Install dependencies and materialize the feature
        run: npm ci

      - name: Prove generation is idempotent
        shell: bash
        run: |
          npm run apply:prompt-policy
          git add -N .
          git diff --binary > /tmp/guest-summary-first.diff
          npm run apply:prompt-policy
          git diff --binary > /tmp/guest-summary-second.diff
          cmp /tmp/guest-summary-first.diff /tmp/guest-summary-second.diff

      - name: Run full regression suites
        run: npm test

      - name: Validate the Worker bundle
        run: npm run check

      - name: Remove one-shot materialization scaffolding
        shell: bash
        run: |
          rm -rf tmp/guest-summary-generator
          rm -f .github/workflows/materialize-guest-summary.yml

      - name: Commit the canonical implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 5k-token guest rolling summaries"

      - name: Verify the committed tree stays clean
        shell: bash
        run: |
          npm run apply:prompt-policy
          git diff --exit-code
          npm run verify:clean

      - name: Push the completed feature branch
        run: git push origin HEAD:agent/guest-summary-5k

name: Build sunlit green mobile path v4

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-mobile-sunlit-green-path-v4.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-sunlit-green-path-v4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download naturally lit forest path
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --user-agent "Stabilize image build" \
            --output /tmp/sunlit-green-path.jpg \
            "https://images.unsplash.com/photo-1766245247307-f88903b4def4?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=95&w=5000"
          test -s /tmp/sunlit-green-path.jpg

      - name: Create natural-color responsive mobile photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps, ImageStat

          source_path = Path('/tmp/sunlit-green-path.jpg')
          outputs = {
              Path('public/scenes/mobile-sunlit-green-path-v4-1440.webp'): (1440, 2560),
              Path('public/scenes/mobile-sunlit-green-path-v4-2160.webp'): (2160, 3840),
              Path('public/scenes/mobile-sunlit-green-path-v4-2880.webp'): (2880, 5120),
          }

          with Image.open(source_path) as source:
              source = ImageOps.exif_transpose(source).convert('RGB')

          master = ImageOps.fit(
              source,
              outputs[max(outputs, key=lambda path: outputs[path][0])],
              method=Image.Resampling.LANCZOS,
              centering=(0.50, 0.56),
          )

          # Preserve the photograph's natural daylight while gently opening shadows.
          master = ImageEnhance.Brightness(master).enhance(1.025)
          master = ImageEnhance.Contrast(master).enhance(1.01)
          master = ImageEnhance.Color(master).enhance(1.055)
          red, green, blue = master.split()
          red = red.point(lambda value: min(255, round(value * 1.035 + 1)))
          blue = blue.point(lambda value: max(0, round(value * 0.975)))
          master = Image.merge('RGB', (red, green, blue))

          def save_bounded(image, path, starting_quality):
              quality = starting_quality
              while quality >= 86:
                  image.save(path, 'WEBP', quality=quality, method=6)
                  size = path.stat().st_size
                  if size < 5_000_000:
                      return quality, size
                  quality -= 2
              raise SystemExit(f'Could not keep {path} below 5 MB')

          for path, size in outputs.items():
              rendered = master if master.size == size else master.resize(size, Image.Resampling.LANCZOS)
              rendered = rendered.filter(
                  ImageFilter.UnsharpMask(radius=0.65, percent=32, threshold=5)
              )
              quality, byte_size = save_bounded(
                  rendered,
                  path,
                  {1440: 96, 2160: 95, 2880: 93}[size[0]],
              )
              with Image.open(path) as check:
                  if check.size != size:
                      raise SystemExit(f'Unexpected dimensions for {path}: {check.size}')
                  sample = check.resize((180, 320), Image.Resampling.BILINEAR).convert('RGB')
                  red_mean, green_mean, blue_mean = ImageStat.Stat(sample).mean
                  if red_mean / max(green_mean, 1) < 0.48:
                      raise SystemExit(f'{path} still has too little red for natural daylight')
                  if blue_mean / max(green_mean, 1) > 0.88:
                      raise SystemExit(f'{path} still has a cyan/teal cast')
              if byte_size < 250_000:
                  raise SystemExit(f'{path} is unexpectedly small: {byte_size}')
              print(
                  f'Wrote {path}: {size[0]}x{size[1]}, quality {quality}, '
                  f'{byte_size:,} bytes; mean RGB {red_mean:.1f}/{green_mean:.1f}/{blue_mean:.1f}'
              )
          PY

      - name: Wire the new photo into mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'mobile-walking-path-natural-v3-1440.webp': 'mobile-sunlit-green-path-v4-1440.webp',
              'mobile-walking-path-natural-v3-2160.webp': 'mobile-sunlit-green-path-v4-2160.webp',
              'mobile-walking-path-natural-v3-2880.webp': 'mobile-sunlit-green-path-v4-2880.webp',
          }

          for filename in ['src/page.js', 'test/mobile-quality.test.mjs', 'test/product.test.mjs']:
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          css_path = Path('public/photo-tuning.css')
          css = css_path.read_text()
          css = css.replace(
              '@media (max-width: 980px) and (orientation: portrait) {\n  .photo-backdrop img {\n    object-position: 50% 50%;\n    filter: none;\n  }',
              '@media (max-width: 980px) and (orientation: portrait) {\n  .photo-backdrop img {\n    object-position: 50% 56%;\n    filter: none;\n  }',
          )
          css = css.replace(
              '@media (max-aspect-ratio: 9 / 16) {\n  .photo-backdrop img {\n    object-position: 50% 50%;\n  }\n}',
              '@media (max-aspect-ratio: 9 / 16) {\n  .photo-backdrop img {\n    object-position: 50% 56%;\n  }\n}',
          )
          css_path.write_text(css)

          credit = Path('public/scenes/MOBILE_PHOTO_CREDIT.md')
          credit.write_text(
              'Mobile background photo by Wolfgang Hasselmann on Unsplash.\n'
              'Source: https://unsplash.com/photos/9LU8RJCh8Hk\n'
              'Used under the Unsplash License.\n'
              'The v4 mobile set uses the naturally sunlit source without a teal CSS grade.\n'
          )

          for old in Path('public/scenes').glob('mobile-walking-path-natural-v3-*.webp'):
              old.unlink()

          Path('.github/workflows/build-mobile-sunlit-green-path-v4.yml').unlink()
          PY

      - name: Validate final mobile source
        run: |
          node --check src/page.js
          grep -q "mobile-sunlit-green-path-v4-2160.webp" src/page.js
          grep -q "object-position: 50% 56%" public/photo-tuning.css
          grep -q "Wolfgang Hasselmann" public/scenes/MOBILE_PHOTO_CREDIT.md
          test ! -e .github/workflows/build-mobile-sunlit-green-path-v4.yml
          test ! -e public/scenes/mobile-walking-path-natural-v3-1440.webp

      - name: Commit naturally colored mobile background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/page.js \
                  public/photo-tuning.css \
                  public/scenes/mobile-sunlit-green-path-v4-1440.webp \
                  public/scenes/mobile-sunlit-green-path-v4-2160.webp \
                  public/scenes/mobile-sunlit-green-path-v4-2880.webp \
                  public/scenes/MOBILE_PHOTO_CREDIT.md \
                  test/mobile-quality.test.mjs \
                  test/product.test.mjs \
                  public/scenes/mobile-walking-path-natural-v3-1440.webp \
                  public/scenes/mobile-walking-path-natural-v3-2160.webp \
                  public/scenes/mobile-walking-path-natural-v3-2880.webp \
                  .github/workflows/build-mobile-sunlit-green-path-v4.yml
          git commit -m "Replace teal mobile photo with a sunlit green path"
          git push origin HEAD:agent/mobile-sunlit-green-path-v4

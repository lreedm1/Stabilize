name: Apply compact UW chat first screen

on:
  push:
    branches:
      - improve/uw-chat-first-screen
    paths:
      - .github/workflows/apply-uw-first-screen.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply the compact first-screen patch
        run: python scripts/apply-uw-first-screen.py

      - name: Remove one-time patch files and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-uw-first-screen.yml scripts/apply-uw-first-screen.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uw-madison-chat.js test/uw-madison-chat.test.mjs
          git commit -m "Replace the UW chat banner with compact urgent help"
          git push origin HEAD:improve/uw-chat-first-screen

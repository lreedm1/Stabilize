name: Verify UW mobile first screen

on:
  push:
    branches:
      - main
      - improve/**
    paths:
      - public/uwmadison-chat.css
      - src/uw-madison-chat.js
      - .github/workflows/verify-uw-mobile-scroll.yml
  pull_request:
    branches:
      - main
    paths:
      - public/uwmadison-chat.css
      - src/uw-madison-chat.js
      - .github/workflows/verify-uw-mobile-scroll.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uw-mobile-first-screen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-webkit:
    name: Verify iPhone-sized first screen
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_STYLESHEET_VERSION: 20260813-first-screen-1
      LIVE_MODE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Playwright WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify the composer and urgent drawer on an iPhone-sized viewport
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { webkit } from "playwright";

          const baseUrl = "https://chat.uwmadison.stabilize.info/";
          const expectedVersion = process.env.EXPECTED_STYLESHEET_VERSION;
          const liveMode = process.env.LIVE_MODE === "true";
          const sharedCss = await Promise.all([
            readFile("public/styles.css", "utf8"),
            readFile("public/product.css", "utf8"),
            readFile("public/seo.css", "utf8"),
            readFile("public/uwmadison-chat.css", "utf8"),
          ]).then((parts) => parts.join("\n"));

          const browser = await webkit.launch({ headless: true });
          const context = await browser.newContext({
            bypassCSP: !liveMode,
            viewport: { width: 390, height: 844 },
            screen: { width: 390, height: 844 },
            deviceScaleFactor: 3,
            isMobile: true,
            hasTouch: true,
            userAgent:
              "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
              "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
              "Mobile/15E148 Safari/604.1",
          });
          const page = await context.newPage();

          try {
            if (liveMode) {
              let deployed = false;
              for (let attempt = 1; attempt <= 36; attempt += 1) {
                await page.goto(`${baseUrl}?first-screen-gate=${Date.now()}`, {
                  waitUntil: "domcontentloaded",
                  timeout: 60_000,
                });
                const html = await page.content();
                deployed =
                  html.includes(`/uwmadison-chat.css?v=${expectedVersion}`) &&
                  html.includes('class="uw-campus-strip"');
                console.log(
                  `Production first-screen attempt ${attempt}: ${
                    deployed ? "current" : "waiting"
                  }`,
                );
                if (deployed) break;
                await page.waitForTimeout(10_000);
              }
              if (!deployed) {
                throw new Error(
                  `Production did not serve UW first-screen version ${expectedVersion}.`,
                );
              }
            } else {
              await page.setContent(`<!doctype html>
                <html lang="en" data-campus-chat="uwmadison">
                  <head><meta name="viewport" content="width=device-width,initial-scale=1"><style>${sharedCss}</style></head>
                  <body>
                    <div class="page-shell">
                      <header class="site-header"><button type="button">Menu</button></header>
                      <main class="chat-card" aria-label="UW–Madison resource-aware Stabilize chat">
                        <section class="uw-campus-strip" aria-label="About this UW–Madison chat">
                          <p class="uw-campus-strip-copy"><strong>Independent from UW–Madison.</strong> Resources built in.</p>
                          <div class="uw-campus-strip-actions">
                            <a class="uw-resource-link" href="#resources">UW resources</a>
                            <details class="uw-urgent-disclosure">
                              <summary>Urgent help</summary>
                              <div class="uw-urgent-panel" role="group" aria-label="Urgent support options">
                                <p class="uw-urgent-note">Do not wait on this chat during an emergency.</p>
                                <a href="tel:911"><strong>Call 911</strong><span>Immediate danger or medical emergency</span></a>
                                <a href="tel:+16082655600"><strong>Call UHS · option 9</strong><span>24/7 mental-health crisis support</span></a>
                                <a href="tel:988"><strong>Call or text 988</strong><span>Suicide &amp; Crisis Lifeline</span></a>
                              </div>
                            </details>
                          </div>
                        </section>
                        <section class="conversation-surface" data-view="compose">
                          <section class="seo-intro product-intro"><h1>UW–Madison support, one step at a time.</h1><p class="product-promise">Tell me what is blocking the next step.</p></section>
                          <div class="composer-dock"><form class="chat-form"><textarea id="message-input" placeholder="What is happening at UW–Madison?"></textarea><button id="send-button" type="button">Send</button></form></div>
                        </section>
                      </main>
                    </div>
                  </body>
                </html>`, { waitUntil: "domcontentloaded" });
            }

            await page.waitForSelector(".uw-campus-strip", { timeout: 30_000 });
            await page.waitForSelector(".uw-urgent-disclosure", { timeout: 30_000 });
            await page.waitForSelector(".composer-dock", { timeout: 30_000 });
            await page.waitForTimeout(500);

            const before = await page.evaluate(() => {
              const scrolling = document.scrollingElement;
              const strip = document.querySelector(".uw-campus-strip");
              const chat = document.querySelector(".chat-card");
              const composer = document.querySelector(".composer-dock");
              const input = document.querySelector("#message-input");
              if (
                !(scrolling instanceof HTMLElement) ||
                !(strip instanceof HTMLElement) ||
                !(chat instanceof HTMLElement) ||
                !(composer instanceof HTMLElement) ||
                !(input instanceof HTMLElement)
              ) {
                throw new Error("Required UW first-screen elements are missing.");
              }
              const viewportHeight = window.visualViewport?.height || window.innerHeight;
              return {
                viewportHeight,
                documentClientHeight: scrolling.clientHeight,
                documentScrollHeight: scrolling.scrollHeight,
                scrollY: window.scrollY,
                stripHeight: strip.getBoundingClientRect().height,
                chatHeight: chat.getBoundingClientRect().height,
                composer: composer.getBoundingClientRect().toJSON(),
                input: input.getBoundingClientRect().toJSON(),
              };
            });

            console.log("Initial UW first screen:", JSON.stringify(before, null, 2));

            if (before.documentScrollHeight > before.documentClientHeight + 2) {
              throw new Error(
                `The initial page still requires document scrolling: ${before.documentScrollHeight}px for ${before.documentClientHeight}px.`,
              );
            }
            if (before.stripHeight > 70) {
              throw new Error(
                `The compact campus strip is too tall (${before.stripHeight}px).`,
              );
            }
            if (
              before.composer.top < 0 ||
              before.composer.bottom > before.viewportHeight + 2 ||
              before.input.top < 0 ||
              before.input.bottom > before.viewportHeight + 2
            ) {
              throw new Error(
                `The composer is not fully visible on load: composer=${before.composer.top}-${before.composer.bottom}, input=${before.input.top}-${before.input.bottom}, viewport=${before.viewportHeight}.`,
              );
            }

            await page.locator(".uw-urgent-disclosure > summary").click();
            await page.waitForTimeout(200);

            const urgent = await page.evaluate(() => {
              const panel = document.querySelector(".uw-urgent-panel");
              const details = document.querySelector(".uw-urgent-disclosure");
              if (!(panel instanceof HTMLElement) || !(details instanceof HTMLDetailsElement)) {
                throw new Error("Urgent help did not open.");
              }
              const viewportHeight = window.visualViewport?.height || window.innerHeight;
              const rect = panel.getBoundingClientRect();
              return {
                open: details.open,
                viewportHeight,
                top: rect.top,
                bottom: rect.bottom,
                height: rect.height,
                links: panel.querySelectorAll("a").length,
              };
            });

            console.log("Open urgent drawer:", JSON.stringify(urgent, null, 2));

            if (!urgent.open || urgent.links !== 3) {
              throw new Error("Urgent help must expose exactly three direct support routes.");
            }
            if (urgent.top < 0 || urgent.bottom > urgent.viewportHeight + 2) {
              throw new Error(
                `The urgent drawer is clipped: top=${urgent.top}, bottom=${urgent.bottom}, viewport=${urgent.viewportHeight}.`,
              );
            }

            console.log(
              liveMode
                ? "The deployed UW chat opens with the composer visible and urgent help in one bounded drawer."
                : "The proposed UW first screen keeps the composer visible and urgent help in one bounded drawer.",
            );
          } finally {
            await browser.close();
          }
          NODE

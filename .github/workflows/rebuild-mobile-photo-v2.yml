name: Rebuild mobile background v2

on:
  push:
    branches:
      - agent/mobile-photo-v2
    paths:
      - .github/workflows/rebuild-mobile-photo-v2.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-photo-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild portrait assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter, ImageStat

          source_path = Path("public/scenes/lake-valley-portrait-2160.webp")
          outputs = {
              Path("public/scenes/lake-valley-portrait-720.webp"): (720, 1280),
              Path("public/scenes/lake-valley-portrait-1440.webp"): (1440, 2560),
              Path("public/scenes/lake-valley-portrait-2160.webp"): (2160, 3840),
          }

          with Image.open(source_path) as source:
              image = source.convert("RGB")

          width, height = image.size

          # Zoom into the lower forest and remove the pale, empty sky that
          # dominated the top half of the previous mobile background.
          crop_height = int(height * 0.76)
          crop_width = int(crop_height * 9 / 16)
          left = int(width * 0.50 - crop_width / 2)
          top = int(height * 0.18)
          left = max(0, min(left, width - crop_width))
          top = max(0, min(top, height - crop_height))
          image = image.crop((left, top, left + crop_width, top + crop_height))

          # Pull the scene away from yellow haze and toward natural forest greens.
          image = ImageEnhance.Brightness(image).enhance(0.88)
          image = ImageEnhance.Contrast(image).enhance(1.18)
          image = ImageEnhance.Color(image).enhance(1.22)
          red, green, blue = image.split()
          red = ImageEnhance.Brightness(red).enhance(0.94)
          green = ImageEnhance.Brightness(green).enhance(1.08)
          blue = ImageEnhance.Brightness(blue).enhance(0.98)
          image = Image.merge("RGB", (red, green, blue))

          # Add a subtle top-to-bottom green shade so the header stays readable
          # and the upper part of the photo no longer looks blown out.
          shade = Image.new("RGBA", image.size, (0, 0, 0, 0))
          pixels = shade.load()
          h = image.height
          for y in range(h):
              progress = y / max(1, h - 1)
              alpha = round(58 * (1 - progress) + 10 * progress)
              for x in range(image.width):
                  pixels[x, y] = (4, 45, 24, alpha)
          image = Image.alpha_composite(image.convert("RGBA"), shade).convert("RGB")
          image = image.filter(ImageFilter.UnsharpMask(radius=1.0, percent=70, threshold=3))

          for path, size in outputs.items():
              rendered = image.resize(size, Image.Resampling.LANCZOS)
              rendered.save(path, "WEBP", quality=90, method=6)
              with Image.open(path) as check:
                  if check.size != size:
                      raise SystemExit(f"Unexpected size for {path}: {check.size}")
                  top_band = check.crop((0, 0, check.width, max(1, check.height // 5))).convert("L")
                  top_brightness = ImageStat.Stat(top_band).mean[0]
                  if top_brightness > 190:
                      raise SystemExit(f"Top band is still too bright for {path}: {top_brightness:.1f}")
              print(f"Wrote {path} at {size[0]}x{size[1]} ({path.stat().st_size:,} bytes)")
          PY

      - name: Commit generated assets and remove workflow
        run: |
          rm .github/workflows/rebuild-mobile-photo-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scenes/lake-valley-portrait-720.webp \
                  public/scenes/lake-valley-portrait-1440.webp \
                  public/scenes/lake-valley-portrait-2160.webp \
                  .github/workflows/rebuild-mobile-photo-v2.yml
          git commit -m "Replace washed-out mobile background crop"
          git push origin HEAD:agent/mobile-photo-v2

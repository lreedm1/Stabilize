name: Materialize decision-grade impact

on:
  push:
    branches:
      - agent/decision-grade-impact

permissions:
  contents: write
  statuses: write

concurrency:
  group: materialize-decision-grade-impact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark materialization pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{"state":"pending","context":"materialization/decision-grade-impact","description":"Reconciling main, generating, testing, and validating"}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Check out decision-grade impact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/decision-grade-impact

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Current main is already included."
          else
            if ! git merge --no-edit origin/main; then
              echo "Conflicting paths:" >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git push origin HEAD:agent/decision-grade-impact
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and materialize policy
        run: npm ci

      - name: Commit canonical generated output
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Generated output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize decision-grade impact"
          git push origin HEAD:agent/decision-grade-impact

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify repository stays clean
        run: npm run verify:clean

      - name: Publish materialization result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Main reconciled; generation, tests, build, and clean-tree passed"
          else
            state="failure"
            description="Reconciliation, generation, tests, build, or clean-tree failed"
          fi
          payload="$(printf '{"state":"%s","context":"materialization/decision-grade-impact","description":"%s"}' "$state" "$description")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

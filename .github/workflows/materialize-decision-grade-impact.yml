name: Materialize decision-grade impact

on:
  push:
    branches:
      - agent/decision-grade-impact

permissions:
  contents: write

concurrency:
  group: materialize-decision-grade-impact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out decision-grade impact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/decision-grade-impact

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and materialize policy
        run: npm ci

      - name: Commit canonical generated output
        shell: bash
        run: |
          # This temporary branch workflow commits only deterministic generated output.
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Generated output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize decision-grade impact"
          git push origin HEAD:agent/decision-grade-impact

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify repository stays clean
        run: npm run verify:clean

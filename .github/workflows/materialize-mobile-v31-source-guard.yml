name: Materialize mobile v31 source guard

on:
  push:
    branches:
      - fix/mobile-v31-controller-source-conflict
    paths:
      - scripts/finalize-mobile-video-handoff-v31.mjs
      - test/mobile-video-handoff-v31.test.mjs
      - .github/workflows/materialize-mobile-v31-source-guard.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-mobile-v31-source-guard
  cancel-in-progress: true

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-v31-controller-source-conflict
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without generation
        run: npm ci --ignore-scripts

      - name: Materialize canonical generated output
        run: npm run apply:prompt-policy

      - name: Verify parser-source ownership is materialized
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mobile-v31-parser-source-guard' public/mobile-background-v30.js
          grep -Fq 'mobile-v31-parser-source-guard' src/mobile-background-response.js
          grep -Fq 'video.querySelector("source[src]")' public/mobile-background-v30.js
          git diff --check

      - name: Commit the exact generated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-mobile-v31-source-guard.yml
          git add -A
          git diff --cached --check
          git commit -m 'Preserve parser-loaded mobile video source'

      - name: Validate the committed repair
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the validated repair
        run: git push origin HEAD:fix/mobile-v31-controller-source-conflict

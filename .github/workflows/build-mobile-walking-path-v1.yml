name: Build mobile walking path v1

on:
  push:
    branches:
      - agent/mobile-walking-path-v1
    paths:
      - .github/workflows/build-mobile-walking-path-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-mobile-walking-path-v1.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-walking-path-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download licensed evergreen trail source
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --user-agent "Stabilize image build" \
            --output /tmp/mobile-walking-path-source.jpg \
            "https://images.unsplash.com/photo-1760772484840-11d9e73c6097?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=90&w=3000"
          test -s /tmp/mobile-walking-path-source.jpg

      - name: Create calm responsive mobile photos
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps

          source_path = Path("/tmp/mobile-walking-path-source.jpg")
          outputs = {
              Path("public/scenes/mobile-walking-path-v1-1080.webp"): (1080, 1920),
              Path("public/scenes/mobile-walking-path-v1-1620.webp"): (1620, 2880),
              Path("public/scenes/mobile-walking-path-v1-2430.webp"): (2430, 4320),
          }

          with Image.open(source_path) as source:
              image = ImageOps.exif_transpose(source).convert("RGB")

          # Crop to a true 9:16 phone frame while keeping the trail centered.
          width, height = image.size
          target_ratio = 9 / 16
          current_ratio = width / height
          if current_ratio > target_ratio:
              crop_width = round(height * target_ratio)
              focus_x = 0.52
              left = round(width * focus_x - crop_width / 2)
              left = max(0, min(left, width - crop_width))
              image = image.crop((left, 0, left + crop_width, height))
          elif current_ratio < target_ratio:
              crop_height = round(width / target_ratio)
              top = max(0, min(round((height - crop_height) * 0.42), height - crop_height))
              image = image.crop((0, top, width, top + crop_height))

          # Quiet, natural color: lift shadow detail and soften contrast without haze.
          image = ImageEnhance.Brightness(image).enhance(1.09)
          image = ImageEnhance.Contrast(image).enhance(0.94)
          image = ImageEnhance.Color(image).enhance(0.94)
          green_tone = Image.new("RGB", image.size, (34, 62, 43))
          image = Image.blend(image, green_tone, 0.018)
          image = image.filter(ImageFilter.GaussianBlur(radius=0.18))

          for path, size in outputs.items():
              rendered = image.resize(size, Image.Resampling.LANCZOS)
              rendered = rendered.filter(
                  ImageFilter.UnsharpMask(radius=0.7, percent=35, threshold=5)
              )
              rendered.save(path, "WEBP", quality=95, method=6)
              with Image.open(path) as check:
                  if check.size != size:
                      raise SystemExit(f"Unexpected size for {path}: {check.size}")
              byte_size = path.stat().st_size
              if not 180_000 < byte_size < 3_000_000:
                  raise SystemExit(f"Unexpected file size for {path}: {byte_size}")
              print(f"Wrote {path}: {size[0]}x{size[1]}, {byte_size:,} bytes")
          PY

      - name: Wire the new walking path into mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "mobile-forest-hq-v1-1080.webp": "mobile-walking-path-v1-1080.webp",
              "mobile-forest-hq-v1-1620.webp": "mobile-walking-path-v1-1620.webp",
              "mobile-forest-hq-v1-2430.webp": "mobile-walking-path-v1-2430.webp",
          }

          for filename in ["src/page.js", "test/mobile-quality.test.mjs"]:
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f"Missing {old} in {filename}")
                  text = text.replace(old, new)
              path.write_text(text)

          css_path = Path("public/photo-tuning.css")
          css = css_path.read_text()
          old = """  .photo-backdrop img {
              object-position: 50% 42%;
              filter: saturate(1.14) contrast(1.045) brightness(0.96);
            }""".replace("          ", "")
          new = """  .photo-backdrop img {
              object-position: 50% 50%;
              filter: saturate(1.02) contrast(0.98) brightness(1.01);
            }""".replace("          ", "")
          if css.count(old) != 1:
              raise SystemExit(f"Expected one mobile photo tuning block, found {css.count(old)}")
          css_path.write_text(css.replace(old, new, 1))

          Path("public/scenes/MOBILE_PHOTO_CREDIT.md").write_text(
              "Mobile background photo by Fethi Benattallah on Unsplash.\n"
              "Source: https://unsplash.com/photos/dbjhHN_CVcY\n"
              "Used under the Unsplash License.\n"
          )

          Path(".github/workflows/build-mobile-walking-path-v1.yml").unlink()
          PY

      - name: Validate source wiring
        run: |
          node --check src/page.js
          grep -q "mobile-walking-path-v1-2430.webp" src/page.js
          grep -q "Fethi Benattallah" public/scenes/MOBILE_PHOTO_CREDIT.md
          test ! -e .github/workflows/build-mobile-walking-path-v1.yml

      - name: Commit mobile walking path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/page.js \
                  public/photo-tuning.css \
                  public/scenes/mobile-walking-path-v1-1080.webp \
                  public/scenes/mobile-walking-path-v1-1620.webp \
                  public/scenes/mobile-walking-path-v1-2430.webp \
                  public/scenes/MOBILE_PHOTO_CREDIT.md \
                  test/mobile-quality.test.mjs \
                  .github/workflows/build-mobile-walking-path-v1.yml
          git commit -m "Use a calming evergreen walking path on mobile"
          git push origin HEAD:agent/mobile-walking-path-v1

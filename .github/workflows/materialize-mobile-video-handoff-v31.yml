name: Materialize mobile video handoff v31

on:
  push:
    branches:
      - fix/mobile-v31-video-handoff
    paths:
      - public/mobile-video-handoff-v31.js
      - scripts/finalize-mobile-video-handoff-v31.mjs
      - test/mobile-video-handoff-v31.test.mjs
      - .github/workflows/materialize-mobile-video-handoff-v31.yml
  workflow_dispatch:

concurrency:
  group: materialize-mobile-video-handoff-v31
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: fix/mobile-v31-video-handoff
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without generation
        run: npm ci --ignore-scripts

      - name: Materialize v31 as the final canonical step
        run: node scripts/finalize-mobile-video-handoff-v31.mjs

      - name: Commit generated output locally
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Materialize parser-loaded mobile video handoff v31'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run full validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish verified generated commit
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:fix/mobile-v31-video-handoff

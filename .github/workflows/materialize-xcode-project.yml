name: Materialize Stabilize Xcode project

on:
  push:
    branches:
      - agent/stabilize-1.1-xcode-cloud
    paths:
      - "ios/project.yml"
      - "ios/Stabilize/**"
      - "ios/StabilizeTests/**"
      - "ios/.gitignore"
      - ".github/workflows/materialize-xcode-project.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-stabilize-xcode-project
  cancel-in-progress: true

jobs:
  generate-project:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/stabilize-1.1-xcode-cloud
          fetch-depth: 0
          persist-credentials: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the stable Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf Stabilize.xcodeproj
          xcodegen generate

      - name: Commit the generated project
        shell: bash
        run: |
          set -euo pipefail
          git add -f ios/Stabilize.xcodeproj
          if git diff --cached --quiet; then
            echo "The committed Xcode project is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize Stabilize 1.1 Xcode project"
          git push origin HEAD:agent/stabilize-1.1-xcode-cloud

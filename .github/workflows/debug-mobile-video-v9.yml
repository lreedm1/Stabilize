name: Debug clean mobile video v11 generator

on:
  pull_request:
    paths:
      - scripts/generate-mobile-video-v9-clean.sh
      - .github/workflows/debug-mobile-video-v9.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install video tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate and validate video
        shell: bash
        run: bash scripts/generate-mobile-video-v9-clean.sh /tmp/stabilize-mobile-video-v11-clean

      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: debug-mobile-video-v11-clean
          path: |
            /tmp/stabilize-mobile-video-v11-clean/mobile-forest-stream-video-v11-1536.mp4
            /tmp/stabilize-mobile-video-v11-clean/frame-early.png
            /tmp/stabilize-mobile-video-v11-clean/frame-late.png
            /tmp/stabilize-mobile-video-v11-clean/probe.json
          if-no-files-found: error
          retention-days: 3

name: Build validated mobile video v11 release

on:
  pull_request:
    paths:
      - scripts/generate-mobile-video-v9-clean.sh
      - scripts/prepare-mobile-video-v11-release.py
      - .github/workflows/debug-mobile-video-v9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install video tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate and validate the screen-resolution video
        shell: bash
        run: bash scripts/generate-mobile-video-v9-clean.sh /tmp/stabilize-mobile-video-v11-clean

      - name: Generate and validate the screen-resolution poster
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/stabilize-mobile-video-v11-clean
          video="$work/mobile-forest-stream-video-v11-1536.mp4"
          poster="$work/mobile-forest-stream-v11-1536.webp"
          ffmpeg -hide_banner -v error -y -i "$video" \
            -frames:v 1 -c:v libwebp -quality 86 -compression_level 6 "$poster"
          dimensions="$(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 "$poster"
          )"
          test "$dimensions" = 1536x2732
          test "$(dd if="$poster" bs=1 count=4 status=none)" = RIFF
          test "$(dd if="$poster" bs=1 skip=8 count=4 status=none)" = WEBP
          echo "poster_bytes=$(wc -c < "$poster" | tr -d '[:space:]')"
          sha256sum "$poster"

      - name: Prepare and publish the clean release branch
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/stabilize-mobile-video-v11-clean
          cp scripts/prepare-mobile-video-v11-release.py /tmp/prepare-mobile-video-v11-release.py

          git fetch --no-tags origin main:refs/remotes/origin/main
          git switch -C agent/mobile-video-v11-generated refs/remotes/origin/main

          python /tmp/prepare-mobile-video-v11-release.py \
            "$work/mobile-forest-stream-video-v11-1536.mp4" \
            "$work/mobile-forest-stream-v11-1536.webp"

          python - <<'PY'
          from pathlib import Path

          client_path = Path("public/mobile-quality.js")
          client = client_path.read_text()
          before = '''function configureVideo() {
            if (!(backgroundVideo instanceof HTMLVideoElement)) return null;
            backgroundVideo.autoplay = true;
            backgroundVideo.muted = true;
            backgroundVideo.defaultMuted = true;
            backgroundVideo.loop = true;
            backgroundVideo.playsInline = true;
            backgroundVideo.preload = "auto";
            backgroundVideo.poster = POSTER_ASSET;
            if (!backgroundVideo.getAttribute("src")) {
              backgroundVideo.src = VIDEO_ASSET;
            }
            return backgroundVideo;
          }'''
          after = '''function configureVideo() {
            if (!(backgroundVideo instanceof HTMLVideoElement)) return null;
            const video = backgroundVideo;
            video.autoplay = true;
            video.muted = true;
            video.defaultMuted = true;
            video.loop = true;
            video.playsInline = true;
            video.preload = "auto";
            video.poster = POSTER_ASSET;
            if (!video.getAttribute("src")) {
              video.src = VIDEO_ASSET;
            }
            return video;
          }'''
          if before not in client:
              raise SystemExit("Could not find generated video configuration block")
          client_path.write_text(client.replace(before, after, 1))

          test_path = Path("test/mobile-background-loading.test.mjs")
          source = test_path.read_text()
          source = source.replace(
              r"mobile-forest-stream-video-v4-1080\.mp4",
              r"mobile-forest-stream-video-v11-1536\.mp4",
          )
          source = source.replace(
              "mobile-forest-stream-video-v4-1080.mp4",
              "mobile-forest-stream-video-v11-1536.mp4",
          )
          test_path.write_text(source)
          PY

          npm ci --ignore-scripts
          npm run apply:prompt-policy

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace corrupt mobile video with a validated screen-resolution release'
          git push --force origin HEAD:agent/mobile-video-v11-generated

      - name: Run full regression and Worker build checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/mobile-video-v11-test-logs
          npm test 2>&1 | tee /tmp/mobile-video-v11-test-logs/npm-test.log
          npm run check 2>&1 | tee /tmp/mobile-video-v11-test-logs/npm-check.log
          git diff --exit-code 2>&1 | tee /tmp/mobile-video-v11-test-logs/git-diff.log

      - name: Upload generated evidence and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-video-v11-release-evidence
          path: |
            /tmp/stabilize-mobile-video-v11-clean/mobile-forest-stream-video-v11-1536.mp4
            /tmp/stabilize-mobile-video-v11-clean/mobile-forest-stream-v11-1536.webp
            /tmp/stabilize-mobile-video-v11-clean/frame-early.png
            /tmp/stabilize-mobile-video-v11-clean/frame-late.png
            /tmp/stabilize-mobile-video-v11-clean/probe.json
            /tmp/mobile-video-v11-test-logs
          if-no-files-found: warn
          retention-days: 7

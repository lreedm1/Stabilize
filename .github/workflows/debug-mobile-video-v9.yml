name: Build smooth mobile video release

on:
  pull_request:
    paths:
      - scripts/generate-mobile-video-smooth.sh
      - scripts/prepare-mobile-video-smooth-release.py
      - .github/workflows/debug-mobile-video-v9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install video tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate and strictly validate the smooth video
        shell: bash
        run: |
          bash scripts/generate-mobile-video-smooth.sh \
            /tmp/stabilize-mobile-video-smooth

      - name: Generate and validate the matching poster
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/stabilize-mobile-video-smooth
          video="$work/mobile-forest-stream-video-v12-720.mp4"
          poster="$work/mobile-forest-stream-v12-720.webp"
          ffmpeg -hide_banner -v error -y -i "$video" \
            -frames:v 1 -c:v libwebp -quality 86 -compression_level 6 "$poster"
          dimensions="$(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 "$poster"
          )"
          test "$dimensions" = 720x1280
          test "$(dd if="$poster" bs=1 count=4 status=none)" = RIFF
          test "$(dd if="$poster" bs=1 skip=8 count=4 status=none)" = WEBP
          echo "poster_bytes=$(wc -c < "$poster" | tr -d '[:space:]')"
          sha256sum "$poster"

      - name: Prepare, test, and publish the release branch
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/stabilize-mobile-video-smooth
          cp scripts/generate-mobile-video-smooth.sh /tmp/generate-mobile-video-smooth.sh
          cp scripts/prepare-mobile-video-smooth-release.py /tmp/prepare-mobile-video-smooth-release.py

          git fetch --no-tags origin main:refs/remotes/origin/main
          git switch -C agent/mobile-video-smooth-release refs/remotes/origin/main

          npm ci --ignore-scripts
          npm run apply:prompt-policy

          cp /tmp/generate-mobile-video-smooth.sh scripts/generate-mobile-video-smooth.sh
          cp /tmp/prepare-mobile-video-smooth-release.py scripts/prepare-mobile-video-smooth-release.py
          chmod +x scripts/generate-mobile-video-smooth.sh
          chmod +x scripts/prepare-mobile-video-smooth-release.py

          python /tmp/prepare-mobile-video-smooth-release.py \
            "$work/mobile-forest-stream-video-v12-720.mp4" \
            "$work/mobile-forest-stream-v12-720.webp"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace the stuttering mobile background with a smooth baseline video'

          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

          git push --force origin HEAD:agent/mobile-video-smooth-release

      - name: Upload generated evidence and release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smooth-mobile-video-release-evidence
          path: |
            /tmp/stabilize-mobile-video-smooth/mobile-forest-stream-video-v12-720.mp4
            /tmp/stabilize-mobile-video-smooth/mobile-forest-stream-v12-720.webp
            /tmp/stabilize-mobile-video-smooth/frame-early.png
            /tmp/stabilize-mobile-video-smooth/frame-late.png
            /tmp/stabilize-mobile-video-smooth/probe.json
            /tmp/stabilize-mobile-video-smooth/framemd5.txt
          if-no-files-found: warn
          retention-days: 7

name: Fix Fast mode latency generation

on:
  push:
    branches:
      - agent/fast-mode-latency

permissions:
  contents: write

concurrency:
  group: fix-fast-mode-latency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fast-mode-latency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix and reapply policy
        run: node scripts/fix-priority-latency-nonstream.mjs
      - name: Commit canonical output
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix non-streaming Fast mode payload"
            git push origin HEAD:agent/fast-mode-latency
          fi
      - run: npm test
      - run: npm run check
      - run: npm run verify:clean

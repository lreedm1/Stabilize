name: Evaluate true-resolution mobile background candidates v20

on:
  push:
    branches:
      - agent/mobile-resolution-diagnostic-v20
    paths:
      - .github/workflows/evaluate-mobile-background-candidates-v20.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/evaluate-mobile-background-candidates-v20.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-resolution-diagnostic-v20
          persist-credentials: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick
          python -m pip install --disable-pip-version-check yt-dlp

      - name: Capture source-quality previews
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/mobile-candidates-v20
          mkdir -p "$work"

          cat > "$work/candidates.tsv" <<'EOF'
          pexels-mossy-woodland	https://www.pexels.com/video/stream-flowing-in-mossy-woodland-6918262/
          pexels-wild-garlic-stream	https://www.pexels.com/video/tranquil-forest-stream-flowing-through-mossy-rocks-31402111/
          pexels-mossy-rocks	https://www.pexels.com/video/tranquil-forest-stream-flowing-over-mossy-rocks-29963310/
          pixabay-mountain-river	https://pixabay.com/videos/nature-river-mountain-forest-water-328650/
          pixabay-forest-reflection	https://pixabay.com/videos/forest-stream-water-reflection-345609/
          EOF

          : > "$work/results.txt"
          while IFS=$'\t' read -r name page; do
            echo "Evaluating $name" | tee -a "$work/results.txt"
            url="$(yt-dlp --no-playlist --no-warnings -f 'bestvideo[height>=1080]/best[height>=1080]/best' -g "$page" | head -n 1 || true)"
            if [[ -z "$url" ]]; then
              echo "$name: could not resolve direct media URL" | tee -a "$work/results.txt"
              continue
            fi

            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate \
              -of default=noprint_wrappers=1 "$url" \
              > "$work/${name}-ffprobe.txt" || true

            # Capture at several points because an opening frame can be soft from
            # a dissolve even when the source is otherwise sharp.
            for second in 1 3 5; do
              ffmpeg -hide_banner -loglevel error -y -ss "$second" -i "$url" \
                -frames:v 1 "$work/${name}-${second}s-native.png" || true
              test -s "$work/${name}-${second}s-native.png" || continue
              ffmpeg -hide_banner -loglevel error -y \
                -i "$work/${name}-${second}s-native.png" \
                -vf "scale=540:960:force_original_aspect_ratio=increase:flags=lanczos,crop=540:960" \
                -frames:v 1 "$work/${name}-${second}s-mobile-preview.png"
              rm -f "$work/${name}-${second}s-native.png"
            done

            echo "$name: resolved" | tee -a "$work/results.txt"
          done < "$work/candidates.tsv"

          sha256sum "$work"/*.png "$work"/*-ffprobe.txt 2>/dev/null \
            > "$work/sha256.txt" || true

      - name: Upload candidate previews
        uses: actions/upload-artifact@v4
        with:
          name: mobile-background-candidates-v20
          path: /tmp/mobile-candidates-v20
          if-no-files-found: error
          retention-days: 7

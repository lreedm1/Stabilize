name: Run mobile v31 release-gate repair

on:
  push:
    branches:
      - fix/wire-mobile-v31-pipeline
    paths:
      - scripts/repair-mobile-v31-release-gate.mjs
      - .github/workflows/run-mobile-v31-release-gate-repair.yml
  workflow_dispatch:

concurrency:
  group: run-mobile-v31-release-gate-repair
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: fix/wire-mobile-v31-pipeline
          fetch-depth: 1
          persist-credentials: true

      - name: Apply deterministic repair
        run: node scripts/repair-mobile-v31-release-gate.mjs

      - name: Validate patched JavaScript and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check public/mobile-video-handoff-v31.js
          node --check scripts/finalize-mobile-video-handoff-v31.mjs
          git diff --check

      - name: Commit repaired release gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- \
            .github/workflows/fix-mobile-v31-verifier-cache-keys.yml \
            .github/workflows/run-mobile-v31-release-gate-repair.yml \
            scripts/repair-mobile-v31-release-gate.mjs
          git add \
            .github/workflows/verify-mobile-video.yml \
            public/mobile-video-handoff-v31.js \
            test/mobile-video-handoff-v31.test.mjs
          git diff --cached --check
          git commit -m 'Correct mobile v31 release verification'
          git push origin HEAD:fix/wire-mobile-v31-pipeline

name: Bridge uploaded mobile video installation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-mobile-video-bridge.yml

permissions:
  contents: write

concurrency:
  group: bridge-mobile-forest-video
  cancel-in-progress: true

jobs:
  install-on-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the prepared feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-forest-video
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and verify the optimized uploaded MP4
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t chunks < <(find materialize/mobile-forest-video -maxdepth 1 -type f -name '*.b64' | sort)
          test "${#chunks[@]}" -eq 5
          mkdir -p public/scenes
          cat "${chunks[@]}" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > public/scenes/mobile-forest-stream-loop-v1.mp4
          test "$(wc -c < public/scenes/mobile-forest-stream-loop-v1.mp4)" -eq 43100
          printf '%s  %s\n' \
            'c1258ba20e6aa01554b9f946d47b449a2688b7630708bb85f902597bfe283326' \
            'public/scenes/mobile-forest-stream-loop-v1.mp4' \
            | sha256sum --check --strict

      - name: Install the mobile video implementation
        run: |
          node scripts/enable-mobile-video.mjs
          node scripts/apply-mobile-video.mjs

      - name: Install dependencies and regenerate canonical output
        run: npm ci

      - name: Run complete tests
        run: npm test

      - name: Validate the Worker build
        run: npm run check

      - name: Remove temporary transfer and installer files
        run: |
          rm -rf materialize/mobile-forest-video
          rm -f scripts/enable-mobile-video.mjs
          rm -f .github/workflows/enable-mobile-video.yml

      - name: Commit and push the validated release
        shell: bash
        run: |
          set -euo pipefail
          test -f public/scenes/mobile-forest-stream-loop-v1.mp4
          test "$(wc -c < public/scenes/mobile-forest-stream-loop-v1.mp4)" -eq 43100
          printf '%s  %s\n' \
            'c1258ba20e6aa01554b9f946d47b449a2688b7630708bb85f902597bfe283326' \
            'public/scenes/mobile-forest-stream-loop-v1.mp4' \
            | sha256sum --check --strict
          grep -Fq 'id="mobile-background-video"' src/page.js
          grep -Fq 'autoplay' src/page.js
          grep -Fq 'muted' src/page.js
          grep -Fq 'loop' src/page.js
          grep -Fq 'playsinline' src/page.js
          grep -Fq 'video.defaultMuted = true' public/mobile-quality.js
          grep -Fq 'video.play()' public/mobile-quality.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No mobile-video changes were produced.'
            exit 1
          fi
          git commit -m 'Play the uploaded forest stream on mobile'
          npm run verify:clean
          git push origin HEAD:agent/mobile-forest-video

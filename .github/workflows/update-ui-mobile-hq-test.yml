name: Update UI mobile HQ test

on:
  push:
    branches:
      - agent/mobile-hq-v1
    paths:
      - .github/workflows/update-ui-mobile-hq-test.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-hq-v1
          fetch-depth: 0

      - name: Update legacy filename assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("test/ui.test.mjs")
          text = path.read_text()
          old = '''  assert.match(pageSource, /lake-valley-portrait-720\\.webp 720w/);
          assert.match(pageSource, /lake-valley-portrait-2160\\.webp 2160w/);'''.replace("          ", "")
          new = '''  assert.match(pageSource, /mobile-forest-hq-v1-1080\\.webp 1080w/);
          assert.match(pageSource, /mobile-forest-hq-v1-2430\\.webp 2430w/);
          assert.match(pageSource, /mobile-quality\\.js/);'''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(f"Expected one legacy assertion block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/update-ui-mobile-hq-test.yml").unlink()
          PY

      - name: Commit test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/ui.test.mjs .github/workflows/update-ui-mobile-hq-test.yml
          git commit -m "Update UI test for high-quality mobile assets"
          git push origin HEAD:agent/mobile-hq-v1

name: Verify mobile video background release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-background-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-mobile-background:
    name: Verify exact mobile video release
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Materialize the canonical mobile media
        run: node scripts/materialize-mobile-forest-stream.mjs

      - name: Verify the exact mobile video background is live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_script_path="$(
            grep -oE '/mobile-quality\.js\?v=[A-Za-z0-9._-]+' src/page.js \
              | tail -n 1 \
              || true
          )"
          expected_poster_asset="$(
            sed -n 's/^const MOBILE_ASSET = "\([^"]*\)";$/\1/p' \
              scripts/use-mobile-forest-stream.mjs \
              | head -n 1 \
              || true
          )"
          expected_video_asset="$(
            sed -n 's/^const MOBILE_VIDEO_ASSET = "\([^"]*\)";$/\1/p' \
              scripts/use-mobile-forest-stream.mjs \
              | head -n 1 \
              || true
          )"
          expected_poster_file="public${expected_poster_asset}"
          expected_video_file="public${expected_video_asset}"

          if [[ -z "$expected_script_path" \
            || -z "$expected_poster_asset" \
            || -z "$expected_video_asset" \
            || ! -f "$expected_poster_file" \
            || ! -f "$expected_video_file" ]]; then
            echo "::error::Could not derive the expected mobile script, poster, and video from the checked-out release."
            exit 1
          fi

          expected_poster_sha="$(sha256sum "$expected_poster_file" | awk '{print $1}')"
          expected_poster_bytes="$(wc -c < "$expected_poster_file" | tr -d '[:space:]')"
          expected_video_sha="$(sha256sum "$expected_video_file" | awk '{print $1}')"
          expected_video_bytes="$(wc -c < "$expected_video_file" | tr -d '[:space:]')"

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-video-background","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" \
              "$description" \
              "$GITHUB_SERVER_URL" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          publish_status pending "Waiting for the exact mobile forest video"

          for attempt in {1..36}; do
            cache_key="${GITHUB_SHA}-${attempt}"
            : > "$tmpdir/live.html"
            : > "$tmpdir/mobile-quality.js"
            : > "$tmpdir/poster.headers"
            : > "$tmpdir/poster.webp"
            : > "$tmpdir/video.headers"
            : > "$tmpdir/video.mp4"

            html_status="$(
              curl --max-time 20 --silent --show-error \
                --header "Cache-Control: no-cache" \
                --output "$tmpdir/live.html" \
                --write-out "%{http_code}" \
                "https://stabilize.info/?mobile-video-release=${cache_key}" \
                || true
            )"
            script_status="$(
              curl --max-time 20 --silent --show-error \
                --header "Cache-Control: no-cache" \
                --output "$tmpdir/mobile-quality.js" \
                --write-out "%{http_code}" \
                "https://stabilize.info${expected_script_path}&release=${cache_key}" \
                || true
            )"
            poster_status="$(
              curl --max-time 20 --silent --show-error \
                --header "Cache-Control: no-cache" \
                --dump-header "$tmpdir/poster.headers" \
                --output "$tmpdir/poster.webp" \
                --write-out "%{http_code}" \
                "https://stabilize.info${expected_poster_asset}?release=${cache_key}" \
                || true
            )"
            video_status="$(
              curl --max-time 30 --silent --show-error \
                --header "Cache-Control: no-cache" \
                --dump-header "$tmpdir/video.headers" \
                --output "$tmpdir/video.mp4" \
                --write-out "%{http_code}" \
                "https://stabilize.info${expected_video_asset}?release=${cache_key}" \
                || true
            )"

            live_poster_bytes="$(wc -c < "$tmpdir/poster.webp" | tr -d '[:space:]')"
            live_poster_sha="$(sha256sum "$tmpdir/poster.webp" | awk '{print $1}')"
            live_video_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
            live_video_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"
            live_video_type="$(
              awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' \
                "$tmpdir/video.headers" \
                | tail -n 1 \
                || true
            )"

            echo "Mobile video attempt ${attempt}: html=${html_status:-000} script=${script_status:-000} poster=${poster_status:-000} video=${video_status:-000}; poster-bytes=${live_poster_bytes:-0}; video-bytes=${live_video_bytes:-0}; video-sha=${live_video_sha:0:12}; video-type=${live_video_type:-missing}."

            if [[ "$html_status" == "200" \
              && "$script_status" == "200" \
              && "$poster_status" == "200" \
              && "$video_status" == "200" \
              && "$live_poster_bytes" == "$expected_poster_bytes" \
              && "$live_poster_sha" == "$expected_poster_sha" \
              && "$live_video_bytes" == "$expected_video_bytes" \
              && "$live_video_sha" == "$expected_video_sha" \
              && "$live_video_type" == video/mp4* ]] \
              && grep -Fq "$expected_script_path" "$tmpdir/live.html" \
              && grep -Fq "$expected_poster_asset" "$tmpdir/live.html" \
              && grep -Fq "$expected_video_asset" "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.autoplay = true' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.muted = true' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.defaultMuted = true' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.loop = true' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.playsInline = true' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'webkit-playsinline' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.addEventListener("playing"' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'await mobileVideo.play()' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video-waiting-for-interaction' "$tmpdir/mobile-quality.js" \
              && grep -Fqi 'strict-transport-security: max-age=31536000; includeSubDomains' "$tmpdir/video.headers" \
              && grep -Fqi 'etag:' "$tmpdir/video.headers"; then
              echo "Production serves the exact muted H.264 mobile loop and its still fallback."
              publish_status success "Exact mobile forest video is live"
              exit 0
            fi

            sleep 10
          done

          publish_status failure "Exact mobile forest video is not live"
          echo "::error::Production never served the checked-out mobile video bytes and autoplay wiring together."
          exit 1

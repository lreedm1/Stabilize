name: Verify mobile canvas background release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-background-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-production-assets:
    name: Verify exact canvas background release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the exact page, client, poster, and sprite are live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_client_path="$(
            grep -oE '/mobile-motion-canvas\.js\?v=[A-Za-z0-9._-]+' src/page.js \
              | tail -n 1 \
              || true
          )"
          expected_style_path="$(
            grep -oE '/mobile-woodland-loop\.css\?v=[A-Za-z0-9._-]+' src/page.js \
              | tail -n 1 \
              || true
          )"
          expected_poster_asset="$(
            grep -oE '/scenes/mobile-[^" ]+\.webp' src/page.js \
              | grep -v 'water-sprite' \
              | head -n 1 \
              || true
          )"
          expected_sprite_asset="$(
            grep -oE '/scenes/mobile-[^" ]*water-sprite[^" ]*\.webp' src/page.js \
              | head -n 1 \
              || true
          )"
          expected_poster_width="$(
            grep -F "${expected_poster_asset} " src/page.js \
              | grep -oE '[0-9]+w' \
              | head -n 1 \
              | tr -d 'w' \
              || true
          )"

          expected_client_file="public${expected_client_path%%\?*}"
          expected_style_file="public${expected_style_path%%\?*}"
          expected_poster_file="public${expected_poster_asset}"
          expected_sprite_file="public${expected_sprite_asset}"

          if [[ -z "$expected_client_path" \
            || -z "$expected_style_path" \
            || -z "$expected_poster_asset" \
            || -z "$expected_sprite_asset" \
            || -z "$expected_poster_width" \
            || ! -f "$expected_client_file" \
            || ! -f "$expected_style_file" \
            || ! -f "$expected_poster_file" \
            || ! -f "$expected_sprite_file" ]]; then
            echo "::error::Could not derive the canvas client, Retina poster, and water sprite from the checked-out release."
            exit 1
          fi

          expected_poster_sha="$(sha256sum "$expected_poster_file" | awk '{print $1}')"
          expected_poster_bytes="$(wc -c < "$expected_poster_file" | tr -d '[:space:]')"
          expected_sprite_sha="$(sha256sum "$expected_sprite_file" | awk '{print $1}')"
          expected_sprite_bytes="$(wc -c < "$expected_sprite_file" | tr -d '[:space:]')"

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-motion-canvas","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" \
              "$description" \
              "$GITHUB_SERVER_URL" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          publish_status pending "Waiting for the exact canvas mobile release"

          for attempt in {1..36}; do
            cache_key="${GITHUB_SHA}-${attempt}"
            : > "$tmpdir/live.html"
            : > "$tmpdir/client.js"
            : > "$tmpdir/mobile.css"
            : > "$tmpdir/poster.headers"
            : > "$tmpdir/poster.webp"
            : > "$tmpdir/sprite.headers"
            : > "$tmpdir/sprite.webp"

            html_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header "Cache-Control: no-cache" \
                --output "$tmpdir/live.html" \
                --write-out "%{http_code}" \
                "https://stabilize.info/?mobile-canvas-release=${cache_key}" \
                || true
            )"
            client_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header "Cache-Control: no-cache" \
                --output "$tmpdir/client.js" \
                --write-out "%{http_code}" \
                "https://stabilize.info${expected_client_path}&release=${cache_key}" \
                || true
            )"
            style_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header "Cache-Control: no-cache" \
                --output "$tmpdir/mobile.css" \
                --write-out "%{http_code}" \
                "https://stabilize.info${expected_style_path}&release=${cache_key}" \
                || true
            )"
            poster_status="$(
              curl --max-time 30 --silent --show-error \
                --header "Cache-Control: no-cache" \
                --dump-header "$tmpdir/poster.headers" \
                --output "$tmpdir/poster.webp" \
                --write-out "%{http_code}" \
                "https://stabilize.info${expected_poster_asset}?release=${cache_key}" \
                || true
            )"
            sprite_status="$(
              curl --max-time 30 --silent --show-error \
                --header "Cache-Control: no-cache" \
                --dump-header "$tmpdir/sprite.headers" \
                --output "$tmpdir/sprite.webp" \
                --write-out "%{http_code}" \
                "https://stabilize.info${expected_sprite_asset}?release=${cache_key}" \
                || true
            )"

            live_poster_bytes="$(wc -c < "$tmpdir/poster.webp" | tr -d '[:space:]')"
            live_poster_sha="$(sha256sum "$tmpdir/poster.webp" | awk '{print $1}')"
            live_sprite_bytes="$(wc -c < "$tmpdir/sprite.webp" | tr -d '[:space:]')"
            live_sprite_sha="$(sha256sum "$tmpdir/sprite.webp" | awk '{print $1}')"
            live_poster_type="$(
              awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' \
                "$tmpdir/poster.headers" | tail -n 1 || true
            )"
            live_sprite_type="$(
              awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' \
                "$tmpdir/sprite.headers" | tail -n 1 || true
            )"
            poster_ref_count="$(
              (grep -oF "$expected_poster_asset" "$tmpdir/live.html" || true) \
                | wc -l | tr -d '[:space:]'
            )"
            sprite_ref_count="$(
              (grep -oF "$expected_sprite_asset" "$tmpdir/live.html" || true) \
                | wc -l | tr -d '[:space:]'
            )"

            echo "Canvas release attempt ${attempt}: html=${html_status:-000} client=${client_status:-000} css=${style_status:-000} poster=${poster_status:-000} sprite=${sprite_status:-000}; poster=${live_poster_bytes:-0}/${expected_poster_bytes}; sprite=${live_sprite_bytes:-0}/${expected_sprite_bytes}; refs=${poster_ref_count}/${sprite_ref_count}."

            if [[ "$html_status" == "200" \
              && "$client_status" == "200" \
              && "$style_status" == "200" \
              && "$poster_status" == "200" \
              && "$sprite_status" == "200" \
              && "$live_poster_bytes" == "$expected_poster_bytes" \
              && "$live_poster_sha" == "$expected_poster_sha" \
              && "$live_sprite_bytes" == "$expected_sprite_bytes" \
              && "$live_sprite_sha" == "$expected_sprite_sha" \
              && "$poster_ref_count" -ge 2 \
              && "$sprite_ref_count" -eq 1 \
              && "$live_poster_type" == image/webp* \
              && "$live_sprite_type" == image/webp* ]] \
              && grep -Fq 'id="mobile-motion-canvas"' "$tmpdir/live.html" \
              && grep -Fq "$expected_client_path" "$tmpdir/live.html" \
              && grep -Fq "$expected_style_path" "$tmpdir/live.html" \
              && grep -Fq "${expected_poster_asset} ${expected_poster_width}w" "$tmpdir/live.html" \
              && grep -Fq 'id="mobile-background-video"' "$tmpdir/live.html" \
              && grep -Fq 'mobile-quality.js' "$tmpdir/live.html" \
              && grep -Fq "const SPRITE_ASSET" "$tmpdir/client.js" \
              && grep -Fq "$expected_sprite_asset" "$tmpdir/client.js" \
              && grep -Fq 'const FRAME_RATE = 6;' "$tmpdir/client.js" \
              && grep -Fq 'ctx.drawImage(' "$tmpdir/client.js" \
              && grep -Fq 'setTimeout(step' "$tmpdir/client.js" \
              && ! grep -Fq '.play(' "$tmpdir/client.js" \
              && ! grep -Fq 'HTMLVideoElement' "$tmpdir/client.js" \
              && grep -Fq 'mobile-motion-canvas-v18-start' "$tmpdir/mobile.css" \
              && grep -Fq '.mobile-motion-canvas.is-ready' "$tmpdir/mobile.css" \
              && grep -Fq 'opacity: 1;' "$tmpdir/mobile.css"; then
              echo "Production serves the native video with its exact canvas fallback."
              publish_status success "Native video and canvas fallback are live"
              exit 0
            fi

            sleep 10
          done

          publish_status failure "Exact canvas mobile release is not live"
          echo "::error::Production never served the checked-out canvas page, client, Retina poster, and water sprite together."
          exit 1

  verify-webkit-motion:
    name: Verify visible motion in mobile WebKit
    needs: verify-production-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Playwright WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Confirm the production canvas paints changing visible frames
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { webkit } from "playwright";

          const browser = await webkit.launch({ headless: true });
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
                "Mobile/15E148 Safari/604.1",
            });
            const page = await context.newPage();
            page.on("console", (message) =>
              console.log(`browser:${message.type()}: ${message.text()}`),
            );
            page.on("pageerror", (error) =>
              console.error(`browser-pageerror: ${error.message}`),
            );

            await page.goto(
              `https://stabilize.info/?webkit-canvas-release=${process.env.RELEASE_SHA}`,
              { waitUntil: "domcontentloaded", timeout: 60_000 },
            );
            await page.waitForSelector("#mobile-motion-canvas", {
              state: "attached",
              timeout: 60_000,
            });
            await page.waitForFunction(
              () =>
                document.documentElement.dataset.mobileMotion ===
                "canvas-playing",
              undefined,
              { timeout: 60_000 },
            );

            const sample = () =>
              page.evaluate(() => {
                const canvas = document.querySelector("#mobile-motion-canvas");
                if (!(canvas instanceof HTMLCanvasElement)) {
                  throw new Error("The mobile motion canvas is missing.");
                }
                const context = canvas.getContext("2d");
                if (!context) throw new Error("The canvas has no 2D context.");

                const startX = Math.floor(canvas.width * 0.18);
                const startY = Math.floor(canvas.height * 0.3);
                const width = Math.max(1, Math.floor(canvas.width * 0.64));
                const height = Math.max(1, Math.floor(canvas.height * 0.68));
                const pixels = context.getImageData(
                  startX,
                  startY,
                  width,
                  height,
                ).data;
                let hash = 2166136261;
                let nontransparent = 0;
                for (let index = 0; index < pixels.length; index += 64) {
                  hash ^= pixels[index];
                  hash = Math.imul(hash, 16777619);
                  hash ^= pixels[index + 1];
                  hash = Math.imul(hash, 16777619);
                  hash ^= pixels[index + 2];
                  hash = Math.imul(hash, 16777619);
                  hash ^= pixels[index + 3];
                  hash = Math.imul(hash, 16777619);
                  if (pixels[index + 3] > 0) nontransparent += 1;
                }
                const style = getComputedStyle(canvas);
                return {
                  hash: hash >>> 0,
                  nontransparent,
                  width: canvas.width,
                  height: canvas.height,
                  opacity: style.opacity,
                  display: style.display,
                  ready: canvas.classList.contains("is-ready"),
                  state: document.documentElement.dataset.mobileMotion,
                  videoCount: document.querySelectorAll(
                    "#mobile-background-video",
                  ).length,
                };
              });

            await page.waitForTimeout(250);
            const first = await sample();
            await page.waitForTimeout(850);
            const second = await sample();
            console.log(JSON.stringify({ first, second }, null, 2));

            if (!first.ready || !second.ready) {
              throw new Error("The production canvas never became ready.");
            }
            if (first.opacity !== "1" || second.opacity !== "1") {
              throw new Error("The production canvas is not visibly opaque.");
            }
            if (first.display === "none" || second.display === "none") {
              throw new Error("The production canvas is hidden.");
            }
            if (first.nontransparent === 0 || second.nontransparent === 0) {
              throw new Error("The production canvas did not paint water pixels.");
            }
            if (first.hash === second.hash) {
              throw new Error("The production canvas did not advance visible frames.");
            }
            if (first.videoCount !== 1 || second.videoCount !== 1) {
              throw new Error("The native background video is missing or duplicated.");
            }
          } finally {
            await browser.close();
          }
          NODE

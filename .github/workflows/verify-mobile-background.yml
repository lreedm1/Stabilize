name: Verify mobile background v30 fallback

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-background-v30-fallback-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-production-assets:
    name: Verify exact v30 fallback assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for the exact v30 page and media
        shell: bash
        run: |
          set -euo pipefail
          version='20260813-mobile-background-v30-1'
          poster='public/scenes/mobile-forest-stream-v24-native-1080.webp'
          atlas='public/scenes/mobile-forest-stream-full-atlas-v29-1080.webp'
          video='public/scenes/mobile-forest-stream-video-v24-native-1080.mp4'
          expected_poster_sha="$(sha256sum "$poster" | awk '{print $1}')"
          expected_atlas_sha="$(sha256sum "$atlas" | awk '{print $1}')"
          expected_video_sha="$(sha256sum "$video" | awk '{print $1}')"
          expected_poster_bytes="$(wc -c < "$poster" | tr -d '[:space:]')"
          expected_atlas_bytes="$(wc -c < "$atlas" | tr -d '[:space:]')"
          expected_video_bytes="$(wc -c < "$video" | tr -d '[:space:]')"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          ready=false
          for attempt in {1..36}; do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            page_status="$(curl --max-time 30 --silent --show-error --compressed -H 'Cache-Control: no-cache' -o "$tmpdir/page.html" -w '%{http_code}' "https://stabilize.info/?mobile-background-v30-fallback=${nonce}" || true)"
            client_status="$(curl --max-time 30 --silent --show-error --compressed -H 'Cache-Control: no-cache' -o "$tmpdir/client.js" -w '%{http_code}' "https://stabilize.info/mobile-background-v30.js?v=${version}&verify=${nonce}" || true)"
            style_status="$(curl --max-time 30 --silent --show-error --compressed -H 'Cache-Control: no-cache' -o "$tmpdir/styles.css" -w '%{http_code}' "https://stabilize.info/mobile-background-v30.css?v=${version}&verify=${nonce}" || true)"
            poster_status="$(curl --max-time 60 --silent --show-error -H 'Cache-Control: no-cache' -o "$tmpdir/poster.webp" -w '%{http_code}' "https://stabilize.info/scenes/mobile-forest-stream-v24-native-1080.webp?v=${version}&verify=${nonce}" || true)"
            atlas_status="$(curl --max-time 60 --silent --show-error -H 'Cache-Control: no-cache' -o "$tmpdir/atlas.webp" -w '%{http_code}' "https://stabilize.info/scenes/mobile-forest-stream-full-atlas-v29-1080.webp?v=${version}&verify=${nonce}" || true)"
            video_status="$(curl --max-time 120 --silent --show-error -H 'Cache-Control: no-cache' -o "$tmpdir/video.mp4" -w '%{http_code}' "https://stabilize.info/media/mobile-forest-stream-video-v24-native-1080.mp4?v=${version}&verify=${nonce}" || true)"

            poster_bytes="$(wc -c < "$tmpdir/poster.webp" | tr -d '[:space:]')"
            atlas_bytes="$(wc -c < "$tmpdir/atlas.webp" | tr -d '[:space:]')"
            video_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
            poster_sha="$(sha256sum "$tmpdir/poster.webp" | awk '{print $1}')"
            atlas_sha="$(sha256sum "$tmpdir/atlas.webp" | awk '{print $1}')"
            video_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"

            echo "attempt=${attempt} page=${page_status} client=${client_status} style=${style_status} poster=${poster_status} atlas=${atlas_status} video=${video_status}"

            if [[ "$page_status" == 200 \
              && "$client_status" == 200 \
              && "$style_status" == 200 \
              && "$poster_status" == 200 \
              && "$atlas_status" == 200 \
              && "$video_status" == 200 \
              && "$poster_bytes" == "$expected_poster_bytes" \
              && "$atlas_bytes" == "$expected_atlas_bytes" \
              && "$video_bytes" == "$expected_video_bytes" \
              && "$poster_sha" == "$expected_poster_sha" \
              && "$atlas_sha" == "$expected_atlas_sha" \
              && "$video_sha" == "$expected_video_sha" ]] \
              && grep -Fq "/mobile-background-v30.css?v=${version}" "$tmpdir/page.html" \
              && grep -Fq "/mobile-background-v30.js?v=${version}" "$tmpdir/page.html" \
              && grep -Fq 'id="mobile-background-video"' "$tmpdir/page.html" \
              && grep -Fq 'id="mobile-background-v30"' "$tmpdir/page.html" \
              && grep -Fq 'id="message-input"' "$tmpdir/page.html" \
              && ! grep -Fq '/mobile-quality.js' "$tmpdir/page.html" \
              && ! grep -Fq '/mobile-motion-canvas.js' "$tmpdir/page.html" \
              && ! grep -Fq '/mobile-full-motion-v29.js' "$tmpdir/page.html" \
              && ! grep -Fq '/mobile-autoplay-v27.js' "$tmpdir/page.html" \
              && grep -Fq 'motionDelta = interpolatedFrame - referenceFrame' "$tmpdir/client.js" \
              && grep -Fq 'requestAnimationFrame(drawFallback)' "$tmpdir/client.js" \
              && grep -Fq 'requestVideoFrameCallback' "$tmpdir/client.js" \
              && grep -Fq 'const result = video.play()' "$tmpdir/client.js" \
              && grep -Fq 'opacity: 0.001 !important' "$tmpdir/styles.css" \
              && grep -Fq 'data-mobile-background-v30="video"' "$tmpdir/styles.css"; then
              ready=true
              break
            fi
            sleep 10
          done

          if [[ "$ready" != true ]]; then
            echo '::error::The exact mobile background v30 release did not become live.'
            exit 1
          fi

          echo 'The exact mobile background v30 fallback release is live.'

  verify-blocked-autoplay-fallback:
    name: Verify motion before a tap when autoplay is denied
    needs: verify-production-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install Playwright WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Block media playback and prove the canvas still moves
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mobile-background-v30-fallback
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { writeFile } from "node:fs/promises";
          import { webkit } from "playwright";

          const browser = await webkit.launch({ headless: true });
          const evidence = { errors: [] };
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
                "Mobile/15E148 Safari/604.1",
            });
            await context.addInitScript(() => {
              HTMLMediaElement.prototype.play = function playBlockedForTest() {
                return Promise.reject(
                  new DOMException("Playback requires a gesture", "NotAllowedError"),
                );
              };
            });

            const page = await context.newPage();
            page.on("pageerror", (error) => evidence.errors.push(error.message));
            page.on("requestfailed", (request) =>
              evidence.errors.push(
                `${request.url()}: ${request.failure()?.errorText || "failed"}`,
              ),
            );

            await page.goto(
              `https://stabilize.info/?mobile-background-v30-blocked=${process.env.RELEASE_SHA}`,
              { waitUntil: "domcontentloaded", timeout: 60_000 },
            );
            await page.waitForFunction(
              () =>
                document.documentElement.dataset.mobileBackgroundV30 === "fallback" &&
                document.querySelector("#mobile-background-v30")?.classList.contains("is-ready"),
              undefined,
              { timeout: 60_000 },
            );

            evidence.state = await page.evaluate(() => {
              const canvas = document.querySelector("#mobile-background-v30");
              const video = document.querySelector("#mobile-background-video");
              if (!(canvas instanceof HTMLCanvasElement)) throw new Error("v30 canvas missing");
              if (!(video instanceof HTMLVideoElement)) throw new Error("v30 video missing");
              const canvasStyle = getComputedStyle(canvas);
              const videoStyle = getComputedStyle(video);
              return {
                state: document.documentElement.dataset.mobileBackgroundV30,
                quality: document.documentElement.dataset.mobileBackgroundV30Quality,
                playbackError:
                  document.documentElement.dataset.mobileBackgroundV30PlaybackError,
                canvasWidth: canvas.width,
                canvasHeight: canvas.height,
                canvasOpacity: canvasStyle.opacity,
                videoDisplay: videoStyle.display,
                videoVisibility: videoStyle.visibility,
                videoOpacity: Number(videoStyle.opacity),
                inputPresent: Boolean(document.querySelector("#message-input")),
              };
            });

            const state = evidence.state;
            if (state.state !== "fallback") throw new Error(`unexpected state: ${state.state}`);
            if (!state.quality) throw new Error("fallback quality diagnostic is missing");
            if (state.playbackError !== "NotAllowedError") {
              throw new Error(`expected NotAllowedError, received ${state.playbackError}`);
            }
            if (state.canvasWidth < 780 || state.canvasHeight < 1688) {
              throw new Error(`canvas is undersized: ${state.canvasWidth}x${state.canvasHeight}`);
            }
            if (state.canvasOpacity !== "1") throw new Error("fallback canvas is not visible");
            if (state.videoDisplay === "none" || state.videoVisibility === "hidden") {
              throw new Error("the video was removed from WebKit's render tree");
            }
            if (!(state.videoOpacity > 0 && state.videoOpacity < 0.01)) {
              throw new Error(`unexpected pre-play video opacity: ${state.videoOpacity}`);
            }
            if (!state.inputPresent) throw new Error("the application UI is missing");
            if (evidence.errors.length) {
              throw new Error(`page errors: ${JSON.stringify(evidence.errors)}`);
            }

            const canvas = page.locator("#mobile-background-v30");
            const first = await canvas.screenshot({ type: "png" });
            await page.waitForTimeout(350);
            const second = await canvas.screenshot({ type: "png" });
            evidence.firstHash = createHash("sha256").update(first).digest("hex");
            evidence.secondHash = createHash("sha256").update(second).digest("hex");
            if (evidence.firstHash === evidence.secondHash) {
              throw new Error("the no-tap canvas did not change between frames");
            }

            await page.screenshot({
              path: "/tmp/mobile-background-v30-fallback/production.png",
              fullPage: false,
            });
          } finally {
            await writeFile(
              "/tmp/mobile-background-v30-fallback/evidence.json",
              JSON.stringify(evidence, null, 2),
            );
            await browser.close();
          }
          NODE

      - name: Upload blocked-autoplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-background-v30-blocked-autoplay-evidence
          path: /tmp/mobile-background-v30-fallback
          if-no-files-found: warn
          retention-days: 7

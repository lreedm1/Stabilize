name: Build prompt policy output

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply prompt policy
        run: |
          test -f .github/deploy-cloudflare.original
          test -f .github/prompt-policy-trigger
          python - <<'PY'
          from pathlib import Path
          import re

          def require_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing {label}")
              return text.replace(old, new, 1)

          p = Path('src/index.js')
          s = p.read_text()
          s = require_replace(s, 'const MAX_BODY_BYTES = 32_000;\n', '', 'request body cap')
          s = require_replace(s, 'const MAX_MESSAGE_CHARS = 4_000;\n', '', 'message cap')
          s = require_replace(s, '// OpenAI counts visible output, hidden reasoning, and formatting tokens here.\nconst MAX_MODEL_OUTPUT_TOKENS = 500;\n', '', 'chat output cap')
          s, count = re.subn(
              r'async function readBoundedJson\(request\) \{.*?\n\}\n\n(?=function normalizeMessages)',
              'async function readRequestJson(request) {\n  try {\n    return await request.json();\n  } catch {\n    throw new HttpError(400, COPY.api.invalidJson);\n  }\n}\n\n',
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace bounded JSON reader')
          s = require_replace(s, 'text: String(message.content || "").trim().slice(0, MAX_MESSAGE_CHARS),', 'text: String(message.content || "").trim(),', 'normalized message truncation')
          s, count = re.subn(
              r'previous\.text = \(previous\.text \+ "\\n" \+ message\.text\)\.slice\(\s*0,\s*MAX_MESSAGE_CHARS,\s*\);',
              'previous.text = previous.text + "\\n" + message.text;',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not remove merged message truncation')
          s = require_replace(s, 'if (direct) return direct.slice(0, MAX_MESSAGE_CHARS);', 'if (direct) return direct;', 'direct message truncation')
          s = require_replace(s, 'return String(latestUser?.content || "").trim().slice(0, MAX_MESSAGE_CHARS);', 'return String(latestUser?.content || "").trim();', 'conversation message truncation')
          s = require_replace(s, 'readBoundedJson(request)', 'readRequestJson(request)', 'JSON reader use')
          s = require_replace(s, '      max_output_tokens: MAX_MODEL_OUTPUT_TOKENS,\n', '', 'chat max output field')
          p.write_text(s)

          p = Path('src/page.js')
          s = p.read_text()
          s, count = re.subn(r'\s+maxlength="4000"\n', '\n', s, count=1)
          if count != 1:
              raise SystemExit('Could not remove textarea maxlength')
          s = re.sub(r'/app\.js\?v=[^"\s]+', '/app.js?v=20260802-unbounded-prompts-1', s, count=1)
          p.write_text(s)

          p = Path('src/copy.js')
          s = p.read_text()
          rule = 'LENGTH: Keep ordinary responses to 500 words or fewer. When the user asks you to create, draft, expand, or revise a document, report, letter, bill, résumé, plan, brief, or other document-ready content, use the length needed to complete it well and do not apply the 500-word ceiling.'
          s = require_replace(s, '\n\nFINAL: Use the smallest sufficient intervention.', f'\n\n{rule}\n\nFINAL: Use the smallest sufficient intervention.', 'FINAL instruction')
          p.write_text(s)

          p = Path('test/worker.test.mjs')
          s = p.read_text()
          s = require_replace(s, '    assert.equal(providerBody.max_output_tokens, 500);', '    assert.equal("max_output_tokens" in providerBody, false);', 'old output assertion')
          s = require_replace(s, '    assert.match(providerBody.instructions, /Systems > willpower/i);', '    assert.match(providerBody.instructions, /Systems > willpower/i);\n    assert.match(providerBody.instructions, /500 words or fewer/i);\n    assert.match(providerBody.instructions, /document-ready content/i);', 'instruction test anchor')
          marker = 'test("rate limits return a retry time and a safe traceable error"'
          if marker not in s:
              raise SystemExit('Missing worker test insertion point')
          long_test = r'''

test("chat forwards long prompts without app-level truncation", async () => {
  const originalFetch = globalThis.fetch;
  let providerBody;
  globalThis.fetch = async (_input, init) => {
    providerBody = JSON.parse(init.body);
    return responseWithText("Received the full request.");
  };
  try {
    const longMessage = "Long prompt detail. ".repeat(700);
    const response = await worker.fetch(
      new Request("https://stabilize.test/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: longMessage }),
      }),
      createEnv({ DEMO_MODE: "false", OPENAI_API_KEY: "test-openai-key" }),
    );
    assert.equal(response.status, 200);
    assert.equal(providerBody.input.at(-1).content, longMessage.trim());
    assert.ok(providerBody.input.at(-1).content.length > 4_000);
    assert.equal("max_output_tokens" in providerBody, false);
  } finally {
    globalThis.fetch = originalFetch;
  }
});

'''
          s = s.replace(marker, long_test + marker, 1)
          p.write_text(s)

          p = Path('test/prompt-submit.test.mjs')
          s = p.read_text() + r'''

test("prompt and reply lengths use instructions rather than app hard caps", async () => {
  const [pageSource, workerSource, copySource] = await Promise.all([
    readFile(new URL("../src/page.js", import.meta.url), "utf8"),
    readFile(new URL("../src/index.js", import.meta.url), "utf8"),
    readFile(new URL("../src/copy.js", import.meta.url), "utf8"),
  ]);
  assert.doesNotMatch(pageSource, /maxlength="4000"/);
  assert.doesNotMatch(workerSource, /MAX_BODY_BYTES|MAX_MESSAGE_CHARS|MAX_MODEL_OUTPUT_TOKENS/);
  assert.match(copySource, /Keep ordinary responses to 500 words or fewer/);
  assert.match(copySource, /document-ready content/);
  assert.match(copySource, /do not apply the 500-word ceiling/);
});
'''
          p.write_text(s)

          p = Path('test/mobile-quality.test.mjs')
          s = p.read_text()
          s = require_replace(s, 'assert.match(mobileQuality, /eightKPhoto/);', 'assert.match(mobileQuality, /matchMedia/);', 'stale eightK mobile assertion')
          s = require_replace(s, 'assert.match(mobileQuality, /lake-valley-landscape-7680\\.webp/);', 'assert.match(mobileQuality, /data-mobile-animation/);', 'stale landscape mobile assertion')
          p.write_text(s)
          PY
          cp .github/deploy-cloudflare.original .github/workflows/deploy-cloudflare.yml
          rm .github/deploy-cloudflare.original
          rm .github/prompt-policy-trigger
          rm -f .github/prompt-policy-retry
          rm .github/workflows/prompt-policy-output.yml
      - name: Install dependencies
        run: npm ci
      - name: Run complete tests
        run: npm test
      - name: Validate Worker build
        run: npm run check
      - name: Publish clean output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove hard prompt caps and use a 500-word instruction"
          git push --force origin HEAD:feature/remove-hard-prompt-limits-output

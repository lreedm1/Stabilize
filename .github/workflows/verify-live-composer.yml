name: Verify live composer release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-live-composer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-composer:
    name: Verify live composer CSS
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the exact generated composer asset is live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          asset_version="$(
            sed -n 's/^const ASSET_VERSION = "\([^"]*\)";$/\1/p' \
              scripts/add-model-tile-and-favicon.mjs \
              | head -n 1
          )"
          if [[ -z "$asset_version" ]]; then
            echo "::error::Could not read the composer asset version."
            exit 1
          fi

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/composer-release","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" \
              "$description" \
              "$GITHUB_SERVER_URL" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          publish_status \
            pending \
            "Waiting for the exact centered composer release"

          for attempt in {1..36}; do
            cache_key="${GITHUB_SHA}-${attempt}"
            html="$(
              curl --fail --max-time 20 --silent --show-error \
                --header "Cache-Control: no-cache" \
                "https://stabilize.info/?composer-release=${cache_key}" \
                || true
            )"

            if grep -Fq "/billing.css?v=${asset_version}" <<<"$html"; then
              css="$(
                curl --fail --max-time 20 --silent --show-error \
                  --header "Cache-Control: no-cache" \
                  "https://stabilize.info/billing.css?v=${asset_version}&composer-release=${cache_key}" \
                  || true
              )"

              if grep -Fq "/* Balanced 42px composer bar */" <<<"$css" \
                && grep -Fq "padding: 10px;" <<<"$css" \
                && grep -Fq "line-height: 20px;" <<<"$css"; then
                echo "Production serves composer asset ${asset_version} with vertically centered text."
                publish_status \
                  success \
                  "Exact centered composer release is live"
                exit 0
              fi
            fi

            echo "Composer release attempt ${attempt}: ${asset_version} is not live yet."
            sleep 10
          done

          publish_status \
            failure \
            "Production did not serve the centered composer release"
          echo "::error::Production never served billing.css?v=${asset_version} with the centered textarea rules."
          exit 1

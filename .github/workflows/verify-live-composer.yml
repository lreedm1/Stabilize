name: Verify live chat page

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-live-composer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-composer:
    name: Verify live chat page and CSS
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the simplified page and exact stylesheet are live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          asset_version="$(
            sed -n 's/.*href="\/simple-chat.css?v=\([^"]*\)".*/\1/p' \
              src/simple-page.js \
              | head -n 1
          )"
          if [[ -z "$asset_version" ]]; then
            echo "::error::Could not read the chat stylesheet version."
            exit 1
          fi

          expected_css_sha="$(sha256sum public/simple-chat.css | cut -d' ' -f1)"
          css_file="$(mktemp)"
          trap 'rm -f "$css_file"' EXIT

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/composer-release","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" \
              "$description" \
              "$GITHUB_SERVER_URL" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          publish_status \
            pending \
            "Waiting for the simplified chat page and stylesheet"

          for attempt in {1..36}; do
            cache_key="${GITHUB_SHA}-${attempt}"
            html="$(
              curl --fail --max-time 20 --silent --show-error \
                --header "Cache-Control: no-cache" \
                "https://stabilize.info/?composer-release=${cache_key}" \
                || true
            )"

            if grep -Fq 'data-simple-chat="true"' <<<"$html" \
              && grep -Fq 'What’s getting in the way?' <<<"$html" \
              && grep -Fq 'id="chat-form"' <<<"$html" \
              && grep -Fq "/simple-chat.css?v=${asset_version}" <<<"$html" \
              && ! grep -Fq 'id="why-stabilize"' <<<"$html"; then
              if curl --fail --max-time 20 --silent --show-error \
                  --header "Cache-Control: no-cache" \
                  "https://stabilize.info/simple-chat.css?v=${asset_version}&composer-release=${cache_key}" \
                  --output "$css_file" \
                && [[ "$(sha256sum "$css_file" | cut -d' ' -f1)" == "$expected_css_sha" ]]; then
                echo "Production serves the simplified chat page and exact stylesheet ${asset_version}."
                publish_status \
                  success \
                  "Simplified chat page and exact stylesheet are live"
                exit 0
              fi
            fi

            echo "Chat page release attempt ${attempt}: ${asset_version} is not live yet."
            sleep 10
          done

          publish_status \
            failure \
            "Production did not serve the simplified chat page"
          echo "::error::Production never served the simplified page with its exact stylesheet."
          exit 1

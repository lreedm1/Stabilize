name: Apply Safari favicon reset v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-safari-favicon-reset-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-safari-favicon-reset-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install a new Safari icon identity
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_exact(source, old, new, label):
              if old not in source:
                  raise RuntimeError(f"Could not find {label}")
              return source.replace(old, new, 1)

          icon_b64 = re.sub(
              r"\s+",
              "",
              read("scripts/favicon-assets/favicon-32x32.png.b64"),
          )
          inline_icon = "data:image/png;base64," + icon_b64

          generator_path = "scripts/embed-favicon-fallback.mjs"
          generator = read(generator_path)
          generator = replace_exact(
              generator,
              'const ICON_RELEASE = "20260805";\nconst REFRESH_VERSION = "20260805-8";',
              'const ICON_RELEASE = "20260805";\n'
              'const VECTOR_ICON_RELEASE = "20260813";\n'
              'const REFRESH_VERSION = "20260813-safari-inline-1";\n'
              'const INLINE_ICON_DATA =\n'
              '  "data:image/png;base64," +\n'
              '  (await readFile("scripts/favicon-assets/favicon-32x32.png.b64", "utf8"))\n'
              '    .replace(/\\s+/g, "");',
              "favicon release constants",
          )

          icon_links = '''const ICON_LINKS = `    <link rel="icon" href="/stabilize-tab-${ICON_RELEASE}-16.png" type="image/png" sizes="16x16" />
              <link rel="icon" href="/stabilize-tab-${ICON_RELEASE}-32.png" type="image/png" sizes="32x32" />
              <link rel="icon" href="/stabilize-tab-${VECTOR_ICON_RELEASE}.svg" type="image/svg+xml" sizes="any" />
              <link rel="icon" href="${INLINE_ICON_DATA}" type="image/png" sizes="32x32" />
              <link rel="apple-touch-icon" href="/stabilize-app-${ICON_RELEASE}-180.png" sizes="180x180" />
              <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#173f31" />
              <link rel="manifest" href="/site.webmanifest?v=${REFRESH_VERSION}" />
              <meta name="application-name" content="STABILIZE" />
              <meta name="apple-mobile-web-app-title" content="STABILIZE" />
              <script src="/favicon-refresh.js?v=${REFRESH_VERSION}" defer></script>`;

          function requireText'''
          generator, count = re.subn(
              r'const ICON_LINKS = `[\s\S]*?`;\n\nfunction requireText',
              lambda _: icon_links,
              generator,
              count=1,
          )
          if count != 1:
              raise RuntimeError("Could not replace generated icon links")
          generator = generator.replace(
              "Hard-reset favicon identity with new tab-icon URLs, a true 16px PNG, and a valid Safari mask.",
              "Install a fresh Safari SVG identity and an inline PNG fallback.",
          )
          write(generator_path, generator)

          vector_icon = '''<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
            <title id="title">Stabilize</title>
            <desc id="description">A cream S on a rounded forest-green square.</desc>
            <rect width="64" height="64" rx="15" fill="#173f31"/>
            <path d="M45 18.5c-3.7-3.1-8.2-4.7-13.3-4.7-8.3 0-14.4 4.2-14.4 10.6 0 6.8 5.9 9.1 14.4 10.8 6.5 1.3 9 2.6 9 5.8 0 3.1-3.3 5.2-8.4 5.2-5.4 0-10-2-14.1-6.1" fill="none" stroke="#fffaf0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="48.5" cy="14.5" r="3.5" fill="#e4b85f"/>
          </svg>
          '''
          write("public/stabilize-tab-20260813.svg", vector_icon)

          refresh_script = f'''const VECTOR_ICON_ID = "stabilize-vector-tab-icon";
          const INLINE_ICON_ID = "stabilize-inline-tab-icon";
          const VECTOR_ICON_HREF = "/stabilize-tab-20260813.svg";
          const INLINE_ICON_HREF = {json.dumps(inline_icon)};

          function appendIcon({{ id, href, type, sizes }}) {{
            const icon = document.createElement("link");
            icon.id = id;
            icon.rel = "icon";
            icon.type = type;
            icon.sizes = sizes;
            icon.href = href;
            document.head.append(icon);
          }}

          function installTabIcons() {{
            for (const icon of document.querySelectorAll('link[rel~="icon"]')) {{
              icon.remove();
            }}
            appendIcon({{
              id: VECTOR_ICON_ID,
              href: VECTOR_ICON_HREF,
              type: "image/svg+xml",
              sizes: "any",
            }});
            appendIcon({{
              id: INLINE_ICON_ID,
              href: INLINE_ICON_HREF,
              type: "image/png",
              sizes: "32x32",
            }});
          }}

          installTabIcons();
          window.addEventListener("pageshow", installTabIcons);
          document.addEventListener("visibilitychange", () => {{
            if (!document.hidden) installTabIcons();
          }});
          '''
          write("public/favicon-refresh.js", refresh_script)

          manifest = {
              "name": "STABILIZE",
              "short_name": "STABILIZE",
              "description": "One clear next step for overloaded moments.",
              "start_url": "/",
              "scope": "/",
              "display": "standalone",
              "background_color": "#173f31",
              "theme_color": "#173f31",
              "icons": [
                  {
                      "src": "/stabilize-app-20260805-180.png",
                      "sizes": "180x180",
                      "type": "image/png",
                      "purpose": "any",
                  },
                  {
                      "src": "/stabilize-tab-20260813.svg",
                      "sizes": "any",
                      "type": "image/svg+xml",
                      "purpose": "any",
                  },
              ],
          }
          write("public/site.webmanifest", json.dumps(manifest, indent=2) + "\n")

          headers_path = "public/_headers"
          headers = read(headers_path)
          header_block = '''
          # cache-independent-safari-tab-icon-start
          /stabilize-tab-20260813.svg
            Content-Type: image/svg+xml; charset=utf-8
            Cache-Control: no-store, max-age=0
            Content-Disposition: inline
            Cross-Origin-Resource-Policy: same-origin
            X-Content-Type-Options: nosniff
          # cache-independent-safari-tab-icon-end
          '''
          if "# cache-independent-safari-tab-icon-start" not in headers:
              headers = headers.rstrip() + "\n" + header_block
          write(headers_path, headers)
          PY

          node scripts/embed-favicon-fallback.mjs

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_exact(source, old, new, label):
              if old not in source:
                  raise RuntimeError(f"Could not find {label}")
              return source.replace(old, new, 1)

          path = "test/model-tile-favicon.test.mjs"
          source = read(path)
          source = replace_exact(
              source,
              "    page,\n    faviconIco,",
              "    page,\n    vectorIcon,\n    faviconIco,",
              "vector icon destructuring",
          )
          source = replace_exact(
              source,
              '    read("src/page.js"),\n    readBytes("public/stabilize-tab-20260805.ico"),',
              '    read("src/page.js"),\n    read("public/stabilize-tab-20260813.svg"),\n    readBytes("public/stabilize-tab-20260805.ico"),',
              "vector icon fixture",
          )

          patterns = '''  const pageIconPatterns = [
            /<link rel="icon" href="\\/stabilize-tab-20260805-16\\.png" type="image\\/png" sizes="16x16" \\/>/,
            /<link rel="icon" href="\\/stabilize-tab-20260805-32\\.png" type="image\\/png" sizes="32x32" \\/>/,
            /<link rel="icon" href="\\/stabilize-tab-20260813\\.svg" type="image\\/svg\\+xml" sizes="any" \\/>/,
            /<link rel="icon" href="data:image\\/png;base64,/,
            /<link rel="apple-touch-icon" href="\\/stabilize-app-20260805-180\\.png" sizes="180x180" \\/>/,
            /<link rel="mask-icon" href="\\/safari-pinned-tab\\.svg" color="#173f31" \\/>/,
            /<link rel="manifest" href="\\/site\\.webmanifest\\?v=20260813-safari-inline-1" \\/>/,
            /<script src="\\/favicon-refresh\\.js\\?v=20260813-safari-inline-1" defer><\\/script>/,
          ];'''
          source, count = re.subn(
              r"  const pageIconPatterns = \[[\s\S]*?\n  \];",
              lambda _: patterns,
              source,
              count=1,
          )
          if count != 1:
              raise RuntimeError("Could not replace icon pattern assertions")

          source = replace_exact(
              source,
              "  assert.doesNotMatch(page, /data:image\\/svg\\+xml/);",
              "  assert.doesNotMatch(page, /data:image\\/svg\\+xml/);\n"
              "  assert.match(page, /data:image\\/png;base64,/);",
              "inline PNG assertion",
          )
          source = replace_exact(
              source,
              '  assert.match(safariMask, /viewBox="0 0 16 16"/);',
              '  assert.match(vectorIcon, /viewBox="0 0 64 64"/);\n'
              '  assert.match(vectorIcon, /fill="#173f31"/);\n'
              '  assert.match(vectorIcon, /stroke="#fffaf0"/);\n\n'
              '  assert.match(safariMask, /viewBox="0 0 16 16"/);',
              "vector icon assertions",
          )

          old_refresh = '''  assert.match(refreshScript, /stabilize-live-tab-icon/);
            assert.match(
              refreshScript,
              /\\/stabilize-tab-20260805-32\\.png\\?refresh=20260805-8/,
            );
            assert.match(refreshScript, /document\\.head\\.append\\(icon\\)/);'''
          new_refresh = '''  assert.match(refreshScript, /stabilize-vector-tab-icon/);
            assert.match(refreshScript, /stabilize-inline-tab-icon/);
            assert.match(refreshScript, /\\/stabilize-tab-20260813\\.svg/);
            assert.match(refreshScript, /data:image\\/png;base64,/);
            assert.match(refreshScript, /document\\.head\\.append\\(icon\\)/);'''
          source = replace_exact(
              source,
              old_refresh,
              new_refresh,
              "refresh-script assertions",
          )
          write(path, source)

          docs = '''# Favicon compatibility repair

          Stabilize now supplies Safari with a newly named SVG icon plus a PNG data URL embedded directly in every page. The inline PNG removes Cloudflare routing, response MIME, and external-asset caching from Safari's final fallback path.

          A freshly versioned same-origin script removes older icon links and reinstalls the new SVG followed by the inline PNG whenever the page is shown or becomes visible. The existing PNG, Apple touch, Safari mask, and web-app manifest fallbacks remain available.
          '''
          write("docs/favicon-repair.md", docs)
          PY

          node --test test/model-tile-favicon.test.mjs
          git diff --check

          rm -f .github/workflows/apply-safari-tab-icon-reset.yml
          rm -f .github/workflows/apply-safari-favicon-reset-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make the Safari tab icon cache-independent"
          git push origin HEAD:main

name: Verify true-HD mobile background v20

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-hd-background-v20-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-production-assets:
    name: Verify exact true-HD media release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Confirm production serves the exact HD page and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          video_asset='/scenes/mobile-forest-stream-v20-true-hd-1440.mp4'
          poster_asset='/scenes/mobile-forest-stream-v20-true-hd-1440.webp'
          client_path='/mobile-hd-background-v20.js?v=20260809-mobile-hd-background-v20-2'
          style_path='/mobile-woodland-loop.css?v=20260809-mobile-hd-background-v20-2'
          video_file="public${video_asset}"
          poster_file="public${poster_asset}"
          client_file='public/mobile-hd-background-v20.js'

          for required in "$video_file" "$poster_file" "$client_file"; do
            test -f "$required" || {
              echo "::error::Missing checked-out release file: $required"
              exit 1
            }
          done

          local_video_dimensions="$(
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=s=x:p=0 "$video_file"
          )"
          test "$local_video_dimensions" = 1440x2560

          expected_video_bytes="$(wc -c < "$video_file" | tr -d '[:space:]')"
          expected_video_sha="$(sha256sum "$video_file" | awk '{print $1}')"
          expected_poster_bytes="$(wc -c < "$poster_file" | tr -d '[:space:]')"
          expected_poster_sha="$(sha256sum "$poster_file" | awk '{print $1}')"
          expected_client_bytes="$(wc -c < "$client_file" | tr -d '[:space:]')"
          expected_client_sha="$(sha256sum "$client_file" | awk '{print $1}')"

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-hd-background","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          publish_status pending 'Waiting for exact true-HD mobile assets'

          for attempt in {1..36}; do
            key="${GITHUB_SHA}-${attempt}"
            : > "$work/page.html"
            : > "$work/video.mp4"
            : > "$work/poster.webp"
            : > "$work/client.js"
            : > "$work/video.headers"
            : > "$work/poster.headers"
            : > "$work/client.headers"

            page_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header 'Cache-Control: no-cache' \
                --output "$work/page.html" \
                --write-out '%{http_code}' \
                "https://stabilize.info/?mobile-hd-release=${key}" || true
            )"
            video_status="$(
              curl --max-time 40 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$work/video.headers" \
                --output "$work/video.mp4" \
                --write-out '%{http_code}' \
                "https://stabilize.info${video_asset}?release=${key}" || true
            )"
            poster_status="$(
              curl --max-time 30 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$work/poster.headers" \
                --output "$work/poster.webp" \
                --write-out '%{http_code}' \
                "https://stabilize.info${poster_asset}?release=${key}" || true
            )"
            client_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header 'Cache-Control: no-cache' \
                --dump-header "$work/client.headers" \
                --output "$work/client.js" \
                --write-out '%{http_code}' \
                "https://stabilize.info${client_path}&release=${key}" || true
            )"

            video_bytes="$(wc -c < "$work/video.mp4" | tr -d '[:space:]')"
            video_sha="$(sha256sum "$work/video.mp4" | awk '{print $1}')"
            poster_bytes="$(wc -c < "$work/poster.webp" | tr -d '[:space:]')"
            poster_sha="$(sha256sum "$work/poster.webp" | awk '{print $1}')"
            client_bytes="$(wc -c < "$work/client.js" | tr -d '[:space:]')"
            client_sha="$(sha256sum "$work/client.js" | awk '{print $1}')"
            video_type="$(awk -F': ' 'tolower($1) == "content-type" {gsub("\r", "", $2); print tolower($2)}' "$work/video.headers" | tail -n 1 || true)"
            poster_type="$(awk -F': ' 'tolower($1) == "content-type" {gsub("\r", "", $2); print tolower($2)}' "$work/poster.headers" | tail -n 1 || true)"

            echo "HD release attempt ${attempt}: page=${page_status:-000} video=${video_status:-000} poster=${poster_status:-000} client=${client_status:-000}; video=${video_bytes}/${expected_video_bytes}; poster=${poster_bytes}/${expected_poster_bytes}."

            if [[ "$page_status" == 200 \
              && "$video_status" == 200 \
              && "$poster_status" == 200 \
              && "$client_status" == 200 \
              && "$video_bytes" == "$expected_video_bytes" \
              && "$video_sha" == "$expected_video_sha" \
              && "$poster_bytes" == "$expected_poster_bytes" \
              && "$poster_sha" == "$expected_poster_sha" \
              && "$client_bytes" == "$expected_client_bytes" \
              && "$client_sha" == "$expected_client_sha" \
              && "$video_type" == video/mp4* \
              && "$poster_type" == image/webp* ]] \
              && grep -Fq 'id="mobile-hd-background"' "$work/page.html" \
              && grep -Fq "$video_asset" "$work/page.html" \
              && grep -Fq "$poster_asset" "$work/page.html" \
              && grep -Fq "$client_path" "$work/page.html" \
              && grep -Fq "$style_path" "$work/page.html" \
              && grep -Fq 'autoplay' "$work/page.html" \
              && grep -Fq 'playsinline' "$work/page.html" \
              && grep -Fq 'playing-true-hd' "$work/client.js" \
              && grep -Fq 'await video.play()' "$work/client.js"; then
              live_dimensions="$(
                ffprobe -v error -select_streams v:0 \
                  -show_entries stream=width,height \
                  -of csv=s=x:p=0 "$work/video.mp4"
              )"
              if [[ "$live_dimensions" == 1440x2560 ]]; then
                publish_status success 'Exact 1440x2560 mobile release is live'
                echo 'Production serves the exact true-HD mobile background release.'
                exit 0
              fi
            fi

            sleep 10
          done

          publish_status failure 'Exact true-HD mobile release is not live'
          echo '::error::Production never served the checked-out 1440x2560 mobile release.'
          exit 1

  verify-mobile-webkit-playback:
    name: Verify true-HD playback in mobile WebKit
    needs: verify-production-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Playwright WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Confirm dimensions, visibility, and advancing playback
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mobile-hd-webkit
          node --input-type=module <<'NODE'
          import { webkit } from "playwright";

          const browser = await webkit.launch({ headless: true });
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
                "Mobile/15E148 Safari/604.1",
            });
            const page = await context.newPage();
            page.on("console", (message) =>
              console.log(`browser:${message.type()}: ${message.text()}`),
            );
            page.on("pageerror", (error) =>
              console.error(`browser-pageerror: ${error.message}`),
            );

            await page.goto(
              `https://stabilize.info/?mobile-hd-webkit=${process.env.RELEASE_SHA}`,
              { waitUntil: "domcontentloaded", timeout: 60_000 },
            );
            await page.waitForSelector("#mobile-hd-background", {
              state: "attached",
              timeout: 60_000,
            });

            await page.waitForTimeout(1_000);
            const state = await page.evaluate(() =>
              document.documentElement.dataset.mobileHdBackground || "",
            );
            if (state === "autoplay-retry-pending") {
              await page.tap("body", { position: { x: 20, y: 20 } });
            }

            await page.waitForFunction(
              () => {
                const video = document.querySelector("#mobile-hd-background");
                return (
                  video instanceof HTMLVideoElement &&
                  video.videoWidth === 1440 &&
                  video.videoHeight === 2560 &&
                  video.readyState >= 2 &&
                  !video.paused &&
                  document.documentElement.dataset.mobileHdBackground ===
                    "playing-true-hd"
                );
              },
              undefined,
              { timeout: 60_000 },
            );

            const sample = () =>
              page.evaluate(() => {
                const video = document.querySelector("#mobile-hd-background");
                if (!(video instanceof HTMLVideoElement)) {
                  throw new Error("The true-HD mobile video is missing.");
                }
                const style = getComputedStyle(video);
                return {
                  width: video.videoWidth,
                  height: video.videoHeight,
                  currentTime: video.currentTime,
                  duration: video.duration,
                  readyState: video.readyState,
                  paused: video.paused,
                  ended: video.ended,
                  opacity: style.opacity,
                  display: style.display,
                  visibility: style.visibility,
                  state:
                    document.documentElement.dataset.mobileHdBackground || "",
                };
              });

            const first = await sample();
            await page.waitForTimeout(1_400);
            const second = await sample();
            console.log(JSON.stringify({ first, second }, null, 2));

            if (first.width !== 1440 || first.height !== 2560) {
              throw new Error("The decoded video is not 1440x2560.");
            }
            if (first.opacity !== "1" || second.opacity !== "1") {
              throw new Error("The HD video is not visibly opaque.");
            }
            if (first.display === "none" || first.visibility === "hidden") {
              throw new Error("The HD video is hidden.");
            }
            if (first.paused || second.paused) {
              throw new Error("The HD video is paused.");
            }
            if (second.currentTime - first.currentTime < 0.4) {
              throw new Error("The HD video timeline did not advance.");
            }

            await page.screenshot({
              path: "/tmp/mobile-hd-webkit/production-mobile-hd.png",
              fullPage: false,
            });
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hd-background-v20-webkit-evidence
          path: /tmp/mobile-hd-webkit
          if-no-files-found: warn
          retention-days: 7

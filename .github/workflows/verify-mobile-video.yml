name: Verify selected 4K mobile video

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-selected-mobile-4k-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts

      - name: Verify canonical selected-scene output
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          git diff --exit-code

          video='public/scenes/mobile-forest-stream-video-v14-retina-2160.mp4'
          test -s "$video"
          test "$(wc -c < "$video" | tr -d '[:space:]')" -eq 5006520
          test "$(dd if="$video" bs=1 skip=4 count=4 status=none)" = 'ftyp'
          grep -aFq 'moov' "$video"
          grep -aFq 'mdat' "$video"
          grep -aFq 'avc1' "$video"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")" = '2160x3840'

          route='/media/mobile-forest-stream-video-v14-retina-2160.mp4'
          grep -Fq 'id="mobile-background-video"' src/page.js
          grep -Fq "$route" src/page.js
          grep -Fq 'mobile-quality.js?v=20260809-selected-mobile-4k-video-v22-1' src/page.js
          grep -Fq 'mobile-woodland-loop.css?v=20260809-selected-mobile-4k-video-v22-1' src/page.js
          grep -Fq "$route" public/mobile-quality.js
          grep -Fq '4k-2160x3840' public/mobile-quality.js
          grep -Fq 'video.autoplay = true' public/mobile-quality.js
          grep -Fq 'video.muted = true' public/mobile-quality.js
          grep -Fq 'video.defaultMuted = true' public/mobile-quality.js
          grep -Fq 'video.playsInline = true' public/mobile-quality.js
          grep -Fq 'video.play()' public/mobile-quality.js
          grep -Fq 'MOBILE_VIDEO_BYTES = 5_006_520' src/mobile-video-response.js
          grep -Fq "$route" src/mobile-video-response.js
          grep -Fq 'Accept-Ranges' src/mobile-video-response.js
          grep -Fq 'Content-Range' src/mobile-video-response.js
          ! grep -Fq 'mobile-forest-stream-v20-true-hd-1440' src/page.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-payload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Wait for the exact 2160x3840 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          route='/media/mobile-forest-stream-video-v14-retina-2160.mp4'
          expected_file='public/scenes/mobile-forest-stream-video-v14-retina-2160.mp4'
          expected_bytes="$(wc -c < "$expected_file" | tr -d '[:space:]')"
          expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"
          expected_etag="\"${expected_sha}\""
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-video-background","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          header_value() {
            local file="$1"
            local name="$2"
            awk -F': ' -v target="$name" '
              tolower($1) == tolower(target) {
                gsub("\r", "", $2)
                print $2
              }
            ' "$file" | tail -n 1
          }

          publish_status pending 'Waiting for the selected 4K forest video'

          for attempt in {1..36}; do
            key="${GITHUB_SHA}-${attempt}"
            page_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/page.headers" \
                --output "$tmpdir/page.html" \
                --write-out '%{http_code}' \
                "https://stabilize.info/?selected-4k=${key}" || true
            )"
            script_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header 'Cache-Control: no-cache' \
                --output "$tmpdir/mobile-quality.js" \
                --write-out '%{http_code}' \
                "https://stabilize.info/mobile-quality.js?selected-4k=${key}" || true
            )"
            video_status="$(
              curl --max-time 90 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/video.headers" \
                --output "$tmpdir/video.mp4" \
                --write-out '%{http_code}' \
                "https://stabilize.info${route}?selected-4k=${key}" || true
            )"
            range_status="$(
              curl --max-time 40 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --header 'Range: bytes=0-1023' \
                --dump-header "$tmpdir/range.headers" \
                --output "$tmpdir/range.bin" \
                --write-out '%{http_code}' \
                "https://stabilize.info${route}?range=${key}" || true
            )"

            live_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
            live_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"
            live_type="$(header_value "$tmpdir/video.headers" content-type | tr '[:upper:]' '[:lower:]')"
            live_etag="$(header_value "$tmpdir/video.headers" etag)"
            live_cache="$(header_value "$tmpdir/video.headers" cache-control | tr '[:upper:]' '[:lower:]')"
            live_accept_ranges="$(header_value "$tmpdir/video.headers" accept-ranges | tr '[:upper:]' '[:lower:]')"
            range_bytes="$(wc -c < "$tmpdir/range.bin" | tr -d '[:space:]')"
            range_content="$(header_value "$tmpdir/range.headers" content-range | tr '[:upper:]' '[:lower:]')"
            range_etag="$(header_value "$tmpdir/range.headers" etag)"

            echo "Selected 4K attempt ${attempt}: page=${page_status:-000} script=${script_status:-000} video=${video_status:-000} range=${range_status:-000}; bytes=${live_bytes}/${expected_bytes}; sha=${live_sha:0:12}."

            dimensions='missing'
            if [[ "$video_status" == 200 && "$live_bytes" -gt 0 ]]; then
              dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$tmpdir/video.mp4" 2>/dev/null || true)"
            fi

            if [[ "$page_status" == 200 \
              && "$script_status" == 200 \
              && "$video_status" == 200 \
              && "$range_status" == 206 \
              && "$range_bytes" == 1024 \
              && "$range_content" == "bytes 0-1023/${expected_bytes}" \
              && "$live_bytes" == "$expected_bytes" \
              && "$live_sha" == "$expected_sha" \
              && "$dimensions" == '2160x3840' \
              && "$live_type" == video/mp4* \
              && "$live_etag" == "$expected_etag" \
              && "$range_etag" == "$expected_etag" \
              && "$live_cache" == *no-store* \
              && "$live_accept_ranges" == 'bytes' ]] \
              && grep -Fq 'id="mobile-background-video"' "$tmpdir/page.html" \
              && grep -Fq "$route" "$tmpdir/page.html" \
              && grep -Fq 'mobile-quality.js?v=20260809-selected-mobile-4k-video-v22-1' "$tmpdir/page.html" \
              && grep -Fq "$route" "$tmpdir/mobile-quality.js" \
              && grep -Fq '4k-2160x3840' "$tmpdir/mobile-quality.js" \
              && ! grep -Fq 'mobile-forest-stream-v20-true-hd-1440' "$tmpdir/page.html" \
              && grep -Fqi "media-src 'self'" "$tmpdir/page.headers"; then
              publish_status success 'Exact 2160x3840 selected forest video is live'
              echo 'Production serves the correct scene through the exact 4K range route.'
              exit 0
            fi

            sleep 10
          done

          publish_status failure 'Selected 4K forest video is not live'
          echo '::error::Production never served the exact selected 2160x3840 release.'
          exit 1

  verify-mobile-webkit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install mobile WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify visible 4K playback without a tap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/selected-mobile-4k
          node --input-type=module <<'NODE'
          import { webkit } from "playwright";
          import { writeFile } from "node:fs/promises";

          const browser = await webkit.launch({ headless: true });
          const evidence = {};
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
                "Mobile/15E148 Safari/604.1",
            });
            const page = await context.newPage();
            const errors = [];
            page.on("pageerror", (error) => errors.push(error.message));
            page.on("requestfailed", (request) =>
              errors.push(`${request.url()}: ${request.failure()?.errorText || "failed"}`),
            );

            await page.goto(
              `https://stabilize.info/?selected-4k-webkit=${Date.now()}`,
              { waitUntil: "domcontentloaded", timeout: 60_000 },
            );
            await page.waitForSelector("#mobile-background-video", {
              state: "attached",
              timeout: 60_000,
            });
            await page.waitForFunction(
              () => {
                const video = document.querySelector("#mobile-background-video");
                return (
                  video instanceof HTMLVideoElement &&
                  video.videoWidth === 2160 &&
                  video.videoHeight === 3840 &&
                  video.readyState >= 2 &&
                  !video.paused &&
                  document.documentElement.dataset.mobileBackground ===
                    "video-playing"
                );
              },
              undefined,
              { timeout: 60_000 },
            );

            const sample = () =>
              page.evaluate(() => {
                const video = document.querySelector("#mobile-background-video");
                if (!(video instanceof HTMLVideoElement)) {
                  throw new Error("The selected 4K video is missing.");
                }
                const style = getComputedStyle(video);
                return {
                  width: video.videoWidth,
                  height: video.videoHeight,
                  currentTime: video.currentTime,
                  duration: video.duration,
                  readyState: video.readyState,
                  paused: video.paused,
                  opacity: style.opacity,
                  display: style.display,
                  visibility: style.visibility,
                  state:
                    document.documentElement.dataset.mobileBackground || "",
                  quality:
                    document.documentElement.dataset.mobileVideoQuality || "",
                  source: video.currentSrc,
                };
              });

            const first = await sample();
            await page.waitForTimeout(1_400);
            const second = await sample();
            evidence.first = first;
            evidence.second = second;
            evidence.errors = errors;

            if (first.width !== 2160 || first.height !== 3840) {
              throw new Error("The browser did not decode the 2160x3840 source.");
            }
            if (first.opacity !== "1" || second.opacity !== "1") {
              throw new Error("The 4K video is not visibly opaque.");
            }
            if (first.display === "none" || first.visibility === "hidden") {
              throw new Error("The 4K video is hidden.");
            }
            if (first.paused || second.paused) {
              throw new Error("The 4K video is paused.");
            }
            if (second.currentTime - first.currentTime < 0.4) {
              throw new Error("The 4K video timeline did not advance.");
            }
            if (second.quality !== "4k-2160x3840") {
              throw new Error("The page did not report the selected 4K quality.");
            }

            await page.screenshot({
              path: "/tmp/selected-mobile-4k/production.png",
              fullPage: false,
            });
          } finally {
            await writeFile(
              "/tmp/selected-mobile-4k/evidence.json",
              JSON.stringify(evidence, null, 2),
            );
            await browser.close();
          }
          NODE

      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-mobile-4k-webkit-evidence
          path: /tmp/selected-mobile-4k
          if-no-files-found: warn
          retention-days: 7

name: Verify mobile background v30 video

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-background-v30-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts

      - name: Verify canonical v30 media and controller output
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          git diff --exit-code

          version='20260813-mobile-background-v30-1'
          video='public/scenes/mobile-forest-stream-video-v24-native-1080.mp4'
          poster='public/scenes/mobile-forest-stream-v24-native-1080.webp'
          atlas='public/scenes/mobile-forest-stream-full-atlas-v29-1080.webp'
          route='/media/mobile-forest-stream-video-v24-native-1080.mp4'

          test -s "$video"
          test -s "$poster"
          test -s "$atlas"
          test "$(wc -c < "$video" | tr -d '[:space:]')" -eq 5766867
          test "$(wc -c < "$poster" | tr -d '[:space:]')" -eq 701820
          test "$(wc -c < "$atlas" | tr -d '[:space:]')" -eq 1579616
          test "$(sha256sum "$video" | awk '{print $1}')" = \
            '160e341439d5f962c7c0cacb81da37fec741db3fca4d52df71be7f47732f6a35'
          test "$(sha256sum "$poster" | awk '{print $1}')" = \
            'a7287cbe78cd6912522ae1cf9295bc449fc53ca8cdd30bea402bc13581e152e0'
          test "$(sha256sum "$atlas" | awk '{print $1}')" = \
            '7b52607dc293f753c6082e8cce9fef07fcdbb6acc743c3562a8f8af4119b3de0'
          test "$(dd if="$video" bs=1 skip=4 count=4 status=none)" = 'ftyp'
          grep -aFq 'moov' "$video"
          grep -aFq 'mdat' "$video"
          grep -aFq 'avc1' "$video"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")" = 2160x3840
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$poster")" = 2160x3840
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$atlas")" = 4320x3840
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$video")" -gt 1500000

          test "$(grep -o 'id="mobile-background-video"' src/page.js | wc -l | tr -d '[:space:]')" -eq 1
          test "$(grep -o 'id="mobile-background-v30"' src/page.js | wc -l | tr -d '[:space:]')" -eq 1
          grep -Fq "$route?v=${version}" src/page.js
          grep -Fq "/mobile-background-v30.js?v=${version}" src/page.js
          grep -Fq "/mobile-background-v30.css?v=${version}" src/page.js
          grep -Fq "/scenes/mobile-forest-stream-v24-native-1080.webp?v=${version}" src/page.js
          grep -Fq "/scenes/mobile-forest-stream-full-atlas-v29-1080.webp?v=${version}" src/page.js
          ! grep -Fq '/mobile-quality.js' src/page.js
          ! grep -Fq '/mobile-motion-canvas.js' src/page.js
          ! grep -Fq '/mobile-full-motion-v29.js' src/page.js
          ! grep -Fq '/mobile-autoplay-v27.js' src/page.js

          grep -Fq 'motionDelta = interpolatedFrame - referenceFrame' public/mobile-background-v30.js
          grep -Fq 'sharpPoster + motionDelta * uMotionGain' public/mobile-background-v30.js
          grep -Fq 'requestAnimationFrame(drawFallback)' public/mobile-background-v30.js
          grep -Fq 'requestVideoFrameCallback' public/mobile-background-v30.js
          grep -Fq 'const result = video.play();' public/mobile-background-v30.js
          grep -Fq 'native-video-2160x3840-24fps' public/mobile-background-v30.js
          grep -Fq 'opacity: 0.001 !important' public/mobile-background-v30.css
          grep -Fq -- '--mobile-background-v30-fade: 260ms' public/mobile-background-v30.css

          grep -Fq 'MOBILE_VIDEO_BYTES = 5_766_867' src/mobile-video-response.js
          grep -Fq "$route" src/mobile-video-response.js
          grep -Fq 'const assetByteCache = new WeakMap();' src/mobile-video-response.js
          grep -Fq 'Accept-Ranges' src/mobile-video-response.js
          grep -Fq 'Content-Range' src/mobile-video-response.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-payload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Wait for and verify the exact v30 production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='20260813-mobile-background-v30-1'
          route='/media/mobile-forest-stream-video-v24-native-1080.mp4'
          poster_route='/scenes/mobile-forest-stream-v24-native-1080.webp'
          atlas_route='/scenes/mobile-forest-stream-full-atlas-v29-1080.webp'
          expected_video='public/scenes/mobile-forest-stream-video-v24-native-1080.mp4'
          expected_poster='public/scenes/mobile-forest-stream-v24-native-1080.webp'
          expected_atlas='public/scenes/mobile-forest-stream-full-atlas-v29-1080.webp'
          expected_video_bytes="$(wc -c < "$expected_video" | tr -d '[:space:]')"
          expected_video_sha="$(sha256sum "$expected_video" | awk '{print $1}')"
          expected_video_etag="\"${expected_video_sha}\""
          expected_poster_bytes="$(wc -c < "$expected_poster" | tr -d '[:space:]')"
          expected_poster_sha="$(sha256sum "$expected_poster" | awk '{print $1}')"
          expected_atlas_bytes="$(wc -c < "$expected_atlas" | tr -d '[:space:]')"
          expected_atlas_sha="$(sha256sum "$expected_atlas" | awk '{print $1}')"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-video-background","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          header_value() {
            local file="$1"
            local name="$2"
            awk -F': ' -v target="$name" '
              tolower($1) == tolower(target) {
                gsub("\r", "", $2)
                print $2
              }
            ' "$file" | tail -n 1
          }

          publish_status pending 'Waiting for mobile background v30'

          ready=false
          for attempt in {1..36}; do
            key="${GITHUB_SHA}-${attempt}"
            page_status="$(curl --max-time 25 --silent --show-error --compressed -H 'Cache-Control: no-cache' -D "$tmpdir/page.headers" -o "$tmpdir/page.html" -w '%{http_code}' "https://stabilize.info/?mobile-v30=${key}" || true)"
            client_status="$(curl --max-time 25 --silent --show-error --compressed -H 'Cache-Control: no-cache' -o "$tmpdir/client.js" -w '%{http_code}' "https://stabilize.info/mobile-background-v30.js?v=${version}&release=${key}" || true)"
            style_status="$(curl --max-time 25 --silent --show-error --compressed -H 'Cache-Control: no-cache' -o "$tmpdir/styles.css" -w '%{http_code}' "https://stabilize.info/mobile-background-v30.css?v=${version}&release=${key}" || true)"
            poster_status="$(curl --max-time 40 --silent --show-error -H 'Cache-Control: no-cache' -o "$tmpdir/poster.webp" -w '%{http_code}' "https://stabilize.info${poster_route}?v=${version}&release=${key}" || true)"
            atlas_status="$(curl --max-time 40 --silent --show-error -H 'Cache-Control: no-cache' -o "$tmpdir/atlas.webp" -w '%{http_code}' "https://stabilize.info${atlas_route}?v=${version}&release=${key}" || true)"

            poster_bytes="$(wc -c < "$tmpdir/poster.webp" | tr -d '[:space:]')"
            poster_sha="$(sha256sum "$tmpdir/poster.webp" | awk '{print $1}')"
            atlas_bytes="$(wc -c < "$tmpdir/atlas.webp" | tr -d '[:space:]')"
            atlas_sha="$(sha256sum "$tmpdir/atlas.webp" | awk '{print $1}')"

            echo "v30 attempt ${attempt}: page=${page_status:-000} client=${client_status:-000} style=${style_status:-000} poster=${poster_status:-000} atlas=${atlas_status:-000}"

            if [[ "$page_status" == 200 \
              && "$client_status" == 200 \
              && "$style_status" == 200 \
              && "$poster_status" == 200 \
              && "$atlas_status" == 200 \
              && "$poster_bytes" == "$expected_poster_bytes" \
              && "$poster_sha" == "$expected_poster_sha" \
              && "$atlas_bytes" == "$expected_atlas_bytes" \
              && "$atlas_sha" == "$expected_atlas_sha" ]] \
              && grep -Fq "$route?v=${version}" "$tmpdir/page.html" \
              && grep -Fq "/mobile-background-v30.js?v=${version}" "$tmpdir/page.html" \
              && grep -Fq "/mobile-background-v30.css?v=${version}" "$tmpdir/page.html" \
              && ! grep -Fq '/mobile-quality.js' "$tmpdir/page.html" \
              && ! grep -Fq '/mobile-motion-canvas.js' "$tmpdir/page.html" \
              && grep -Fq 'motionDelta = interpolatedFrame - referenceFrame' "$tmpdir/client.js" \
              && grep -Fq 'requestVideoFrameCallback' "$tmpdir/client.js" \
              && grep -Fq 'data-mobile-background-v30="video"' "$tmpdir/styles.css" \
              && grep -Fqi "media-src 'self'" "$tmpdir/page.headers"; then
              ready=true
              break
            fi
            sleep 10
          done

          if [[ "$ready" != true ]]; then
            publish_status failure 'Mobile background v30 is not live'
            echo '::error::Production did not expose the exact v30 page and fallback assets.'
            exit 1
          fi

          key="${GITHUB_SHA}-exact"
          video_status="$(curl --max-time 120 --silent --show-error -H 'Cache-Control: no-cache' -D "$tmpdir/video.headers" -o "$tmpdir/video.mp4" -w '%{http_code}' "https://stabilize.info${route}?v=${version}&release=${key}" || true)"
          range_status="$(curl --max-time 60 --silent --show-error -H 'Cache-Control: no-cache' -H 'Range: bytes=0-1023' -D "$tmpdir/range.headers" -o "$tmpdir/range.bin" -w '%{http_code}' "https://stabilize.info${route}?v=${version}&range=${key}" || true)"

          video_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
          video_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"
          video_type="$(header_value "$tmpdir/video.headers" content-type | tr '[:upper:]' '[:lower:]')"
          video_etag="$(header_value "$tmpdir/video.headers" etag)"
          video_cache="$(header_value "$tmpdir/video.headers" cache-control | tr '[:upper:]' '[:lower:]')"
          accept_ranges="$(header_value "$tmpdir/video.headers" accept-ranges | tr '[:upper:]' '[:lower:]')"
          range_bytes="$(wc -c < "$tmpdir/range.bin" | tr -d '[:space:]')"
          range_content="$(header_value "$tmpdir/range.headers" content-range | tr '[:upper:]' '[:lower:]')"
          range_etag="$(header_value "$tmpdir/range.headers" etag)"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$tmpdir/video.mp4" 2>/dev/null || true)"
          bitrate="$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$tmpdir/video.mp4" 2>/dev/null || echo 0)"

          if [[ "$video_status" != 200 \
            || "$range_status" != 206 \
            || "$video_bytes" != "$expected_video_bytes" \
            || "$video_sha" != "$expected_video_sha" \
            || "$video_type" != video/mp4* \
            || "$video_etag" != "$expected_video_etag" \
            || "$range_etag" != "$expected_video_etag" \
            || "$video_cache" != *no-store* \
            || "$accept_ranges" != bytes \
            || "$range_bytes" != 1024 \
            || "$range_content" != "bytes 0-1023/${expected_video_bytes}" \
            || "$dimensions" != 2160x3840 \
            || "$bitrate" -le 1500000 ]]; then
            publish_status failure 'Exact v30 native video delivery failed'
            echo "::error::video=${video_status}, range=${range_status}, bytes=${video_bytes}, sha=${video_sha}, dimensions=${dimensions}, bitrate=${bitrate}"
            exit 1
          fi

          publish_status success 'Exact v30 2160x3840 video and fallback are live'
          echo 'Production serves the exact v30 hybrid mobile release.'

  verify-mobile-webkit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install mobile WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify the fallback hands off to the native video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mobile-background-v30
          node --input-type=module <<'NODE'
          import { webkit } from "playwright";
          import { writeFile } from "node:fs/promises";

          const browser = await webkit.launch({ headless: true });
          const evidence = { requiredTap: false, errors: [] };
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
                "Mobile/15E148 Safari/604.1",
            });
            const page = await context.newPage();
            page.on("pageerror", (error) => evidence.errors.push(error.message));
            page.on("requestfailed", (request) =>
              evidence.errors.push(
                `${request.url()}: ${request.failure()?.errorText || "failed"}`,
              ),
            );

            await page.goto(
              `https://stabilize.info/?mobile-background-v30-webkit=${Date.now()}`,
              { waitUntil: "domcontentloaded", timeout: 60_000 },
            );
            await page.waitForSelector("#mobile-background-video", {
              state: "attached",
              timeout: 60_000,
            });

            const isNativeVideoVisible = () =>
              page.evaluate(() => {
                const video = document.querySelector("#mobile-background-video");
                return (
                  video instanceof HTMLVideoElement &&
                  video.videoWidth === 2160 &&
                  video.videoHeight === 3840 &&
                  video.readyState >= 2 &&
                  !video.paused &&
                  document.documentElement.dataset.mobileBackgroundV30 === "video"
                );
              });

            const deadline = Date.now() + 20_000;
            while (Date.now() < deadline && !(await isNativeVideoVisible())) {
              await page.waitForTimeout(500);
            }
            if (!(await isNativeVideoVisible())) {
              evidence.requiredTap = true;
              await page.tap("body", { position: { x: 20, y: 20 } });
            }

            await page.waitForFunction(
              () => {
                const video = document.querySelector("#mobile-background-video");
                return (
                  video instanceof HTMLVideoElement &&
                  video.videoWidth === 2160 &&
                  video.videoHeight === 3840 &&
                  video.readyState >= 2 &&
                  !video.paused &&
                  document.documentElement.dataset.mobileBackgroundV30 === "video"
                );
              },
              undefined,
              { timeout: 60_000 },
            );

            const sample = () =>
              page.evaluate(() => {
                const video = document.querySelector("#mobile-background-video");
                const canvas = document.querySelector("#mobile-background-v30");
                if (!(video instanceof HTMLVideoElement)) throw new Error("v30 video missing");
                if (!(canvas instanceof HTMLCanvasElement)) throw new Error("v30 canvas missing");
                const videoStyle = getComputedStyle(video);
                const canvasStyle = getComputedStyle(canvas);
                return {
                  width: video.videoWidth,
                  height: video.videoHeight,
                  currentTime: video.currentTime,
                  readyState: video.readyState,
                  paused: video.paused,
                  videoOpacity: videoStyle.opacity,
                  videoDisplay: videoStyle.display,
                  videoVisibility: videoStyle.visibility,
                  canvasOpacity: canvasStyle.opacity,
                  state: document.documentElement.dataset.mobileBackgroundV30 || "",
                  quality: document.documentElement.dataset.mobileBackgroundV30Quality || "",
                  source: video.currentSrc,
                  inputPresent: Boolean(document.querySelector("#message-input")),
                };
              });

            evidence.first = await sample();
            await page.waitForTimeout(1_400);
            evidence.second = await sample();

            const { first, second } = evidence;
            if (first.width !== 2160 || first.height !== 3840) {
              throw new Error("WebKit did not decode the 2160x3840 source.");
            }
            if (first.videoOpacity !== "1" || second.videoOpacity !== "1") {
              throw new Error("The native video did not complete its crossfade.");
            }
            if (first.videoDisplay === "none" || first.videoVisibility === "hidden") {
              throw new Error("The native video is hidden.");
            }
            if (first.canvasOpacity !== "0" || second.canvasOpacity !== "0") {
              throw new Error("The fallback canvas remained above the native video.");
            }
            if (first.paused || second.paused) {
              throw new Error("The native video is paused.");
            }
            if (second.currentTime - first.currentTime < 0.4) {
              throw new Error("The native video timeline did not advance.");
            }
            if (second.quality !== "native-video-2160x3840-24fps") {
              throw new Error(`Unexpected quality state: ${second.quality}`);
            }
            if (!second.source.includes("mobile-forest-stream-video-v24-native-1080.mp4")) {
              throw new Error("WebKit decoded the wrong mobile source.");
            }
            if (!second.inputPresent) {
              throw new Error("The application UI disappeared during the handoff.");
            }
            if (evidence.errors.length) {
              throw new Error(`Page errors: ${JSON.stringify(evidence.errors)}`);
            }

            await page.screenshot({
              path: "/tmp/mobile-background-v30/production.png",
              fullPage: false,
            });
          } finally {
            await writeFile(
              "/tmp/mobile-background-v30/evidence.json",
              JSON.stringify(evidence, null, 2),
            );
            await browser.close();
          }
          NODE

      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-background-v30-webkit-evidence
          path: /tmp/mobile-background-v30
          if-no-files-found: warn
          retention-days: 7

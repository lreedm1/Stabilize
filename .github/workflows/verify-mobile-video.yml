name: Verify mobile video background

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize and validate the direct mobile MP4
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-mobile-forest-stream.mjs
          video='public/scenes/mobile-forest-stream-video-v4-1080.mp4'
          test -s "$video"
          test "$(wc -c < "$video")" -gt 1000000
          test "$(dd if="$video" bs=1 skip=4 count=4 status=none)" = 'ftyp'
          grep -aFq 'moov' "$video"
          grep -aFq 'mdat' "$video"
          grep -aFq 'avc1' "$video"
          file "$video" | grep -Fq 'ISO Media, MP4'

      - name: Validate the Safari playback path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/scenes/mobile-forest-stream-video-v4-1080.mp4' public/mobile-quality.js
          grep -Fq 'video.src = VIDEO_ASSET' public/mobile-quality.js
          grep -Fq 'video.autoplay = true' public/mobile-quality.js
          grep -Fq 'video.muted = true' public/mobile-quality.js
          grep -Fq 'video.defaultMuted = true' public/mobile-quality.js
          grep -Fq 'video.loop = true' public/mobile-quality.js
          grep -Fq 'video.playsInline = true' public/mobile-quality.js
          grep -Fq 'video.play()' public/mobile-quality.js
          grep -Fq 'resumeAfterGesture' public/mobile-quality.js
          ! grep -Fq 'URL.createObjectURL' public/mobile-quality.js
          ! grep -Fq 'new Blob' public/mobile-quality.js
          ! grep -Fq 'atob(' public/mobile-quality.js
          grep -Fq '/scenes/mobile-forest-stream-video-v4-1080.mp4' public/_headers
          grep -Fq 'Content-Type: video/mp4' public/_headers

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-payload
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the exact direct video release to reach production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/materialize-mobile-forest-stream.mjs
          expected_file='public/scenes/mobile-forest-stream-video-v4-1080.mp4'
          expected_bytes="$(wc -c < "$expected_file" | tr -d '[:space:]')"
          expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-video-background","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" \
              "$description" \
              "$GITHUB_SERVER_URL" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          publish_status pending 'Waiting for the direct mobile video release'

          for attempt in {1..36}; do
            key="${GITHUB_SHA}-${attempt}"
            script_status="$(
              curl --max-time 20 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$tmpdir/mobile-quality.js" \
                --write-out '%{http_code}' \
                "https://stabilize.info/mobile-quality.js?release=${key}" \
                || true
            )"
            home_status="$(
              curl --max-time 20 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/home.headers" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://stabilize.info/?mobile-video-release=${key}" \
                || true
            )"
            video_status="$(
              curl --max-time 90 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/video.headers" \
                --output "$tmpdir/video.mp4" \
                --write-out '%{http_code}' \
                "https://stabilize.info/scenes/mobile-forest-stream-video-v4-1080.mp4?release=${key}" \
                || true
            )"
            range_status="$(
              curl --max-time 30 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --header 'Range: bytes=0-1023' \
                --dump-header "$tmpdir/range.headers" \
                --output "$tmpdir/range.bin" \
                --write-out '%{http_code}' \
                "https://stabilize.info/scenes/mobile-forest-stream-video-v4-1080.mp4?range=${key}" \
                || true
            )"

            live_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
            live_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"
            live_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\r", "", $2); print tolower($2) }' "$tmpdir/video.headers" | tail -n 1)"
            range_bytes="$(wc -c < "$tmpdir/range.bin" | tr -d '[:space:]')"

            echo "Mobile video attempt ${attempt}: script=${script_status:-000} home=${home_status:-000} video=${video_status:-000} range=${range_status:-000}; bytes=${live_bytes}/${expected_bytes}; type=${live_type:-missing}; sha=${live_sha:0:12}."

            if [[ "$script_status" == 200 \
              && "$home_status" == 200 \
              && "$video_status" == 200 \
              && "$range_status" == 206 \
              && "$range_bytes" == 1024 \
              && "$live_bytes" == "$expected_bytes" \
              && "$live_sha" == "$expected_sha" \
              && "$live_type" == video/mp4* ]] \
              && grep -Fq '/scenes/mobile-forest-stream-video-v4-1080.mp4' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.src = VIDEO_ASSET' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.play()' "$tmpdir/mobile-quality.js" \
              && ! grep -Fq 'URL.createObjectURL' "$tmpdir/mobile-quality.js" \
              && grep -Fqi "media-src 'self'" "$tmpdir/home.headers"; then
              publish_status success 'Direct mobile forest video is live'
              echo 'The direct mobile forest video, Safari loader, MIME type, and byte-range response are live.'
              exit 0
            fi

            sleep 10
          done

          publish_status failure 'Direct mobile forest video is not live'
          echo '::error::Production never served the exact direct MP4 and Safari playback path together.'
          exit 1

name: Verify mobile video background

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize and validate the direct mobile MP4
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-mobile-forest-stream.mjs
          video='public/scenes/mobile-forest-stream-video-v4-1080.mp4'
          test -s "$video"
          test "$(wc -c < "$video")" -eq 113613
          test "$(dd if="$video" bs=1 skip=4 count=4 status=none)" = 'ftyp'
          grep -aFq 'moov' "$video"
          grep -aFq 'mdat' "$video"
          grep -aFq 'avc1' "$video"
          file "$video" | grep -Fq 'ISO Media, MP4'

      - name: Validate the Safari playback and range path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/media/mobile-forest-stream-video-v4-1080.mp4' public/mobile-quality.js
          grep -Fq 'video.src = VIDEO_ASSET' public/mobile-quality.js
          grep -Fq 'video.autoplay = true' public/mobile-quality.js
          grep -Fq 'video.muted = true' public/mobile-quality.js
          grep -Fq 'video.defaultMuted = true' public/mobile-quality.js
          grep -Fq 'video.loop = true' public/mobile-quality.js
          grep -Fq 'video.playsInline = true' public/mobile-quality.js
          grep -Fq 'video.play()' public/mobile-quality.js
          grep -Fq 'resumeAfterGesture' public/mobile-quality.js
          ! grep -Fq 'URL.createObjectURL' public/mobile-quality.js
          ! grep -Fq 'new Blob' public/mobile-quality.js
          ! grep -Fq 'atob(' public/mobile-quality.js
          grep -Fq 'url.pathname === MOBILE_VIDEO_ROUTE' src/domain-router.js
          grep -Fq 'await serveMobileVideo(request, canonicalEnv)' src/domain-router.js
          grep -Fq 'Cloudflare-CDN-Cache-Control' src/mobile-video-response.js
          grep -Fq 'Accept-Ranges' src/mobile-video-response.js
          grep -Fq 'Content-Range' src/mobile-video-response.js
          grep -Fq 'MOBILE_VIDEO_ETAG' src/mobile-video-response.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-payload
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the exact Safari-safe video release to reach production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/materialize-mobile-forest-stream.mjs
          expected_file='public/scenes/mobile-forest-stream-video-v4-1080.mp4'
          expected_bytes="$(wc -c < "$expected_file" | tr -d '[:space:]')"
          expected_sha="$(sha256sum "$expected_file" | awk '{print $1}')"
          expected_etag="\"${expected_sha}\""
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-video-background","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" \
              "$description" \
              "$GITHUB_SERVER_URL" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          header_value() {
            local file="$1"
            local name="$2"
            awk -F': ' -v target="$name" '
              tolower($1) == tolower(target) {
                gsub("\r", "", $2)
                print $2
              }
            ' "$file" | tail -n 1
          }

          publish_status pending 'Waiting for Safari-safe mobile video delivery'

          for attempt in {1..36}; do
            key="${GITHUB_SHA}-${attempt}"
            script_status="$(
              curl --max-time 20 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$tmpdir/mobile-quality.js" \
                --write-out '%{http_code}' \
                "https://stabilize.info/mobile-quality.js?release=${key}" \
                || true
            )"
            home_status="$(
              curl --max-time 20 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/home.headers" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://stabilize.info/?mobile-video-release=${key}" \
                || true
            )"
            video_status="$(
              curl --max-time 90 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/video.headers" \
                --output "$tmpdir/video.mp4" \
                --write-out '%{http_code}' \
                "https://stabilize.info/media/mobile-forest-stream-video-v4-1080.mp4?release=${key}" \
                || true
            )"
            range_status="$(
              curl --max-time 30 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --header 'Range: bytes=0-1023' \
                --dump-header "$tmpdir/range.headers" \
                --output "$tmpdir/range.bin" \
                --write-out '%{http_code}' \
                "https://stabilize.info/media/mobile-forest-stream-video-v4-1080.mp4?range=${key}" \
                || true
            )"

            live_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
            live_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"
            live_type="$(header_value "$tmpdir/video.headers" content-type | tr '[:upper:]' '[:lower:]')"
            live_etag="$(header_value "$tmpdir/video.headers" etag)"
            live_cache="$(header_value "$tmpdir/video.headers" cache-control | tr '[:upper:]' '[:lower:]')"
            live_cdn_cache="$(header_value "$tmpdir/video.headers" cdn-cache-control | tr '[:upper:]' '[:lower:]')"
            live_cf_cdn_cache="$(header_value "$tmpdir/video.headers" cloudflare-cdn-cache-control | tr '[:upper:]' '[:lower:]')"
            live_accept_ranges="$(header_value "$tmpdir/video.headers" accept-ranges | tr '[:upper:]' '[:lower:]')"
            range_bytes="$(wc -c < "$tmpdir/range.bin" | tr -d '[:space:]')"
            range_content="$(header_value "$tmpdir/range.headers" content-range | tr '[:upper:]' '[:lower:]')"
            range_etag="$(header_value "$tmpdir/range.headers" etag)"
            range_cache="$(header_value "$tmpdir/range.headers" cache-control | tr '[:upper:]' '[:lower:]')"

            echo "Mobile video attempt ${attempt}: script=${script_status:-000} home=${home_status:-000} video=${video_status:-000} range=${range_status:-000}; bytes=${live_bytes}/${expected_bytes}; type=${live_type:-missing}; etag=${live_etag:-missing}; cache=${live_cache:-missing}; sha=${live_sha:0:12}."

            if [[ "$script_status" == 200 \
              && "$home_status" == 200 \
              && "$video_status" == 200 \
              && "$range_status" == 206 \
              && "$range_bytes" == 1024 \
              && "$range_content" == "bytes 0-1023/${expected_bytes}" \
              && "$live_bytes" == "$expected_bytes" \
              && "$live_sha" == "$expected_sha" \
              && "$live_type" == video/mp4* \
              && "$live_etag" == "$expected_etag" \
              && "$range_etag" == "$expected_etag" \
              && "$live_etag" != W/* \
              && "$live_cache" == *no-store* \
              && "$range_cache" == *no-store* \
              && "$live_cdn_cache" == "no-store" \
              && "$live_cf_cdn_cache" == "no-store" \
              && "$live_accept_ranges" == "bytes" ]] \
              && grep -Fq '/media/mobile-forest-stream-video-v4-1080.mp4' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.src = VIDEO_ASSET' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.play()' "$tmpdir/mobile-quality.js" \
              && ! grep -Fq 'URL.createObjectURL' "$tmpdir/mobile-quality.js" \
              && grep -Fqi "media-src 'self'" "$tmpdir/home.headers"; then
              publish_status success 'Safari-safe mobile forest video is live'
              echo 'The exact MP4 is live through the uncached strong-ETag range route.'
              exit 0
            fi

            sleep 10
          done

          publish_status failure 'Safari-safe mobile forest video is not live'
          echo '::error::Production never served the exact MP4 through the strong-ETag no-store range route.'
          exit 1

name: Verify mobile video background

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-mobile-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Reconstruct and validate the exact mobile MP4
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(
            find public/scenes -maxdepth 1 -type f \
              -name 'mobile-forest-stream-loop-v1.part*.b64' \
              | sort
          )
          test "${#parts[@]}" -eq 5
          cat "${parts[@]}" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > /tmp/mobile-forest-stream-loop-v1.mp4
          test "$(wc -c < /tmp/mobile-forest-stream-loop-v1.mp4)" -eq 43100
          printf '%s  %s\n' \
            'a3493523af9dd22728fb81ab30b36b9633debf49b8486f168efc0503b039ae57' \
            '/tmp/mobile-forest-stream-loop-v1.mp4' \
            | sha256sum --check --strict
          file /tmp/mobile-forest-stream-loop-v1.mp4 \
            | grep -Fq 'ISO Media, MP4'

      - name: Validate mobile playback implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const EXPECTED_VIDEO_BYTES = 43_100;' public/mobile-quality.js
          grep -Fq 'mobile-forest-stream-loop-v1.part' public/mobile-quality.js
          grep -Fq 'new Blob([bytes], { type: "video/mp4" })' public/mobile-quality.js
          grep -Fq 'URL.createObjectURL(blob)' public/mobile-quality.js
          grep -Fq 'video.autoplay = true' public/mobile-quality.js
          grep -Fq 'video.muted = true' public/mobile-quality.js
          grep -Fq 'video.defaultMuted = true' public/mobile-quality.js
          grep -Fq 'video.loop = true' public/mobile-quality.js
          grep -Fq 'video.playsInline = true' public/mobile-quality.js
          grep -Fq 'video.play()' public/mobile-quality.js
          grep -Fq 'resumeAfterGesture' public/mobile-quality.js
          grep -Fq "media-src 'self' blob:" public/_headers
          test ! -e .github/workflows/install-mobile-video-bridge.yml

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-payload
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Wait for the exact video loader and payload to reach production
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='a3493523af9dd22728fb81ab30b36b9633debf49b8486f168efc0503b039ae57'
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          for attempt in {1..36}; do
            key="${GITHUB_SHA}-${attempt}"
            script_status="$(
              curl --max-time 20 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$tmpdir/mobile-quality.js" \
                --write-out '%{http_code}' \
                "https://stabilize.info/mobile-quality.js?release=${key}" \
                || true
            )"
            header_status="$(
              curl --max-time 20 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/home.headers" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://stabilize.info/?mobile-video-release=${key}" \
                || true
            )"

            : > "$tmpdir/video.b64"
            parts_ok=true
            for index in 00 01 02 03 04; do
              part_status="$(
                curl --max-time 20 --silent --show-error \
                  --header 'Cache-Control: no-cache' \
                  --output "$tmpdir/part-${index}.b64" \
                  --write-out '%{http_code}' \
                  "https://stabilize.info/scenes/mobile-forest-stream-loop-v1.part${index}.b64?release=${key}" \
                  || true
              )"
              if [[ "$part_status" != 200 ]]; then
                parts_ok=false
              fi
              cat "$tmpdir/part-${index}.b64" >> "$tmpdir/video.b64"
            done

            live_bytes=0
            live_sha='missing'
            if $parts_ok; then
              tr -d '[:space:]' < "$tmpdir/video.b64" \
                | base64 --decode \
                > "$tmpdir/video.mp4" \
                2>/dev/null || true
              live_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
              live_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"
            fi

            echo "Mobile video attempt ${attempt}: script=${script_status:-000} headers=${header_status:-000} parts=${parts_ok}; bytes=${live_bytes}; sha=${live_sha:0:12}."

            if [[ "$script_status" == 200 \
              && "$header_status" == 200 \
              && "$parts_ok" == true \
              && "$live_bytes" == 43100 \
              && "$live_sha" == "$expected_sha" ]] \
              && grep -Fq 'URL.createObjectURL(blob)' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.defaultMuted = true' "$tmpdir/mobile-quality.js" \
              && grep -Fq 'video.play()' "$tmpdir/mobile-quality.js" \
              && grep -Fqi "media-src 'self' blob:" "$tmpdir/home.headers"; then
              echo 'The exact mobile forest video loader and payload are live.'
              exit 0
            fi

            sleep 10
          done

          echo '::error::Production never served the exact mobile video loader, CSP, and reconstructed MP4 together.'
          exit 1

name: Diagnose memory controls Node test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  memory-controls-node:
    if: github.head_ref == 'agent/memory-deletion-guest-session-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/memory-deletion-guest-session-v2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct generator
        run: |
          cat tmp/memory-controls-generator/chunk-*.txt | base64 --decode | gzip --decompress > scripts/add-memory-deletion-and-guest-session.mjs
          node tmp/memory-controls-generator/patch-current-main.mjs
          node --check scripts/add-memory-deletion-and-guest-session.mjs
      - name: Wire generator
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const generator = 'node scripts/add-memory-deletion-and-guest-session.mjs';
          if (!p.scripts['apply:prompt-policy'].includes(generator)) p.scripts['apply:prompt-policy'] += ` && ${generator}`;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run apply:prompt-policy
      - name: Run focused memory controls test
        run: node --test test/memory-controls.test.mjs

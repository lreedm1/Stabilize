name: Publish AI-enhanced mobile 4K v23

on:
  push:
    branches:
      - agent/ai-enhanced-mobile-4k-v23
    paths:
      - .github/workflows/publish-ai-enhanced-mobile-4k-v23.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-ai-enhanced-mobile-4k-v23.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-generated-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/ai-enhanced-mobile-4k-v23
          fetch-depth: 1
          persist-credentials: true

      - name: Download the measured candidate
        uses: actions/download-artifact@v4
        with:
          name: ai-enhanced-mobile-4k-v23-candidate
          path: /tmp/mobile-ai-4k-v23
          repository: lreedm1/Stabilize
          run-id: 31351721510
          github-token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install release dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts

      - name: Verify and install the exact candidate assets
        shell: bash
        run: |
          set -euo pipefail
          source_video='/tmp/mobile-ai-4k-v23/output/mobile-forest-stream-video-v23-ai-2160.mp4'
          source_poster='/tmp/mobile-ai-4k-v23/output/mobile-forest-stream-v23-ai-2160.webp'
          target_video='public/scenes/mobile-forest-stream-video-v23-ai-2160.mp4'
          target_poster='public/scenes/mobile-forest-stream-v23-ai-2160.webp'

          test -s "$source_video"
          test -s "$source_poster"
          test "$(wc -c < "$source_video" | tr -d '[:space:]')" -eq 20957716
          test "$(sha256sum "$source_video" | awk '{print $1}')" = \
            'be5995746c6137f9f63121eead3883ce1469279563738e1ccbd813abf9d7becf'
          test "$(sha256sum "$source_poster" | awk '{print $1}')" = \
            'a2455ef18233b4085691a004629a793bbbce053ca43938f3dcd7a62ee469ca63'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$source_video")" = 2160x3840
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$source_poster")" = 2160x3840
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$source_video")" -gt 30000000
          ffmpeg -hide_banner -v error -xerror -err_detect explode \
            -i "$source_video" -map 0:v:0 -f null -

          cp "$source_video" "$target_video"
          cp "$source_poster" "$target_poster"

      - name: Materialize the canonical application release
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          node --check scripts/use-ai-enhanced-mobile-4k-v23.mjs
          node --check public/mobile-quality.js
          grep -Fq '/media/mobile-forest-stream-video-v23-ai-2160.mp4' src/page.js
          grep -Fq '/scenes/mobile-forest-stream-v23-ai-2160.webp' src/page.js
          grep -Fq 'ai-enhanced-2160x3840' public/mobile-quality.js
          grep -Fq 'MOBILE_VIDEO_BYTES = 20_957_716' src/mobile-video-response.js
          grep -Fq 'const assetByteCache = new WeakMap();' src/mobile-video-response.js

      - name: Commit generated application and media files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Workflow files remain connector-controlled. Publish the exact media
          # candidate and canonical generated application output before running
          # the wider suite so ordinary PR checks can inspect any later failure.
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A -- . ':(exclude).github/workflows/**'
          git status --short

          if git diff --cached --quiet; then
            echo 'The AI-enhanced mobile release was already canonical.'
          else
            git commit -m 'Serve the AI-enhanced selected forest background'
          fi

      - name: Publish generated release branch
        shell: bash
        run: git push origin HEAD:agent/ai-enhanced-mobile-4k-v23

      - name: Run the complete regression and Worker build gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean

      - name: Confirm generation is repeatable
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          git diff --exit-code

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-enhanced-mobile-4k-v23-publication
          path: |
            /tmp/mobile-ai-4k-v23/metrics
            public/scenes/mobile-forest-stream-video-v23-ai-2160.mp4
            public/scenes/mobile-forest-stream-v23-ai-2160.webp
          if-no-files-found: warn
          retention-days: 7

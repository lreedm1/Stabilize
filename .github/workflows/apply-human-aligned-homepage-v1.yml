name: Apply human-aligned homepage v1

on:
  push:
    branches:
      - feature/human-aligned-homepage-v1
    paths:
      - .github/workflows/apply-human-aligned-homepage-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out homepage branch
        uses: actions/checkout@v6
        with:
          ref: feature/human-aligned-homepage-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      - name: Apply homepage positioning
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-human-aligned-homepage-v1.mjs
          npm run apply:prompt-policy
          git restore --source=HEAD -- .github/workflows

      - name: Commit generated homepage locally
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Differentiate Stabilize homepage and explain the flow'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run regressions and Worker checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          git restore --source=HEAD -- .github/workflows
          npm run verify:clean
          git diff --exit-code

      - name: Publish verified homepage commit
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feature/human-aligned-homepage-v1

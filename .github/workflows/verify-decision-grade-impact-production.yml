name: Verify decision-grade impact production

on:
  workflow_run:
    workflows:
      - Deploy Stabilize to Cloudflare
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark production impact verification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{"state":"pending","context":"verification/decision-grade-impact","description":"Checking live model, tier, tokens, and impact metadata","target_url":"%s"}' "$target")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}"

      - name: Check out deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify production stream metadata
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/verify-decision-grade-impact-production.mjs

      - name: Publish production impact verification result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Live model, Fast tier, tokens, turn ID, and impact version verified"
          else
            state="failure"
            description="Live decision-grade impact metadata verification failed"
          fi
          payload="$(printf '{"state":"%s","context":"verification/decision-grade-impact","description":"%s","target_url":"%s"}' "$state" "$description" "$target")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}"

name: Verify decision-grade impact production

on:
  push:
    branches:
      - agent/verify-decision-grade-impact-production

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production verification
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify production stream carries provider usage
        run: node scripts/verify-decision-grade-impact-production.mjs

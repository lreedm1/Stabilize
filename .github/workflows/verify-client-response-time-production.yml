name: Verify client response time production

on:
  push:
    branches:
      - agent/verify-client-response-time-production

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: d4c03cb39d95459a7efb2f22bb1b46612deaeb65
    steps:
      - name: Mark live browser timing verification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{"state":"pending","context":"verification/client-response-time","description":"Checking live browser timing asset and endpoint","target_url":"%s"}' "$target")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"

      - name: Verify live browser response-time tracking
        shell: bash
        run: |
          set -euo pipefail
          origin="https://stabilize.info"

          for attempt in $(seq 1 60); do
            home="$(mktemp)"
            script="$(mktemp)"
            privacy="$(mktemp)"
            endpoint_body="$(mktemp)"

            home_status="$(
              curl --max-time 20 --compressed --silent --show-error \
                --header "Cache-Control: no-cache" \
                --output "$home" \
                --write-out "%{http_code}" \
                "${origin}/?verify-client-response-time=${TARGET_SHA}-${attempt}" || true
            )"
            impact_path="$(grep -oE 'src="/impact\.js\?v=[^"]+"' "$home" | head -n 1 | sed -E 's/^src="//; s/"$//' || true)"
            script_status="000"
            privacy_status="000"
            endpoint_status="000"

            if [[ -n "$impact_path" ]]; then
              script_status="$(
                curl --max-time 20 --compressed --silent --show-error \
                  --header "Cache-Control: no-cache" \
                  --output "$script" \
                  --write-out "%{http_code}" \
                  "${origin}${impact_path}" || true
              )"
            fi
            privacy_status="$(
              curl --max-time 20 --compressed --location --max-redirs 5 --silent --show-error \
                --header "Cache-Control: no-cache" \
                --output "$privacy" \
                --write-out "%{http_code}" \
                "${origin}/privacy.html?verify-client-response-time=${TARGET_SHA}-${attempt}" || true
            )"
            endpoint_status="$(
              curl --max-time 20 --silent --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --header "Origin: ${origin}" \
                --data '{"sessionId":"invalid"}' \
                --output "$endpoint_body" \
                --write-out "%{http_code}" \
                "${origin}/api/client-latency" || true
            )"

            echo "attempt=${attempt} home=${home_status} impact_path=${impact_path:-none} script=${script_status} privacy=${privacy_status} endpoint=${endpoint_status}"

            if [[ "$home_status" == "200" && "$script_status" == "200" && "$privacy_status" == "200" && "$endpoint_status" == "400" ]] && \
              [[ "$impact_path" == *"20260808-browser-response-time-1"* ]] && \
              grep -Fq 'CLIENT_LATENCY_ENDPOINT = "/api/client-latency"' "$script" && \
              grep -Fq 'CLIENT_LATENCY_VERSION = "browser-render-v1"' "$script" && \
              grep -Fq 'document.visibilityState === "visible"' "$script" && \
              grep -Fq 'window.requestAnimationFrame' "$script" && \
              grep -Fq 'foreground browser timing from Send' "$privacy" && \
              grep -Fq 'tab stays continuously visible' "$privacy" && \
              grep -Fq 'Invalid client latency report.' "$endpoint_body"; then
              rm -f "$home" "$script" "$privacy" "$endpoint_body"
              echo "Actual browser response-time tracking is live."
              exit 0
            fi

            rm -f "$home" "$script" "$privacy" "$endpoint_body"
            sleep 5
          done

          echo "Live browser response-time tracking did not match the merged release." >&2
          exit 1

      - name: Publish live browser timing verification result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Live first-visible and fully-rendered timing verified"
          else
            state="failure"
            description="Live browser response-time tracking verification failed"
          fi
          payload="$(printf '{"state":"%s","context":"verification/client-response-time","description":"%s","target_url":"%s"}' "$state" "$description" "$target")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"

name: Materialize mobile background

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode the generated image and install it
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          from pathlib import Path

          asset = Path("public/scenes/mobile-golden-alpine-v2.webp")
          raw = base64.b64decode("".join(asset.read_text().split()), validate=True)
          if raw[:4] != b"RIFF" or raw[8:12] != b"WEBP":
              raise SystemExit("Decoded asset is not a WebP image")

          offset = 12
          dimensions = None
          while offset + 8 <= len(raw):
              chunk = raw[offset:offset + 4]
              size = int.from_bytes(raw[offset + 4:offset + 8], "little")
              data = offset + 8
              if chunk == b"VP8X" and data + 10 <= len(raw):
                  dimensions = (
                      1 + int.from_bytes(raw[data + 4:data + 7], "little"),
                      1 + int.from_bytes(raw[data + 7:data + 10], "little"),
                  )
                  break
              if chunk == b"VP8 " and data + 10 <= len(raw) and raw[data + 3:data + 6] == b"\x9d\x01\x2a":
                  dimensions = (
                      int.from_bytes(raw[data + 6:data + 8], "little") & 0x3FFF,
                      int.from_bytes(raw[data + 8:data + 10], "little") & 0x3FFF,
                  )
                  break
              if chunk == b"VP8L" and data + 5 <= len(raw) and raw[data] == 0x2F:
                  bits = int.from_bytes(raw[data + 1:data + 5], "little")
                  dimensions = (1 + (bits & 0x3FFF), 1 + ((bits >> 14) & 0x3FFF))
                  break
              offset = data + size + (size % 2)

          if dimensions != (853, 1844):
              raise SystemExit(f"Unexpected image dimensions: {dimensions}")
          if len(raw) < 100_000:
              raise SystemExit(f"Image is unexpectedly small: {len(raw)} bytes")
          asset.write_bytes(raw)

          Path("public/mobile-woodland-loop.css").write_text(
              """@media (max-width: 980px) and (orientation: portrait) {
            .photo-backdrop {
              overflow: hidden;
              background: #173f31;
              filter: none;
              transform: none;
              animation: none;
              will-change: auto;
            }

            .photo-backdrop img {
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
              object-fit: cover;
              object-position: 50% 50%;
              opacity: 1;
              filter: none;
              transform: none !important;
              animation: none !important;
              will-change: auto;
            }

            .photo-backdrop::before,
            .photo-backdrop::after {
              display: none !important;
              content: none !important;
              animation: none !important;
            }

            .photo-background {
              display: none;
            }
          }
          """
          )

          page = Path("src/page.js")
          source = page.read_text()
          source = source.replace(
              "/scenes/mobile-woodland-spring-loop.webp?v=20260802-9",
              "/scenes/mobile-golden-alpine-v2.webp?v=20260803-13",
          )
          source = source.replace(
              "mobile-golden-alpine-v2.webp?v=20260803-13 540w",
              "mobile-golden-alpine-v2.webp?v=20260803-13 853w",
          )
          source = source.replace(
              "mobile-woodland-loop.css?v=20260802-9",
              "mobile-woodland-loop.css?v=20260803-13",
          )
          if "mobile-golden-alpine-v2.webp?v=20260803-13 853w" not in source:
              raise SystemExit("New mobile source was not installed in page.js")
          page.write_text(source)

          Path("public/scenes/mobile-golden-alpine-v2.bin").unlink(missing_ok=True)
          Path(".github/workflows/materialize-mobile-background.yml").unlink()
          print(f"Installed {dimensions[0]}x{dimensions[1]} WebP ({len(raw)} bytes)")
          PY

      - name: Commit real image bytes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use the new generated mobile background"
          git push origin HEAD:main

name: Apply visible-autoplay Retina mobile background

on:
  push:
    branches:
      - agent/mobile-video-no-gesture-retina-fallback
    paths:
      - scripts/apply-mobile-autoplay-v15.py
      - .github/workflows/apply-mobile-autoplay-v15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply visible autoplay and full Retina fallback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-mobile-autoplay-v15.py
          npm ci --ignore-scripts
          npm run apply:prompt-policy

      - name: Commit the generated release before verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Start the Retina mobile background without a gesture'

      - name: Run the full verification suite
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the verified branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/mobile-video-no-gesture-retina-fallback

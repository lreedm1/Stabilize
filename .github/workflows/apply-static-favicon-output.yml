name: Apply static favicon output

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-static-favicon-output.yml

permissions:
  contents: write

concurrency:
  group: apply-static-favicon-output
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and verify the static favicon files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/embed-favicon-fallback.mjs
          rm -f .github/workflows/verify-safari-tab-icon.yml
          node --test \
            test/model-tile-favicon.test.mjs \
            test/favicon-source-validation.test.mjs \
            test/favicon-workflow.test.mjs \
            test/favicon-release-gate.test.mjs
          git diff --check

      - name: Commit generated output
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-static-favicon-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply the static Safari favicon contract"
          git pull --rebase origin main
          git push origin HEAD:main

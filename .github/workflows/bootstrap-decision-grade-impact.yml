name: Bootstrap decision-grade impact

on:
  push:
    branches:
      - agent/decision-grade-impact-v2

permissions:
  contents: write
  statuses: write

concurrency:
  group: bootstrap-decision-grade-impact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark bootstrap pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload='{"state":"pending","context":"bootstrap/decision-grade-impact","description":"Applying measurement patch to current main"}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Check out current-main feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: agent/decision-grade-impact-v2

      - name: Copy measurement source from the validated feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/decision-grade-impact
          files=(
            scripts/apply-decision-grade-impact.mjs
            scripts/prepare-decision-grade-impact.mjs
            scripts/finalize-decision-grade-impact.mjs
            src/impact-pricing.js
            src/impact-latency.js
            test/decision-grade-impact.test.mjs
            test/decision-grade-impact-worker.test.mjs
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/agent/decision-grade-impact:${file}" > "$file"
          done

      - name: Wire measurement generation into the current pipeline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const prepare = 'node scripts/prepare-decision-grade-impact.mjs';
          const apply = 'node scripts/apply-decision-grade-impact.mjs';
          const finalize = 'node scripts/finalize-decision-grade-impact.mjs';
          const pipeline = pkg.scripts['apply:prompt-policy']
            .split(' && ')
            .filter(Boolean)
            .filter((entry) => ![prepare, apply, finalize].includes(entry));
          const prepareAnchor = pipeline.indexOf(
            'node scripts/prepare-gpt56-fast-generators.mjs',
          );
          pipeline.splice(
            prepareAnchor >= 0 ? prepareAnchor + 1 : 0,
            0,
            prepare,
          );
          const fullGuestAnchor = pipeline.indexOf(
            'node scripts/finalize-full-guest-conversation.mjs',
          );
          const insertion = fullGuestAnchor >= 0
            ? fullGuestAnchor + 1
            : pipeline.length;
          pipeline.splice(insertion, 0, apply, finalize);
          pkg.scripts['apply:prompt-policy'] = pipeline.join(' && ');

          const ensureTest = (name, file) => {
            const parts = pkg.scripts[name].split(/\s+/).filter(Boolean);
            if (!parts.includes(file)) parts.push(file);
            pkg.scripts[name] = parts.join(' ');
          };
          ensureTest('test:node', 'test/decision-grade-impact.test.mjs');
          ensureTest(
            'test:worker',
            'test/decision-grade-impact-worker.test.mjs',
          );
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and materialize policy
        run: npm ci

      - name: Commit canonical output
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Canonical output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply decision-grade impact measurement"
          git push origin HEAD:agent/decision-grade-impact-v2

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Verify repository stays clean
        run: npm run verify:clean

      - name: Publish bootstrap result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state="success"
            description="Current main preserved; tests, build, and clean-tree passed"
          else
            state="failure"
            description="Measurement bootstrap, tests, build, or clean-tree failed"
          fi
          payload="$(printf '{"state":"%s","context":"bootstrap/decision-grade-impact","description":"%s"}' "$state" "$description")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

name: Install generated mobile background

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-generated-mobile-background.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and validate the generated WebP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/scenes
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 2 \
            "https://filebin.net/stabilize-mobile-bg-20260803-5ffe5cad/mobile-golden-alpine-v2.webp" \
            --output public/scenes/mobile-golden-alpine-v2.webp

          python3 <<'PY'
          from pathlib import Path

          path = Path("public/scenes/mobile-golden-alpine-v2.webp")
          data = path.read_bytes()
          if len(data) < 100_000 or len(data) > 5_000_000:
              raise SystemExit(f"Unexpected image size: {len(data)} bytes")
          if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("Downloaded asset is not a WebP")
          declared = int.from_bytes(data[4:8], "little") + 8
          if declared != len(data):
              raise SystemExit(f"WebP length mismatch: declared {declared}, actual {len(data)}")

          offset = 12
          dimensions = None
          animated = False
          while offset + 8 <= len(data):
              chunk = data[offset:offset + 4]
              size = int.from_bytes(data[offset + 4:offset + 8], "little")
              payload = offset + 8
              end = payload + size
              if end > len(data):
                  raise SystemExit(f"Truncated WebP chunk: {chunk!r}")
              if chunk == b"ANIM":
                  animated = True
              if chunk == b"VP8X" and payload + 10 <= len(data):
                  dimensions = (
                      1 + int.from_bytes(data[payload + 4:payload + 7], "little"),
                      1 + int.from_bytes(data[payload + 7:payload + 10], "little"),
                  )
              elif chunk == b"VP8 " and payload + 10 <= len(data) and data[payload + 3:payload + 6] == b"\x9d\x01\x2a":
                  dimensions = (
                      int.from_bytes(data[payload + 6:payload + 8], "little") & 0x3FFF,
                      int.from_bytes(data[payload + 8:payload + 10], "little") & 0x3FFF,
                  )
              elif chunk == b"VP8L" and payload + 5 <= len(data) and data[payload] == 0x2F:
                  bits = int.from_bytes(data[payload + 1:payload + 5], "little")
                  dimensions = (1 + (bits & 0x3FFF), 1 + ((bits >> 14) & 0x3FFF))
              offset = end + (size % 2)

          if dimensions != (853, 1844):
              raise SystemExit(f"Unexpected dimensions: {dimensions}")
          if animated:
              raise SystemExit("Mobile background must be static")
          print(f"Validated {path}: {dimensions[0]}x{dimensions[1]}, {len(data)} bytes")
          PY

      - name: Replace failed materialization path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path(".")

          for rel in [
              "public/scenes/mobile-golden-alpine-v2.b64",
              "public/scenes/mobile-golden-alpine-v2.bin",
              "scripts/materialize-mobile-background.mjs",
              ".github/workflows/materialize-mobile-background.yml",
              ".github/workflows/install-generated-mobile-background.yml",
              "tmp-drive-note.txt",
              ".git-api-base-test",
          ]:
              path = root / rel
              if path.exists():
                  path.unlink()

          package_path = root / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          materializer = "node scripts/materialize-mobile-background.mjs && "
          package["scripts"]["apply:prompt-policy"] = package["scripts"]["apply:prompt-policy"].replace(materializer, "")
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          ignore_path = root / ".gitignore"
          ignore_lines = [
              line
              for line in ignore_path.read_text(encoding="utf-8").splitlines()
              if line.strip() != "public/scenes/mobile-golden-alpine-v2.webp"
          ]
          ignore_path.write_text("\n".join(ignore_lines).rstrip() + "\n", encoding="utf-8")

          asset = "/scenes/mobile-golden-alpine-v2.webp?v=20260803-14"
          page_path = root / "src/page.js"
          page = page_path.read_text(encoding="utf-8")
          for old_asset in [
              "/scenes/mobile-woodland-spring-loop.webp?v=20260802-9",
              "/scenes/mobile-golden-alpine-v2.webp?v=20260803-13",
          ]:
              page = page.replace(old_asset, asset)
          page = page.replace(
              "mobile-golden-alpine-v2.webp?v=20260803-14 540w",
              "mobile-golden-alpine-v2.webp?v=20260803-14 853w",
          )
          page = page.replace(
              "mobile-woodland-loop.css?v=20260802-9",
              "mobile-woodland-loop.css?v=20260803-14",
          )
          page = page.replace(
              "mobile-woodland-loop.css?v=20260803-13",
              "mobile-woodland-loop.css?v=20260803-14",
          )
          if f'href="{asset}"' not in page:
              raise SystemExit("New image preload was not installed")
          if f'{asset} 853w' not in page:
              raise SystemExit("New image source was not installed")
          page_path.write_text(page, encoding="utf-8")

          (root / "public/mobile-woodland-loop.css").write_text(
              '''@media (max-width: 980px) and (orientation: portrait) {
            .photo-backdrop {
              overflow: hidden;
              background: #173f31;
              filter: none;
              transform: none;
              animation: none;
              will-change: auto;
            }

            .photo-backdrop img {
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
              object-fit: cover;
              object-position: 50% 50%;
              opacity: 1;
              filter: none;
              transform: none !important;
              animation: none !important;
              will-change: auto;
            }

            .photo-backdrop::before,
            .photo-backdrop::after {
              display: none !important;
              content: none !important;
              animation: none !important;
            }

            .photo-background {
              display: none;
            }
          }
          ''',
              encoding="utf-8",
          )

          (root / "public/scenes/MOBILE_GOLDEN_ALPINE_CREDIT.md").write_text(
              "# Mobile golden alpine background\n\n"
              "Source image: AI-generated for Stabilize in ChatGPT on August 3, 2026, from Reed Lokken's direction.\n\n"
              "This version commits the generated 853 × 1844 portrait image directly as one static WebP. "
              "It uses no build-time decoding, animation, duplicate layers, stock photography, or visual filters.\n",
              encoding="utf-8",
          )

          test_path = root / "test/mobile-quality.test.mjs"
          source = test_path.read_text(encoding="utf-8")
          first_test = source.index('test("mobile uses')
          second_test = source.index('test("restored tabs recover')
          replacement = r'''test("mobile uses one directly committed high-resolution static WebP", async () => {
            const [pageSource, mobileQuality, mobileStyles, image] =
              await Promise.all([
                readFile(new URL("../src/page.js", import.meta.url), "utf8"),
                readFile(new URL("../public/mobile-quality.js", import.meta.url), "utf8"),
                readFile(new URL("../public/mobile-woodland-loop.css", import.meta.url), "utf8"),
                readFile(
                  new URL(
                    "../public/scenes/mobile-golden-alpine-v2.webp",
                    import.meta.url,
                  ),
                ),
              ]);

            const imageInfo = webpInfo(image);
            assert.deepEqual(
              { width: imageInfo.width, height: imageInfo.height },
              { width: 853, height: 1844 },
            );
            assert.ok(image.byteLength > 100_000);
            assert.ok(image.byteLength < 5_000_000);
            assert.equal(imageInfo.chunks.includes("ANIM"), false);

            assert.match(
              pageSource,
              /mobile-golden-alpine-v2\.webp\?v=20260803-14 853w/,
            );
            assert.match(
              pageSource,
              /rel="preload"[\s\S]*mobile-golden-alpine-v2\.webp\?v=20260803-14/,
            );
            assert.match(pageSource, /mobile-woodland-loop\.css\?v=20260803-14/);
            assert.doesNotMatch(pageSource, /mobile-woodland-spring-loop/);

            assert.match(mobileStyles, /opacity:\s*1/);
            assert.match(mobileStyles, /object-fit:\s*cover/);
            assert.match(mobileStyles, /animation:\s*none/);
            assert.doesNotMatch(mobileStyles, /@keyframes/);
            assert.doesNotMatch(mobileStyles, /mobile-golden-alpine\.avif/);

            assert.match(mobileQuality, /max-width: 980px/);
            assert.match(mobileQuality, /orientation: portrait/);
            assert.doesNotMatch(mobileQuality, /createElement\("video"\)/);
            assert.doesNotMatch(mobileQuality, /new Blob/);
            assert.doesNotMatch(mobileQuality, /mobile-creek-video/);
          });

          '''
          test_path.write_text(source[:first_test] + replacement + source[second_test:], encoding="utf-8")
          PY

      - name: Validate Cloudflare's install and test path
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run check
          git diff --check

      - name: Commit the real binary image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Commit the new mobile background as a real WebP"
          git push origin HEAD:main

name: Materialize full guest conversation

on:
  push:
    branches:
      - agent/full-guest-conversation
    paths:
      - package.json
      - scripts/remember-full-guest-conversation.mjs
      - scripts/remember-full-guest-client.mjs
      - scripts/remember-full-guest-server-docs.mjs
      - test/guest-summary.test.mjs
      - test/guest-summary-worker.test.mjs
      - .github/workflows/materialize-full-guest-conversation.yml

permissions:
  contents: write

concurrency:
  group: materialize-full-guest-conversation
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and materialize policy
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Commit materialized files
        shell: bash
        run: |
          rm -f .github/workflows/materialize-full-guest-conversation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes were produced."
            exit 1
          fi
          git commit -m "Remember full guest conversations [materialized]"
          npm run verify:clean
          git push origin HEAD:agent/full-guest-conversation

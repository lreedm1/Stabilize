name: Fix AI model button v2

on:
  push:
    branches:
      - fix/ai-model-button
    paths:
      - .github/workflows/fix-ai-model-button-v2.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/ai-model-button
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          billing = Path("src/billing.js")
          text = billing.read_text()
          text, removed_managed = re.subn(
              r'\n\s*params\.set\("managed_payments\[enabled\]", "true"\);',
              '',
              text,
              count=1,
          )
          text, removed_version = re.subn(
              r'\n\s*stripeVersion: MANAGED_PAYMENTS_STRIPE_VERSION,',
              '',
              text,
              count=1,
          )
          if removed_managed != 1 or removed_version != 1:
              raise SystemExit("Could not convert checkout to standard Stripe Checkout")
          billing.write_text(text)

          worker = Path("src/paid-worker.js")
          text = worker.read_text()
          guest_pattern = re.compile(
              r'  if \(!signedIn\) \{.*?\n  \}\n\n  if \(!state\.entitled\)',
              re.S,
          )
          guest_replacement = '''  if (!signedIn) {
            return `<section class="billing-menu" aria-labelledby="billing-heading">
              <h2 id="billing-heading">AI model</h2>
              <p>Sign in to unlock paid model choice.</p>
              <a class="billing-primary billing-link" href="/auth/google">Sign in to choose a model</a>
            </section>`;
          }

          if (!state.entitled)'''
          text, guest_count = guest_pattern.subn(guest_replacement, text, count=1)
          if guest_count != 1:
              raise SystemExit("Could not add the guest model-choice action")

          form_updates = [
              ('<form action="/billing/checkout" method="post">', '<form action="/billing/checkout" method="post" data-billing-action="checkout">'),
              ('<form action="/billing/portal" method="post">', '<form action="/billing/portal" method="post" data-billing-action="portal">'),
              ('<form action="/account/model" method="post" class="model-choice-form">', '<form action="/account/model" method="post" class="model-choice-form" data-billing-action="model">'),
          ]
          for old, new in form_updates:
              if old not in text:
                  raise SystemExit(f"Missing expected billing form: {old}")
              text = text.replace(old, new)

          marker = '''  if (notice) {
            html = html.replace('''
          injection = '''  if (markup && !html.includes('src="/billing-client.js"')) {
            html = html.replace(
              "</body>",
              '    <script type="module" src="/billing-client.js"></script>\\n  </body>',
            );
          }
          '''
          if marker not in text:
              raise SystemExit("Could not find the billing-page injection point")
          text = text.replace(marker, injection + marker, 1)
          worker.write_text(text)

          css = Path("public/billing.css")
          css_text = css.read_text()
          if ".billing-link" not in css_text:
              css_text += '''

          .billing-link {
            display: flex;
            width: 100%;
            min-height: 40px;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.8rem;
            font-weight: 760;
            text-align: center;
            text-decoration: none;
          }

          .billing-menu button:disabled {
            cursor: wait;
            opacity: 0.72;
          }
          '''
          css.write_text(css_text)

          Path("public/billing-client.js").write_text('''const labels = {
            checkout: "Opening Stripe…",
            portal: "Opening billing…",
            model: "Saving model…",
          };

          for (const form of document.querySelectorAll(
            ".billing-menu form[data-billing-action]",
          )) {
            form.addEventListener("submit", () => {
              const button = form.querySelector('button[type="submit"]');
              if (!(button instanceof HTMLButtonElement) || button.disabled) return;
              button.disabled = true;
              button.setAttribute("aria-busy", "true");
              button.textContent = labels[form.dataset.billingAction] || "Working…";
            });
          }
          ''')

          tests = Path("test/billing.test.mjs")
          test_text = tests.read_text()
          test_text = test_text.replace(
              'test("managed payments Checkout uses the blueprint version and parameters", async () => {',
              'test("model subscription uses standard Stripe Checkout parameters", async () => {',
              1,
          )
          test_text = test_text.replace(
              '''    assert.equal(
              request.init.headers["Stripe-Version"],
              MANAGED_PAYMENTS_STRIPE_VERSION,
            );
          ''',
              '''    assert.equal(request.init.headers["Stripe-Version"], undefined);
          ''',
              1,
          )
          test_text = test_text.replace(
              '''    assert.equal(params.get("managed_payments[enabled]"), "true");
          ''',
              '''    assert.equal(params.has("managed_payments[enabled]"), false);
          ''',
              1,
          )
          tests.write_text(test_text)

          product_tests = Path("test/product.test.mjs")
          product_text = product_tests.read_text()
          if "AI model controls are actionable" not in product_text:
              product_text += r'''

          test("AI model controls are actionable and show progress", async () => {
            const [workerSource, clientSource, billingStyles] = await Promise.all([
              readFile(new URL("../src/paid-worker.js", import.meta.url), "utf8"),
              readFile(new URL("../public/billing-client.js", import.meta.url), "utf8"),
              readFile(new URL("../public/billing.css", import.meta.url), "utf8"),
            ]);

            assert.match(workerSource, /Sign in to choose a model/);
            assert.match(workerSource, /data-billing-action="checkout"/);
            assert.match(workerSource, /src="\/billing-client\.js"/);
            assert.match(clientSource, /Opening Stripe/);
            assert.match(clientSource, /aria-busy/);
            assert.match(billingStyles, /\.billing-link/);
          });
          '''
          product_tests.write_text(product_text)
          PY

      - name: Run full test suite
        run: npm test

      - name: Validate Worker build
        run: npm run check

      - name: Commit repaired files
        run: |
          rm -f .github/workflows/fix-ai-model-button.yml
          rm -f .github/workflows/fix-ai-model-button-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/billing.js src/paid-worker.js public/billing.css public/billing-client.js test/billing.test.mjs test/product.test.mjs .github/workflows/fix-ai-model-button.yml .github/workflows/fix-ai-model-button-v2.yml
          git commit -m "Fix AI model checkout button"
          git push origin HEAD:fix/ai-model-button

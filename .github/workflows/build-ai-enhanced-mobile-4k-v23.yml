name: Build AI-enhanced mobile 4K candidate v23

on:
  push:
    branches:
      - agent/ai-enhanced-mobile-4k-v23
    paths:
      - .github/workflows/build-ai-enhanced-mobile-4k-v23.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-ai-enhanced-mobile-4k-v23.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: agent/ai-enhanced-mobile-4k-v23
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install media and image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg git libgl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            torch==2.1.2+cpu torchvision==0.16.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            numpy==1.26.4 \
            opencv-python==4.10.0.84 \
            pillow==10.4.0 \
            scikit-image==0.24.0

      - name: Install Real-ESRGAN x2
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v0.3.0 \
            https://github.com/xinntao/Real-ESRGAN.git \
            /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install --force-reinstall \
            numpy==1.26.4 \
            opencv-python==4.10.0.84 \
            pillow==10.4.0
          mkdir -p weights
          curl --fail-with-body --location --retry 4 --retry-delay 2 \
            --output weights/RealESRGAN_x2plus.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth

      - name: Reconstruct the exact selected scene sources
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/mobile-ai-4k-v23
          mkdir -p "$work/source" "$work/output" "$work/metrics"

          git fetch --no-tags --depth=1 origin \
            agent/mobile-hq-v1:refs/remotes/origin/agent/mobile-hq-v1
          git show \
            origin/agent/mobile-hq-v1:public/scenes/mobile-forest-hq-v1-1080.webp \
            > "$work/source/selected-forest-1080.webp"

          mapfile -t motion_parts < <(
            find public/scenes -maxdepth 1 -type f \
              -name 'mobile-forest-stream-loop-v1.part*.b64' | sort
          )
          test "${#motion_parts[@]}" -eq 5
          cat "${motion_parts[@]}" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$work/source/selected-motion-512.mp4"

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$work/source/selected-forest-1080.webp")" = 1080x1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$work/source/selected-motion-512.mp4")" = 512x908
          ffmpeg -hide_banner -v error -xerror -err_detect explode \
            -i "$work/source/selected-motion-512.mp4" -map 0:v:0 -f null -

      - name: AI-upscale the selected still to a full-frame master
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/mobile-ai-4k-v23
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py \
            -n RealESRGAN_x2plus \
            -i "$work/source/selected-forest-1080.webp" \
            -o "$work/output/upscaled" \
            --outscale 2 \
            --tile 192 \
            --tile_pad 16 \
            --pre_pad 0 \
            --fp32 \
            --ext png

          upscaled="$(find "$work/output/upscaled" -maxdepth 1 -type f -name '*.png' | head -n 1)"
          test -n "$upscaled"
          cp "$upscaled" "$work/output/selected-forest-ai-2160.png"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$work/output/selected-forest-ai-2160.png")" = 2160x3840

      - name: Render only the creek motion over the enhanced full-frame master
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/mobile-ai-4k-v23

          python - "$work/source/water-mask-2160.pgm" <<'PY'
          from pathlib import Path
          import math
          import sys

          width, height = 2160, 3840
          points = [
              (1380, 1840, 70),
              (1580, 1830, 110),
              (1800, 1800, 170),
              (2080, 1784, 230),
              (2400, 1800, 300),
              (2760, 1850, 380),
              (3160, 1930, 470),
              (3560, 2000, 560),
              (3838, 2030, 630),
          ]
          feather = 144.0
          pixels = bytearray(width * height)
          for y in range(height):
              if y < points[0][0]:
                  continue
              upper = points[-1]
              lower = points[-1]
              for index in range(len(points) - 1):
                  if points[index][0] <= y <= points[index + 1][0]:
                      upper = points[index]
                      lower = points[index + 1]
                      break
              span = max(1, lower[0] - upper[0])
              t = min(1.0, max(0.0, (y - upper[0]) / span))
              center = upper[1] + (lower[1] - upper[1]) * t
              half_width = upper[2] + (lower[2] - upper[2]) * t
              row = y * width
              for x in range(width):
                  distance = abs(x - center)
                  if distance <= half_width:
                      alpha = 230
                  elif distance >= half_width + feather:
                      alpha = 0
                  else:
                      phase = (distance - half_width) / feather
                      alpha = round(230 * 0.5 * (1 + math.cos(math.pi * phase)))
                  pixels[row + x] = alpha
          Path(sys.argv[1]).write_bytes(
              f"P5\n{width} {height}\n255\n".encode() + pixels
          )
          PY

          output="$work/output/mobile-forest-stream-video-v23-ai-2160.mp4"
          poster="$work/output/mobile-forest-stream-v23-ai-2160.webp"

          ffmpeg -hide_banner -v error -y \
            -loop 1 -framerate 24 -i "$work/output/selected-forest-ai-2160.png" \
            -stream_loop -1 -i "$work/source/selected-motion-512.mp4" \
            -loop 1 -framerate 24 -i "$work/source/water-mask-2160.pgm" \
            -filter_complex "
              [0:v]scale=2160:3840:flags=lanczos,setsar=1,setpts=PTS-STARTPTS,format=yuv420p[base];
              [1:v]scale=2160:3840:flags=lanczos,setsar=1,setpts=PTS-STARTPTS,
                unsharp=5:5:0.35:5:5:0.0,format=rgb24[motion];
              [2:v]scale=2160:3840:flags=neighbor,setsar=1,setpts=PTS-STARTPTS,
                format=gray,gblur=sigma=28[mask];
              [motion][mask]alphamerge[water];
              [base][water]overlay=shortest=1:format=auto,format=yuv420p[out]
            " \
            -map '[out]' \
            -t 5.0 -r 24 -an \
            -c:v libx264 -profile:v high -level:v 5.1 \
            -preset slow -crf 16 -maxrate 30000k -bufsize 60000k \
            -g 24 -keyint_min 24 -sc_threshold 0 -bf 3 -refs 4 \
            -pix_fmt yuv420p -tag:v avc1 \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 \
            -movflags +faststart \
            "$output"

          ffmpeg -hide_banner -v error -xerror -err_detect explode \
            -i "$output" -map 0:v:0 -f null -
          ffmpeg -hide_banner -v error -y \
            -i "$work/output/selected-forest-ai-2160.png" \
            -frames:v 1 -c:v libwebp -quality 95 -compression_level 6 \
            "$poster"

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$output")" = 2160x3840
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$poster")" = 2160x3840
          bytes="$(wc -c < "$output" | tr -d '[:space:]')"
          test "$bytes" -gt 7000000
          test "$bytes" -lt 30000000
          ffprobe -v error -show_streams -show_format "$output" \
            > "$work/metrics/new-ffprobe.txt"
          sha256sum "$output" "$poster" \
            > "$work/metrics/sha256.txt"

      - name: Quantify effective detail and scene fidelity
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/mobile-ai-4k-v23
          old='public/scenes/mobile-forest-stream-video-v14-retina-2160.mp4'
          new="$work/output/mobile-forest-stream-video-v23-ai-2160.mp4"

          ffmpeg -hide_banner -v error -y -ss 1.5 -i "$old" \
            -frames:v 1 "$work/metrics/old-frame.png"
          ffmpeg -hide_banner -v error -y -ss 1.5 -i "$new" \
            -frames:v 1 "$work/metrics/new-frame.png"

          python - <<'PY'
          from pathlib import Path
          import cv2
          import json
          import numpy as np
          from skimage.metrics import structural_similarity

          work = Path('/tmp/mobile-ai-4k-v23')
          old = cv2.imread(str(work / 'metrics/old-frame.png'))
          new = cv2.imread(str(work / 'metrics/new-frame.png'))
          if old is None or new is None:
              raise SystemExit('Could not decode comparison frames')

          display_size = (1170, 2532)
          old_display = cv2.resize(old, display_size, interpolation=cv2.INTER_LANCZOS4)
          new_display = cv2.resize(new, display_size, interpolation=cv2.INTER_LANCZOS4)
          roi_old = old_display[0:2150, 0:780]
          roi_new = new_display[0:2150, 0:780]
          gray_old = cv2.cvtColor(roi_old, cv2.COLOR_BGR2GRAY)
          gray_new = cv2.cvtColor(roi_new, cv2.COLOR_BGR2GRAY)
          lap_old = float(cv2.Laplacian(gray_old, cv2.CV_64F).var())
          lap_new = float(cv2.Laplacian(gray_new, cv2.CV_64F).var())
          edge_ratio = lap_new / max(lap_old, 1e-9)

          old_small = cv2.resize(old, (540, 960), interpolation=cv2.INTER_AREA)
          new_small = cv2.resize(new, (540, 960), interpolation=cv2.INTER_AREA)
          ssim = float(structural_similarity(
              cv2.cvtColor(old_small, cv2.COLOR_BGR2GRAY),
              cv2.cvtColor(new_small, cv2.COLOR_BGR2GRAY),
              data_range=255,
          ))
          mae = float(np.abs(old_small.astype(np.float32) - new_small.astype(np.float32)).mean())

          report = {
              'old_display_laplacian_variance': lap_old,
              'new_display_laplacian_variance': lap_new,
              'edge_detail_ratio': edge_ratio,
              'scene_ssim_at_540x960': ssim,
              'scene_mean_absolute_error': mae,
          }
          (work / 'metrics/detail-report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if edge_ratio < 1.08:
              raise SystemExit(f'AI-enhanced frame did not add enough display-scale edge detail: {edge_ratio:.3f}')
          if ssim < 0.78:
              raise SystemExit(f'Enhanced frame drifted too far from the selected scene: SSIM={ssim:.3f}')
          PY

      - name: Upload candidate video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-enhanced-mobile-4k-v23-candidate
          path: |
            /tmp/mobile-ai-4k-v23/output/mobile-forest-stream-video-v23-ai-2160.mp4
            /tmp/mobile-ai-4k-v23/output/mobile-forest-stream-v23-ai-2160.webp
            /tmp/mobile-ai-4k-v23/output/selected-forest-ai-2160.png
            /tmp/mobile-ai-4k-v23/metrics
          if-no-files-found: warn
          retention-days: 7

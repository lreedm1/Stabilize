name: Build AI-enhanced mobile 4K candidate v23

on:
  push:
    branches:
      - agent/ai-enhanced-mobile-4k-v23
    paths:
      - .github/workflows/build-ai-enhanced-mobile-4k-v23.yml
      - scripts/build-ai-enhanced-mobile-4k-v23.sh
      - requirements.txt
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-ai-enhanced-mobile-4k-v23.yml
      - scripts/build-ai-enhanced-mobile-4k-v23.sh
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: agent/ai-enhanced-mobile-4k-v23
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install media and measurement dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg git libgl1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            torch==2.1.2+cpu torchvision==0.16.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Install official Real-ESRGAN x2 model
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch v0.3.0 \
            https://github.com/xinntao/Real-ESRGAN.git \
            /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install --force-reinstall \
            numpy==1.26.4 \
            opencv-python==4.10.0.84 \
            pillow==10.4.0
          mkdir -p weights
          curl --fail-with-body --location --retry 4 --retry-delay 2 \
            --output weights/RealESRGAN_x2plus.pth \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth

      - name: Build and measure the exact selected-scene candidate
        shell: bash
        run: bash scripts/build-ai-enhanced-mobile-4k-v23.sh

      - name: Upload candidate video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-enhanced-mobile-4k-v23-candidate
          path: |
            /tmp/mobile-ai-4k-v23/output/mobile-forest-stream-video-v23-ai-2160.mp4
            /tmp/mobile-ai-4k-v23/output/mobile-forest-stream-v23-ai-2160.webp
            /tmp/mobile-ai-4k-v23/output/selected-forest-ai-2160.png
            /tmp/mobile-ai-4k-v23/metrics
          if-no-files-found: warn
          retention-days: 7

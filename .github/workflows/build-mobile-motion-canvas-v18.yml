name: Build canvas mobile motion v18

on:
  push:
    branches:
      - agent/mobile-motion-canvas-v18
    paths:
      - scripts/generate-mobile-water-sprite-v18.sh
      - scripts/install-mobile-water-sprite-v18.py
      - scripts/apply-mobile-motion-canvas-v18.mjs
      - scripts/finalize-decision-grade-impact.mjs
      - public/mobile-motion-canvas.js
      - package.json
      - .github/workflows/build-mobile-motion-canvas-v18.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate-mobile-water-sprite-v18.sh
      - scripts/install-mobile-water-sprite-v18.py
      - scripts/apply-mobile-motion-canvas-v18.mjs
      - scripts/finalize-decision-grade-impact.mjs
      - public/mobile-motion-canvas.js
      - package.json
      - .github/workflows/build-mobile-motion-canvas-v18.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-motion-canvas-v18
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg webp

      - name: Generate and validate the transparent water atlas
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-mobile-water-sprite-v18.sh \
            /tmp/stabilize-mobile-water-sprite-v18

      - name: Make the canonical mobile generators canvas-aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          use_path = Path("scripts/use-mobile-forest-stream.mjs")
          use_source = use_path.read_text()
          marker = '    \'test("portrait mobile moves without a media gesture", async () => {\','
          canvas_marker = (
              '    \'test("portrait mobile draws water through a canvas without media autoplay", async () => {\','
          )
          if canvas_marker not in use_source:
              if marker not in use_source:
                  raise SystemExit("Could not find the mobile quality candidate list")
              use_source = use_source.replace(
                  marker,
                  marker + "\n" + canvas_marker,
                  1,
              )
          use_path.write_text(use_source)

          apply_path = Path("scripts/apply-mobile-motion-canvas-v18.mjs")
          apply_source = apply_path.read_text()

          old_required = '''function replaceRequired(source, pattern, replacement, label) {
            const next = source.replace(pattern, replacement);
            if (next === source) throw new Error(`Could not replace ${label}`);
            return next;
          }'''
          new_required = '''function replaceRequired(source, pattern, replacement, label) {
            if (source.includes(replacement)) return source;
            const next = source.replace(pattern, replacement);
            if (next === source) throw new Error(`Could not replace ${label}`);
            return next;
          }'''
          if new_required not in apply_source:
              if old_required not in apply_source:
                  raise SystemExit("Could not find the canvas replacement helper")
              apply_source = apply_source.replace(
                  old_required,
                  new_required,
                  1,
              )

          old_marked = '''function replaceMarked(source, variants, replacement) {
            for (const [start, end] of variants) {
              if (!source.includes(start)) continue;
              const pattern = new RegExp(
                `${escapeRegExp(start)}[\\\\s\\\\S]*?${escapeRegExp(end)}\\\\n?`,
              );
              return source.replace(pattern, replacement);
            }
            const suffix = source.endsWith("\\n") ? "" : "\\n";
            return `${source}${suffix}\\n${replacement}`;
          }'''
          new_marked = '''function replaceMarked(source, variants, replacement) {
            const normalized = `${replacement.trimEnd()}\\n`;
            for (const [start, end] of variants) {
              if (!source.includes(start)) continue;
              const pattern = new RegExp(
                `[ \\t]*${escapeRegExp(start)}[\\\\s\\\\S]*?${escapeRegExp(end)}[ \\t]*(?:\\\\n|$)`,
              );
              return source.replace(pattern, normalized);
            }
            const suffix = source.endsWith("\\n") ? "" : "\\n";
            return `${source}${suffix}\\n${normalized}`;
          }'''
          if new_marked not in apply_source:
              if old_marked not in apply_source:
                  raise SystemExit("Could not find the canvas marked-block helper")
              apply_source = apply_source.replace(old_marked, new_marked, 1)

          apply_path.write_text(apply_source)
          PY

      - name: Install generated asset and converge canonical output
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install-mobile-water-sprite-v18.py \
            /tmp/stabilize-mobile-water-sprite-v18/mobile-forest-stream-water-sprite-v18-540.webp
          npm ci --ignore-scripts

          previous_tree=""
          stable="false"
          for attempt in 1 2 3 4; do
            npm run apply:prompt-policy
            git add -A
            current_tree="$(git write-tree)"
            git reset --quiet
            echo "Canonical tree after pass $attempt: $current_tree"
            if [ -n "$previous_tree" ] && [ "$current_tree" != "$previous_tree" ]; then
              echo "Files changed between passes $((attempt - 1)) and $attempt:"
              git diff --name-status "$previous_tree" "$current_tree" || true
              echo "Exact src/page.js drift:"
              git diff --no-ext-diff --unified=30 "$previous_tree" "$current_tree" -- src/page.js || true
            fi
            if [ "$current_tree" = "$previous_tree" ]; then
              stable="true"
              echo "Canonical output stabilized on pass $attempt."
              break
            fi
            previous_tree="$current_tree"
          done
          test "$stable" = true

      - name: Commit generated asset and canonical output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use a Retina poster with automatic canvas water motion'

      - name: Run full regression and Worker build checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish verified branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/mobile-motion-canvas-v18

      - name: Upload sprite and decoded-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-motion-canvas-v18-evidence
          path: |
            /tmp/stabilize-mobile-water-sprite-v18/mobile-forest-stream-water-sprite-v18-540.webp
            /tmp/stabilize-mobile-water-sprite-v18/webpmux-info.txt
            /tmp/stabilize-mobile-water-sprite-v18/frame-*.png
          if-no-files-found: warn
          retention-days: 7

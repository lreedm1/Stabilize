name: Build natural-color mobile walking path v3

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - agent/mobile-natural-color-v3
    paths:
      - .github/workflows/build-mobile-natural-color-v3.yml

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'agent/mobile-natural-color-v3' || github.ref == 'refs/heads/agent/mobile-natural-color-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Check out color-correction branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-natural-color-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regrade mobile assets with natural color
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          inputs = {
              1440: Path("public/scenes/mobile-walking-path-hq-v2-1440.webp"),
              2160: Path("public/scenes/mobile-walking-path-hq-v2-2160.webp"),
              2880: Path("public/scenes/mobile-walking-path-hq-v2-2880.webp"),
          }
          qualities = {1440: 96, 2160: 95, 2880: 93}

          def gamma_lift(image, gamma=0.86):
              table = [round(255 * ((value / 255) ** gamma)) for value in range(256)]
              return image.point(table * 3)

          def naturalize(image):
              image = image.convert("RGB")
              image = gamma_lift(image, 0.88)

              # Pull the cyan cast back without flattening the real evergreen color.
              red, green, blue = image.split()
              red = red.point(lambda value: min(255, round(value * 1.13 + 5)))
              green = green.point(lambda value: min(255, round(value * 1.015)))
              blue = blue.point(lambda value: min(255, round(value * 0.89)))
              image = Image.merge("RGB", (red, green, blue))

              image = ImageEnhance.Brightness(image).enhance(1.035)
              image = ImageEnhance.Contrast(image).enhance(1.025)
              image = ImageEnhance.Color(image).enhance(1.12)

              warm = Image.new("RGB", image.size, (255, 236, 205))
              image = Image.blend(image, warm, 0.025)
              return image.filter(
                  ImageFilter.UnsharpMask(radius=0.7, percent=38, threshold=4)
              )

          for width, source_path in inputs.items():
              if not source_path.exists():
                  raise SystemExit(f"Missing source asset: {source_path}")
              with Image.open(source_path) as source:
                  corrected = naturalize(source)
                  expected_size = source.size

              output = Path(
                  f"public/scenes/mobile-walking-path-natural-v3-{width}.webp"
              )
              corrected.save(output, "WEBP", quality=qualities[width], method=6)
              with Image.open(output) as check:
                  if check.size != expected_size:
                      raise SystemExit(
                          f"Unexpected dimensions for {output}: {check.size}"
                      )
              size = output.stat().st_size
              if not 200_000 < size < 5_000_000:
                  raise SystemExit(f"Unexpected file size for {output}: {size}")
              print(f"Wrote {output}: {size:,} bytes")
          PY

      - name: Wire cache-busted natural-color assets
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "mobile-walking-path-hq-v2-1440.webp": "mobile-walking-path-natural-v3-1440.webp",
              "mobile-walking-path-hq-v2-2160.webp": "mobile-walking-path-natural-v3-2160.webp",
              "mobile-walking-path-hq-v2-2880.webp": "mobile-walking-path-natural-v3-2880.webp",
          }

          for filename in [
              "src/page.js",
              "test/mobile-quality.test.mjs",
              "test/product.test.mjs",
          ]:
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          mobile_test = Path("test/mobile-quality.test.mjs")
          text = mobile_test.read_text()
          text = text.replace(
              "mobile-walking-path-v1-1440\\.webp 1440w",
              "mobile-walking-path-natural-v3-1440\\.webp 1440w",
          )
          text = text.replace(
              "mobile-walking-path-v1-2160\\.webp 2160w",
              "mobile-walking-path-natural-v3-2160\\.webp 2160w",
          )
          text = text.replace(
              "mobile-walking-path-v1-2880\\.webp 2880w",
              "mobile-walking-path-natural-v3-2880\\.webp 2880w",
          )
          text = text.replace(
              "mobile-walking-path-v1-2160\\.webp/",
              "mobile-walking-path-natural-v3-2160\\.webp/",
          )
          mobile_test.write_text(text)

          css_path = Path("public/photo-tuning.css")
          css = css_path.read_text()
          css = css.replace(
              "filter: saturate(1.02) contrast(0.98) brightness(1.01);",
              "filter: none;",
          )
          css_path.write_text(css)

          product_test = Path("test/product.test.mjs")
          product = product_test.read_text()
          product = product.replace(
              "filter:\\s*saturate\\(1\\.02\\) contrast\\(0\\.98\\) brightness\\(1\\.01\\)",
              "filter:\\s*none",
          )
          product_test.write_text(product)

          credit_path = Path("public/scenes/MOBILE_PHOTO_CREDIT.md")
          credit = credit_path.read_text().rstrip() + (
              "\nNatural-color v3 regrade lifts shadow detail and removes the cyan cast.\n"
          )
          credit_path.write_text(credit)

          Path(".github/workflows/build-mobile-natural-color-v3.yml").unlink()
          PY

      - name: Validate natural-color wiring
        run: |
          node --check src/page.js
          grep -q "mobile-walking-path-natural-v3-2160.webp" src/page.js
          grep -q "filter: none" public/photo-tuning.css
          test ! -e .github/workflows/build-mobile-natural-color-v3.yml

      - name: Commit natural-color mobile background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/page.js \
                  public/photo-tuning.css \
                  public/scenes/mobile-walking-path-natural-v3-1440.webp \
                  public/scenes/mobile-walking-path-natural-v3-2160.webp \
                  public/scenes/mobile-walking-path-natural-v3-2880.webp \
                  public/scenes/MOBILE_PHOTO_CREDIT.md \
                  test/mobile-quality.test.mjs \
                  test/product.test.mjs \
                  .github/workflows/build-mobile-natural-color-v3.yml
          git commit -m "Restore natural color in the mobile walking path"
          git push origin HEAD:agent/mobile-natural-color-v3

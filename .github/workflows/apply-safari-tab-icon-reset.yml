name: Apply cache-independent Safari tab icon reset

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-safari-tab-icon-reset.yml

permissions:
  contents: write

concurrency:
  group: apply-safari-tab-icon-reset
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace the network-dependent favicon path
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply-safari-tab-icon-reset.mjs <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { spawnSync } from "node:child_process";

          const read = (path) => readFile(path, "utf8");
          const write = (path, content) => writeFile(path, content);

          function requireReplace(source, search, replacement, label) {
            if (!source.includes(search)) {
              throw new Error(`Could not find ${label}`);
            }
            return source.replace(search, replacement);
          }

          function requirePattern(source, pattern, replacement, label) {
            if (!pattern.test(source)) {
              throw new Error(`Could not find ${label}`);
            }
            return source.replace(pattern, replacement);
          }

          const vectorIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
            <title id="title">Stabilize</title>
            <desc id="description">A cream S on a rounded forest-green square.</desc>
            <rect width="64" height="64" rx="15" fill="#173f31"/>
            <path d="M45 18.5c-3.7-3.1-8.2-4.7-13.3-4.7-8.3 0-14.4 4.2-14.4 10.6 0 6.8 5.9 9.1 14.4 10.8 6.5 1.3 9 2.6 9 5.8 0 3.1-3.3 5.2-8.4 5.2-5.4 0-10-2-14.1-6.1" fill="none" stroke="#fffaf0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="48.5" cy="14.5" r="3.5" fill="#e4b85f"/>
          </svg>
          `;
          await write("public/stabilize-tab-20260813.svg", vectorIcon);

          let generator = await read("scripts/embed-favicon-fallback.mjs");
          generator = requireReplace(
            generator,
            'const ICON_RELEASE = "20260805";\nconst REFRESH_VERSION = "20260805-8";',
            'const ICON_RELEASE = "20260805";\nconst VECTOR_ICON_RELEASE = "20260813";\nconst REFRESH_VERSION = "20260813-safari-inline-1";\nconst INLINE_ICON_DATA =\n  "data:image/png;base64," +\n  (await readFile("scripts/favicon-assets/favicon-32x32.png.b64", "utf8"))\n    .replace(/\\s+/g, "");',
            "favicon release constants",
          );

          const iconLinksBlock = [
            'const ICON_LINKS = `    <link rel="icon" href="/stabilize-tab-${ICON_RELEASE}-16.png" type="image/png" sizes="16x16" />',
            '    <link rel="icon" href="/stabilize-tab-${ICON_RELEASE}-32.png" type="image/png" sizes="32x32" />',
            '    <link rel="icon" href="/stabilize-tab-${VECTOR_ICON_RELEASE}.svg" type="image/svg+xml" sizes="any" />',
            '    <link rel="icon" href="${INLINE_ICON_DATA}" type="image/png" sizes="32x32" />',
            '    <link rel="apple-touch-icon" href="/stabilize-app-${ICON_RELEASE}-180.png" sizes="180x180" />',
            '    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#173f31" />',
            '    <link rel="manifest" href="/site.webmanifest?v=${REFRESH_VERSION}" />',
            '    <meta name="application-name" content="STABILIZE" />',
            '    <meta name="apple-mobile-web-app-title" content="STABILIZE" />',
            '    <script src="/favicon-refresh.js?v=${REFRESH_VERSION}" defer></script>`;',
            '',
            'function requireText',
          ].join("\n");
          generator = requirePattern(
            generator,
            /const ICON_LINKS = `[\s\S]*?`;\n\nfunction requireText/,
            iconLinksBlock,
            "generated icon-link block",
          );

          generator = generator.replaceAll(
            '  ["/favicon.svg", "image/svg+xml; charset=utf-8"],\n',
            '  ["/favicon.svg", "image/svg+xml; charset=utf-8"],\n  [`/stabilize-tab-${VECTOR_ICON_RELEASE}.svg`, "image/svg+xml; charset=utf-8"],\n',
          );
          generator = generator.replace(
            '  "Hard-reset favicon identity with new tab-icon URLs, a true 16px PNG, and a valid Safari mask.",',
            '  "Install a cache-independent Safari icon using a new SVG URL and an inline PNG fallback.",',
          );
          await write("scripts/embed-favicon-fallback.mjs", generator);

          const generated = spawnSync(
            process.execPath,
            ["scripts/embed-favicon-fallback.mjs"],
            { encoding: "utf8", stdio: "inherit" },
          );
          if (generated.status !== 0) {
            throw new Error("Favicon generator failed");
          }

          const inlineBase64 = (
            await readFile("scripts/favicon-assets/favicon-32x32.png.b64", "utf8")
          ).replace(/\s+/g, "");
          const inlineIcon = `data:image/png;base64,${inlineBase64}`;

          const refreshScript = `const VECTOR_ICON_ID = "stabilize-vector-tab-icon";
          const INLINE_ICON_ID = "stabilize-inline-tab-icon";
          const VECTOR_ICON_HREF = "/stabilize-tab-20260813.svg";
          const INLINE_ICON_HREF = ${JSON.stringify(inlineIcon)};

          function appendIcon({ id, href, type, sizes }) {
            const icon = document.createElement("link");
            icon.id = id;
            icon.rel = "icon";
            icon.type = type;
            icon.sizes = sizes;
            icon.href = href;
            document.head.append(icon);
          }

          function installTabIcons() {
            for (const icon of document.querySelectorAll('link[rel~="icon"]')) {
              icon.remove();
            }
            appendIcon({
              id: VECTOR_ICON_ID,
              href: VECTOR_ICON_HREF,
              type: "image/svg+xml",
              sizes: "any",
            });
            appendIcon({
              id: INLINE_ICON_ID,
              href: INLINE_ICON_HREF,
              type: "image/png",
              sizes: "32x32",
            });
          }

          installTabIcons();
          window.addEventListener("pageshow", installTabIcons);
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) installTabIcons();
          });
          `;
          await write("public/favicon-refresh.js", refreshScript);

          const manifest = {
            name: "STABILIZE",
            short_name: "STABILIZE",
            description: "One clear next step for overloaded moments.",
            start_url: "/",
            scope: "/",
            display: "standalone",
            background_color: "#173f31",
            theme_color: "#173f31",
            icons: [
              {
                src: "/stabilize-tab-20260813.svg",
                sizes: "any",
                type: "image/svg+xml",
                purpose: "any",
              },
              {
                src: "/stabilize-app-20260805-180.png",
                sizes: "180x180",
                type: "image/png",
                purpose: "any",
              },
            ],
          };
          await write("public/site.webmanifest", JSON.stringify(manifest, null, 2) + "\n");

          let headers = await read("public/_headers");
          const vectorHeaderBlock = `
          # cache-independent-safari-tab-icon-start
          /stabilize-tab-20260813.svg
            Content-Type: image/svg+xml; charset=utf-8
            Cache-Control: no-store, max-age=0
            Content-Disposition: inline
            Cross-Origin-Resource-Policy: same-origin
            X-Content-Type-Options: nosniff
          # cache-independent-safari-tab-icon-end
          `;
          if (!headers.includes("# cache-independent-safari-tab-icon-start")) {
            headers = headers.trimEnd() + "\n" + vectorHeaderBlock;
          }
          await write("public/_headers", headers);

          let modelTest = await read("test/model-tile-favicon.test.mjs");
          modelTest = requireReplace(
            modelTest,
            '    page,\n    faviconIco,',
            '    page,\n    vectorIcon,\n    faviconIco,',
            "model test vector destructuring",
          );
          modelTest = requireReplace(
            modelTest,
            '    read("src/page.js"),\n    readBytes("public/stabilize-tab-20260805.ico"),',
            '    read("src/page.js"),\n    read("public/stabilize-tab-20260813.svg"),\n    readBytes("public/stabilize-tab-20260805.ico"),',
            "model test vector fixture",
          );
          const pagePatterns = `  const pageIconPatterns = [
            /<link rel="icon" href="\\/stabilize-tab-20260805-16\\.png" type="image\\/png" sizes="16x16" \\/>/,
            /<link rel="icon" href="\\/stabilize-tab-20260805-32\\.png" type="image\\/png" sizes="32x32" \\/>/,
            /<link rel="icon" href="\\/stabilize-tab-20260813\\.svg" type="image\\/svg\\+xml" sizes="any" \\/>/,
            /<link rel="icon" href="data:image\\/png;base64,/,
            /<link rel="apple-touch-icon" href="\\/stabilize-app-20260805-180\\.png" sizes="180x180" \\/>/,
            /<link rel="mask-icon" href="\\/safari-pinned-tab\\.svg" color="#173f31" \\/>/,
            /<link rel="manifest" href="\\/site\\.webmanifest\\?v=20260813-safari-inline-1" \\/>/,
            /<script src="\\/favicon-refresh\\.js\\?v=20260813-safari-inline-1" defer><\\/script>/,
          ];`;
          modelTest = requirePattern(
            modelTest,
            /  const pageIconPatterns = \[[\s\S]*?\n  \];/,
            pagePatterns,
            "model test icon patterns",
          );
          modelTest = requireReplace(
            modelTest,
            '  assert.doesNotMatch(page, /data:image\\/svg\\+xml/);',
            '  assert.doesNotMatch(page, /data:image\\/svg\\+xml/);\n  assert.match(page, /data:image\\/png;base64,/);',
            "model test inline PNG assertion",
          );
          modelTest = requireReplace(
            modelTest,
            '  assert.match(safariMask, /viewBox="0 0 16 16"/);',
            '  assert.match(vectorIcon, /viewBox="0 0 64 64"/);\n  assert.match(vectorIcon, /fill="#173f31"/);\n  assert.match(vectorIcon, /stroke="#fffaf0"/);\n\n  assert.match(safariMask, /viewBox="0 0 16 16"/);',
            "model test vector assertions",
          );
          modelTest = requirePattern(
            modelTest,
            /  assert\.match\(refreshScript, \/stabilize-live-tab-icon\/\);[\s\S]*?  assert\.match\(refreshScript, \/document\\\.head\\\.append\\\(icon\\\)\/\);/,
            `  assert.match(refreshScript, /stabilize-vector-tab-icon/);
            assert.match(refreshScript, /stabilize-inline-tab-icon/);
            assert.match(refreshScript, /\\/stabilize-tab-20260813\\.svg/);
            assert.match(refreshScript, /data:image\\/png;base64,/);
            assert.match(refreshScript, /document\\.head\\.append\\(icon\\)/);`,
            "model test refresh assertions",
          );
          await write("test/model-tile-favicon.test.mjs", modelTest);

          const verifyWorkflow = `name: Verify production favicon

          on:
            workflow_run:
              workflows:
                - Deploy Stabilize to Cloudflare
              branches:
                - main
              types:
                - completed
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: stabilize-production-favicon-post-deploy
            cancel-in-progress: true

          jobs:
            verify:
              name: Verify Safari tab icon
              if: >-
                github.event_name == 'workflow_dispatch' ||
                github.event.workflow_run.conclusion == 'success'
              runs-on: ubuntu-latest
              timeout-minutes: 8

              steps:
                - name: Verify the external SVG and inline PNG identity
                  shell: bash
                  run: |
                    set -euo pipefail

                    for attempt in {1..30}; do
                      root="$(mktemp)"
                      vector_headers="$(mktemp)"
                      vector_body="$(mktemp)"
                      png_headers="$(mktemp)"
                      png_body="$(mktemp)"
                      manifest_headers="$(mktemp)"
                      manifest_body="$(mktemp)"
                      refresh_body="$(mktemp)"

                      root_status="$(curl --max-time 20 --silent --show-error --output "$root" --write-out "%{http_code}" "https://stabilize.info/?favicon-check=${attempt}" || true)"
                      vector_status="$(curl --max-time 20 --silent --show-error --dump-header "$vector_headers" --output "$vector_body" --write-out "%{http_code}" "https://stabilize.info/stabilize-tab-20260813.svg?favicon-check=${attempt}" || true)"
                      png_status="$(curl --max-time 20 --silent --show-error --dump-header "$png_headers" --output "$png_body" --write-out "%{http_code}" "https://stabilize.info/stabilize-tab-20260805-32.png?favicon-check=${attempt}" || true)"
                      manifest_status="$(curl --max-time 20 --silent --show-error --dump-header "$manifest_headers" --output "$manifest_body" --write-out "%{http_code}" "https://stabilize.info/site.webmanifest?favicon-check=${attempt}" || true)"
                      refresh_status="$(curl --max-time 20 --silent --show-error --output "$refresh_body" --write-out "%{http_code}" "https://stabilize.info/favicon-refresh.js?v=20260813-safari-inline-1&favicon-check=${attempt}" || true)"

                      vector_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\\r", "", $2); print tolower($2) }' "$vector_headers" | tail -n 1)"
                      png_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\\r", "", $2); print tolower($2) }' "$png_headers" | tail -n 1)"
                      manifest_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\\r", "", $2); print tolower($2) }' "$manifest_headers" | tail -n 1)"
                      png_magic="$(od -An -tx1 -N8 "$png_body" | tr -d ' \\n')"

                      echo "Favicon attempt ${attempt}: root=${root_status}; vector=${vector_status}/${vector_type:-none}; png=${png_status}/${png_type:-none}/${png_magic:-none}; manifest=${manifest_status}/${manifest_type:-none}; refresh=${refresh_status}"

                      if [[ "$root_status" == "200" ]] &&
                        grep -Fq 'href="/stabilize-tab-20260813.svg"' "$root" &&
                        grep -Fq 'href="data:image/png;base64,' "$root" &&
                        grep -Fq 'src="/favicon-refresh.js?v=20260813-safari-inline-1"' "$root" &&
                        [[ "$vector_status" == "200" && "$vector_type" == image/svg+xml* ]] &&
                        grep -Fq 'viewBox="0 0 64 64"' "$vector_body" &&
                        grep -Fq 'fill="#173f31"' "$vector_body" &&
                        [[ "$png_status" == "200" && "$png_type" == image/png* && "$png_magic" == "89504e470d0a1a0a" ]] &&
                        [[ "$manifest_status" == "200" && "$manifest_type" == application/manifest+json* ]] &&
                        grep -Fq '/stabilize-tab-20260813.svg' "$manifest_body" &&
                        [[ "$refresh_status" == "200" ]] &&
                        grep -Fq '/stabilize-tab-20260813.svg' "$refresh_body" &&
                        grep -Fq 'data:image/png;base64,' "$refresh_body"; then
                        rm -f "$root" "$vector_headers" "$vector_body" "$png_headers" "$png_body" "$manifest_headers" "$manifest_body" "$refresh_body"
                        exit 0
                      fi

                      rm -f "$root" "$vector_headers" "$vector_body" "$png_headers" "$png_body" "$manifest_headers" "$manifest_body" "$refresh_body"
                      sleep 10
                    done

                    echo "::error::Production did not serve the cache-independent Safari tab icon."
                    exit 1
          `;
          await write(".github/workflows/verify-favicon.yml", verifyWorkflow.replace(/^          /gm, ""));

          const releaseWorkflow = `name: Gate production favicon

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          concurrency:
            group: stabilize-production-favicon-@@{{ github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read
            statuses: write

          jobs:
            verify:
              name: Verify Safari tab icon in production
              runs-on: ubuntu-latest
              timeout-minutes: 12

              steps:
                - name: Mark favicon verification pending
                  shell: bash
                  env:
                    GH_TOKEN: @@{{ github.token }}
                  run: |
                    payload="$(printf '{"state":"pending","context":"verification/favicon","description":"Checking cache-independent Safari icon delivery","target_url":"%s/%s/actions/runs/%s"}' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
                    curl --fail-with-body --silent --show-error \\
                      --request POST \\
                      --header "Accept: application/vnd.github+json" \\
                      --header "Authorization: Bearer ${GH_TOKEN}" \\
                      --header "X-GitHub-Api-Version: 2022-11-28" \\
                      --data "$payload" \\
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

                - name: Verify live Safari icon identity
                  shell: bash
                  run: |
                    set -euo pipefail

                    for attempt in {1..45}; do
                      root="$(mktemp)"
                      vector_headers="$(mktemp)"
                      vector_body="$(mktemp)"
                      png_headers="$(mktemp)"
                      png_body="$(mktemp)"
                      manifest_headers="$(mktemp)"
                      manifest_body="$(mktemp)"
                      refresh_body="$(mktemp)"

                      root_status="$(curl --max-time 20 --silent --show-error --output "$root" --write-out "%{http_code}" "https://stabilize.info/?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"
                      vector_status="$(curl --max-time 20 --silent --show-error --dump-header "$vector_headers" --output "$vector_body" --write-out "%{http_code}" "https://stabilize.info/stabilize-tab-20260813.svg?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"
                      png_status="$(curl --max-time 20 --silent --show-error --dump-header "$png_headers" --output "$png_body" --write-out "%{http_code}" "https://stabilize.info/stabilize-tab-20260805-32.png?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"
                      manifest_status="$(curl --max-time 20 --silent --show-error --dump-header "$manifest_headers" --output "$manifest_body" --write-out "%{http_code}" "https://stabilize.info/site.webmanifest?favicon-gate=${GITHUB_SHA}-${attempt}" || true)"
                      refresh_status="$(curl --max-time 20 --silent --show-error --output "$refresh_body" --write-out "%{http_code}" "https://stabilize.info/favicon-refresh.js?v=20260813-safari-inline-1&favicon-gate=${GITHUB_SHA}-${attempt}" || true)"

                      vector_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\\r", "", $2); print tolower($2) }' "$vector_headers" | tail -n 1)"
                      png_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\\r", "", $2); print tolower($2) }' "$png_headers" | tail -n 1)"
                      manifest_type="$(awk -F': ' 'tolower($1) == "content-type" { gsub("\\r", "", $2); print tolower($2) }' "$manifest_headers" | tail -n 1)"
                      png_magic="$(od -An -tx1 -N8 "$png_body" | tr -d ' \\n')"

                      echo "Favicon gate ${attempt}: root=${root_status}; vector=${vector_status}/${vector_type:-none}; png=${png_status}/${png_type:-none}/${png_magic:-none}; manifest=${manifest_status}/${manifest_type:-none}; refresh=${refresh_status}"

                      if [[ "$root_status" == "200" ]] &&
                        grep -Fq 'href="/stabilize-tab-20260813.svg"' "$root" &&
                        grep -Fq 'href="data:image/png;base64,' "$root" &&
                        grep -Fq 'src="/favicon-refresh.js?v=20260813-safari-inline-1"' "$root" &&
                        [[ "$vector_status" == "200" && "$vector_type" == image/svg+xml* ]] &&
                        grep -Fq 'viewBox="0 0 64 64"' "$vector_body" &&
                        [[ "$png_status" == "200" && "$png_type" == image/png* && "$png_magic" == "89504e470d0a1a0a" ]] &&
                        [[ "$manifest_status" == "200" && "$manifest_type" == application/manifest+json* ]] &&
                        grep -Fq '/stabilize-tab-20260813.svg' "$manifest_body" &&
                        [[ "$refresh_status" == "200" ]] &&
                        grep -Fq '/stabilize-tab-20260813.svg' "$refresh_body" &&
                        grep -Fq 'data:image/png;base64,' "$refresh_body"; then
                        rm -f "$root" "$vector_headers" "$vector_body" "$png_headers" "$png_body" "$manifest_headers" "$manifest_body" "$refresh_body"
                        exit 0
                      fi

                      rm -f "$root" "$vector_headers" "$vector_body" "$png_headers" "$png_body" "$manifest_headers" "$manifest_body" "$refresh_body"
                      sleep 10
                    done

                    echo "::error::Production did not expose the cache-independent Safari tab icon."
                    exit 1

                - name: Publish favicon verification result
                  if: always()
                  shell: bash
                  env:
                    GH_TOKEN: @@{{ github.token }}
                    JOB_STATUS: @@{{ job.status }}
                  run: |
                    if [[ "$JOB_STATUS" == "success" ]]; then
                      state="success"
                      description="Cache-independent Safari SVG and inline PNG checks passed"
                    else
                      state="failure"
                      description="Live Safari favicon identity verification failed"
                    fi
                    payload="$(printf '{"state":"%s","context":"verification/favicon","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
                    curl --fail-with-body --silent --show-error \\
                      --request POST \\
                      --header "Accept: application/vnd.github+json" \\
                      --header "Authorization: Bearer ${GH_TOKEN}" \\
                      --header "X-GitHub-Api-Version: 2022-11-28" \\
                      --data "$payload" \\
                      "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          `;
          await write(
            ".github/workflows/favicon-release-gate.yml",
            releaseWorkflow.replace(/^          /gm, "").replaceAll("@@", "$"),
          );

          const workflowTest = `import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          test("post-deploy favicon verification checks the cache-independent Safari identity", async () => {
            const workflow = await readFile(
              new URL("../.github/workflows/verify-favicon.yml", import.meta.url),
              "utf8",
            );

            assert.match(workflow, /workflow_run:[\\s\\S]*Deploy Stabilize to Cloudflare/);
            assert.match(workflow, /stabilize-tab-20260813\\.svg\\?favicon-check=/);
            assert.match(workflow, /stabilize-tab-20260805-32\\.png\\?favicon-check=/);
            assert.match(workflow, /favicon-refresh\\.js\\?v=20260813-safari-inline-1/);
            assert.match(workflow, /href=\\"data:image\\/png;base64,/);
            assert.match(workflow, /png_magic[\\s\\S]*89504e470d0a1a0a/);
            assert.match(workflow, /image\\/png/);
            assert.match(workflow, /image\\/svg\\+xml/);
            assert.match(workflow, /viewBox=\\"0 0 64 64\\"/);
          });
          `;
          await write(
            "test/favicon-workflow.test.mjs",
            workflowTest.replace(/^          /gm, ""),
          );

          const gateTest = `import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          test("the main-branch favicon gate verifies the cache-independent Safari identity", async () => {
            const workflow = await readFile(
              new URL("../.github/workflows/favicon-release-gate.yml", import.meta.url),
              "utf8",
            );

            assert.match(workflow, /push:[\\s\\S]*branches:[\\s\\S]*- main/);
            assert.match(workflow, /statuses:\\s*write/);
            assert.match(workflow, /"context":"verification\\/favicon"/);
            assert.match(workflow, /stabilize-tab-20260813\\.svg\\?favicon-gate=/);
            assert.match(workflow, /stabilize-tab-20260805-32\\.png\\?favicon-gate=/);
            assert.match(workflow, /site\\.webmanifest\\?favicon-gate=/);
            assert.match(workflow, /favicon-refresh\\.js\\?v=20260813-safari-inline-1/);
            assert.match(workflow, /href=\\"data:image\\/png;base64,/);
            assert.match(workflow, /png_magic[\\s\\S]*89504e470d0a1a0a/);
            assert.match(workflow, /application\\/manifest\\+json/);
            assert.match(
              workflow,
              /Cache-independent Safari SVG and inline PNG checks passed/,
            );
          });
          `;
          await write(
            "test/favicon-release-gate.test.mjs",
            gateTest.replace(/^          /gm, ""),
          );

          const docs = `# Favicon compatibility repair

          Stabilize now gives Safari three independent ways to obtain the same tab identity: a newly named SVG icon, a conventional 32×32 PNG fallback, and an inline PNG data URL embedded directly in the page. The inline copy removes Cloudflare routing, MIME handling, and stale external-asset caching from Safari's final icon choice.


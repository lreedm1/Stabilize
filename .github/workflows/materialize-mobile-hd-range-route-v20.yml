name: Materialize mobile HD range route v20

on:
  push:
    branches:
      - agent/mobile-hd-range-route-v20
    paths:
      - scripts/apply-mobile-hd-range-route-v20.mjs
      - scripts/finalize-decision-grade-impact.mjs
      - .github/workflows/materialize-mobile-hd-range-route-v20.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-mobile-hd-range-route-v20.mjs
      - scripts/finalize-decision-grade-impact.mjs
      - .github/workflows/materialize-mobile-hd-range-route-v20.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out range-route branch
        uses: actions/checkout@v6
        with:
          ref: agent/mobile-hd-range-route-v20
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without historical install scripts
        shell: bash
        run: npm ci --ignore-scripts

      - name: Repair the generated regression template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-mobile-hd-range-route-v20.mjs")
          source = path.read_text()
          replacements = {
              '  const url = `https://stabilize.info${VIDEO_ROUTE}`;':
                  '  const url = "https://stabilize.info" + MOBILE_HD_VIDEO_ROUTE;',
              '    `bytes 0-1023/${VIDEO_BYTES}`,':
                  '    "bytes 0-1023/" + MOBILE_HD_VIDEO_BYTES,',
              '    `bytes ${VIDEO_BYTES - 2048}-${VIDEO_BYTES - 1}/${VIDEO_BYTES}`,':
                  '    "bytes " + (MOBILE_HD_VIDEO_BYTES - 2048) + "-" + (MOBILE_HD_VIDEO_BYTES - 1) + "/" + MOBILE_HD_VIDEO_BYTES,',
          }
          for before, after in replacements.items():
              source = source.replace(before, after)

          if "function escapeRegExp(value)" not in source:
              helper = r'''
          function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          }

          '''
              marker = "const responder ="
              if marker not in source:
                  raise SystemExit("Could not locate responder boundary")
              source = source.replace(marker, helper + marker, 1)

          path.write_text(source)
          PY
          node --check scripts/apply-mobile-hd-range-route-v20.mjs

      - name: Materialize canonical output
        shell: bash
        run: npm run apply:prompt-policy

      - name: Commit generated product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'Range-aware HD output was already canonical.'
          else
            git commit -m 'Serve the true-HD mobile video with exact byte ranges'
          fi

      - name: Run full regression and build gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish verified branch
        shell: bash
        run: git push origin HEAD:agent/mobile-hd-range-route-v20

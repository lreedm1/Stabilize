name: Regrade mobile photo

on:
  push:
    branches:
      - agent/fix-mobile-photo
    paths:
      - .github/workflows/regrade-mobile-photo.yml

permissions:
  contents: write

jobs:
  regrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-mobile-photo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reframe and recolor mobile background
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          source_path = Path("public/scenes/lake-valley-portrait-2160.webp")
          outputs = {
              Path("public/scenes/lake-valley-portrait-720.webp"): (720, 1280),
              Path("public/scenes/lake-valley-portrait-1440.webp"): (1440, 2560),
              Path("public/scenes/lake-valley-portrait-2160.webp"): (2160, 3840),
          }

          with Image.open(source_path) as source:
              image = source.convert("RGB")

          # Zoom into the landscape and remove the washed-out upper sky.
          width, height = image.size
          crop_width = int(width * 0.75)
          crop_height = int(crop_width * 16 / 9)
          crop_height = min(crop_height, int(height * 0.78))
          crop_width = int(crop_height * 9 / 16)
          left = (width - crop_width) // 2
          top = min(int(height * 0.17), height - crop_height)
          image = image.crop((left, top, left + crop_width, top + crop_height))

          # Darken highlights and emphasize natural greens without a neon cast.
          image = ImageEnhance.Brightness(image).enhance(0.88)
          image = ImageEnhance.Contrast(image).enhance(1.16)
          image = ImageEnhance.Color(image).enhance(1.20)
          green_tint = Image.new("RGB", image.size, (18, 68, 38))
          image = Image.blend(image, green_tint, 0.055)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.1, percent=65, threshold=3))

          for path, size in outputs.items():
              rendered = image.resize(size, Image.Resampling.LANCZOS)
              rendered.save(path, "WEBP", quality=89, method=6)
              with Image.open(path) as check:
                  if check.size != size:
                      raise SystemExit(f"Unexpected size for {path}: {check.size}")
              print(f"Wrote {path} at {size[0]}x{size[1]} ({path.stat().st_size:,} bytes)")
          PY

      - name: Commit generated assets and remove workflow
        run: |
          rm .github/workflows/regrade-mobile-photo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scenes/lake-valley-portrait-720.webp \
                  public/scenes/lake-valley-portrait-1440.webp \
                  public/scenes/lake-valley-portrait-2160.webp \
                  .github/workflows/regrade-mobile-photo.yml
          git commit -m "Fix mobile background crop and color"
          git push origin HEAD:agent/fix-mobile-photo

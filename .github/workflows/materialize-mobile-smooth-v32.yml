name: Materialize mobile smooth v32

on:
  push:
    branches:
      - fix/mobile-smooth-v32
    paths:
      - .github/workflows/materialize-mobile-smooth-v32.yml
      - scripts/finalize-full-guest-conversation.mjs
      - scripts/finalize-mobile-smooth-v32.mjs
      - scripts/mobile-smooth-v32.json
      - scripts/verify-mobile-smooth-v32.yml
      - test/mobile-smooth-v32.test.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-mobile-smooth-v32
  cancel-in-progress: true

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-smooth-v32
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without generation
        run: npm ci --ignore-scripts

      - name: Bootstrap and materialize canonical v32 output
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          node scripts/finalize-mobile-smooth-v32.mjs

      - name: Verify the intended repair before commit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '20260813-mobile-smooth-v32-1' src/page.js
          grep -Fq '/media/mobile-forest-stream-video-v12-720.mp4' src/page.js
          ! grep -Fq '/mobile-background/runtime?v=' src/page.js
          grep -Fq 'native-video-720x1280-24fps' public/mobile-video-handoff-v31.js
          grep -Fq 'video.style.setProperty("opacity", "0.001", "important")' public/mobile-video-handoff-v31.js
          grep -Fq 'MOBILE_VIDEO_BYTES = 1_314_209' src/mobile-video-response.js
          cmp -s scripts/verify-mobile-smooth-v32.yml .github/workflows/verify-mobile-video.yml
          git diff --check

      - name: Commit the generated tree locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use the smooth mobile video path'

      - name: Validate the exact committed tree
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          npm run test:node
          npm run test:worker || npm run test:worker
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish the exact validated commit
        run: git push origin HEAD:fix/mobile-smooth-v32

name: Compile Wisconsin 2025 Acts full text

on:
  push:
    branches:
      - agent/compile-wisconsin-acts-2025
    paths:
      - .github/workflows/compile-wisconsin-acts.yml

permissions:
  contents: write

concurrency:
  group: compile-wisconsin-acts-2025
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Record workflow run ID for retrieval
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > automation/wi-acts-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/wi-acts-run-id.txt
          git commit -m "Record Wisconsin Acts build run [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download and compile Acts 1 through 247
        env:
          EXPECTED_BILLS: >-
            AB2 AB19 AB35 AB45 AB61 AB65 AB74 AB75 AB78 AB80 AB86 AB89 AB94 AB95 AB96 AB98 AB99 AB123 AB130 AB131 AB136 AB140 AB149 AB153 AB155 AB180 AB182 AB192 AB194 AB201 AB217 AB219 AB221 AB223 AB232 AB237 AB238 AB239 AB242 AB253 AB257 AB265 AB271 AB273 AB280 AB294 AB302 AB320 AB346 AB373 AB374 AB375 AB387 AB388 AB409 AB424 AB425 AB443 AB445 AB446 AB452 AB453 AB454 AB456 AB459 AB530 AB543 AB562 AB572 AB592 AB596 AB597 AB598 AB601 AB604 AB605 AB619 AB650 AB651 AB657 AB659 AB666 AB668 AB670 AB676 AB677 AB679 AB685 AB696 AB699 AB700 AB713 AB737 AB751 AB759 AB768 AB778 AB786 AB787 AB788 AB789 AB813 AB856 AB866 AB884 AB905 AB907 AB911 AB913 AB918 AB923 AB924 AB925 AB926 AB927 AB928 AB929 AB930 AB931 AB932 AB933 AB934 AB935 AB936 AB938 AB939 AB940 AB957 AB958 AB964 AB966 AB968 AB969 AB1004 AB1025 AB1034 SB5 SB11 SB14 SB23 SB24 SB31 SB33 SB38 SB43 SB45 SB56 SB66 SB68 SB78 SB84 SB96 SB98 SB106 SB108 SB121 SB124 SB125 SB126 SB134 SB136 SB152 SB158 SB159 SB162 SB164 SB169 SB172 SB181 SB182 SB183 SB188 SB189 SB190 SB191 SB193 SB210 SB215 SB225 SB232 SB235 SB248 SB255 SB259 SB264 SB267 SB278 SB279 SB283 SB309 SB310 SB331 SB339 SB358 SB366 SB367 SB374 SB376 SB387 SB391 SB392 SB395 SB413 SB419 SB421 SB422 SB423 SB439 SB440 SB448 SB459 SB461 SB466 SB474 SB480 SB482 SB485 SB501 SB504 SB521 SB529 SB531 SB533 SB537 SB556 SB575 SB576 SB593 SB620 SB673 SB678 SB692 SB748 SB782 SB783 SB785 SB787 SB798 SB810 SB814 SB822 SB825 SB832 SB884 SB898 SB920 SB921
        run: python automation/compile_wi_acts.py

      - name: Upload compiled TXT
        uses: actions/upload-artifact@v4
        with:
          name: wisconsin-2025-2026-enacted-acts-full-text
          path: Wisconsin_2025-2026_Enacted_Acts_Full_Text.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

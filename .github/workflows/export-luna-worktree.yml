name: Materialize Luna adaptive routing

on:
  push:
    branches:
      - agent/luna-adaptive-routing
  workflow_dispatch:

concurrency:
  group: materialize-luna-adaptive-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/luna-adaptive-routing
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          cat .github/luna-routing-payload/part-* > /tmp/luna-routing-payload.b64
          echo "3d98de641401e02eda5c186f543ede57562ce352520c34bf1d48dc08fa8e8f54  /tmp/luna-routing-payload.b64" | sha256sum --check
          base64 --decode /tmp/luna-routing-payload.b64 > /tmp/luna-routing-payload.tar.gz
          echo "779f36363bb27d1ac3f8ffe1525d0dfac34d078da2ae14fae2eb1c5c8f72e371  /tmp/luna-routing-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/luna-routing-payload.tar.gz
          while IFS= read -r path; do
            [[ -n "$path" ]] && rm -f "$path"
          done < .luna-delete-paths
          rm -f .luna-delete-paths
          rm -rf .github/luna-routing-payload

      - name: Install dependencies and materialize policy
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Validate and materialize Worker bundle
        run: npm run check

      - name: Commit canonical tree
        shell: bash
        run: |
          rm -f .github/workflows/export-luna-worktree.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route automatic chats through Luna with Sol escalation"
          npm run verify:clean
          git push origin HEAD:agent/luna-adaptive-routing

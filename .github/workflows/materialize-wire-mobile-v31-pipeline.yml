name: Materialize canonical mobile v31 pipeline output

on:
  push:
    branches:
      - fix/wire-mobile-v31-pipeline
    paths:
      - .github/workflows/materialize-wire-mobile-v31-pipeline.yml
  workflow_dispatch:

concurrency:
  group: materialize-wire-mobile-v31-pipeline
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: fix/wire-mobile-v31-pipeline
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without generation
        run: npm ci --ignore-scripts

      - name: Materialize canonical generated output
        run: npm run apply:prompt-policy

      - name: Commit canonical output locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/materialize-wire-mobile-v31-pipeline.yml
          git add -A
          git diff --cached --stat
          git commit -m 'Materialize canonical mobile v31 pipeline output'

      - name: Run full validation against committed output
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Publish validated generated commit
        run: git push origin HEAD:fix/wire-mobile-v31-pipeline

name: Commit canonical generated output

on:
  push:
    branches: [main]
    paths: [.github/workflows/commit-canonical-generated-output.yml]

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate canonical output
        run: |
          node scripts/patch-static-favicon-pipeline.mjs
          npm ci
          git add -A
          npm run apply:prompt-policy
          git diff --exit-code
          git reset
          git diff --check
      - name: Commit output
        run: |
          rm -f .github/workflows/commit-canonical-generated-output.yml
          rm -f scripts/patch-static-favicon-pipeline.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Commit canonical generated output"
          git pull --rebase origin main
          git push origin HEAD:main

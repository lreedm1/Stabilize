name: Materialize Xcode Cloud release tools

on:
  push:
    branches:
      - agent/stabilize-1.1-xcode-cloud
    paths:
      - "ios/Gemfile"
      - "ios/ci_scripts/**"
      - ".github/workflows/materialize-xcode-cloud-release-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-xcode-cloud-release-tools
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/stabilize-1.1-xcode-cloud
          fetch-depth: 0
          persist-credentials: true

      - name: Lock release tooling and preserve script modes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ios/ci_scripts/ci_post_clone.sh ios/ci_scripts/ci_post_xcodebuild.sh
          bundle lock --gemfile=ios/Gemfile

      - name: Commit generated release-tool state
        shell: bash
        run: |
          set -euo pipefail
          git add -f ios/Gemfile.lock ios/ci_scripts/ci_post_clone.sh ios/ci_scripts/ci_post_xcodebuild.sh
          if git diff --cached --quiet; then
            echo "Xcode Cloud release tools are already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize Xcode Cloud release tools"
          git push origin HEAD:agent/stabilize-1.1-xcode-cloud

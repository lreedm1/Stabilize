name: Diagnose Wisconsin Act download

on:
  push:
    branches:
      - agent/compile-wisconsin-acts-2025
    paths:
      - .github/workflows/wi-act-download-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: diagnose-wisconsin-act-download
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test proxy sources
        run: |
          python - <<'PY' > automation/wi-act-download-diagnostic.txt
          import time
          import requests
          urls = [
              "https://r.jina.ai/https://docs.legis.wisconsin.gov/document/acts/2025/1.pdf",
              "https://r.jina.ai/http://docs.legis.wisconsin.gov/document/acts/2025/1.pdf",
              "https://r.jina.ai/https://legiscan.com/WI/text/AB94/id/3199083/Wisconsin-2025-AB94-Chaptered.pdf",
          ]
          s = requests.Session()
          s.headers["User-Agent"] = "Mozilla/5.0 (compatible; WisconsinActsCompiler/1.0)"
          for url in urls:
              start = time.monotonic()
              print(f"url={url}")
              try:
                  r = s.get(url, timeout=(20, 120), allow_redirects=True)
                  print(f"status={r.status_code}")
                  print(f"final_url={r.url}")
                  print(f"bytes={len(r.content)}")
                  print(f"content_type={r.headers.get('content-type')}")
                  print(f"head={r.text[:200]!r}")
                  print(f"has_act_1={'WISCONSIN ACT 1' in r.text.upper()}")
                  print(f"has_ab94={'ASSEMBLY BILL 94' in r.text.upper()}")
              except Exception as exc:
                  print(f"error={type(exc).__name__}: {exc}")
              print(f"elapsed={time.monotonic() - start:.3f}")
              print()
          PY
          cat automation/wi-act-download-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/wi-act-download-diagnostic.txt
          git commit -m "Record proxy download diagnostic [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

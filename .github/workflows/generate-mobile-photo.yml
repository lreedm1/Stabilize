name: Generate mobile photo

on:
  push:
    branches:
      - agent/mobile-photo
    paths:
      - .github/workflows/generate-mobile-photo.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-photo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and prepare portrait assets
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageEnhance, ImageOps

          url = (
              "https://images.unsplash.com/photo-1747372277831-bfefabee8e11"
              "?auto=format&fm=jpg&q=92&w=4000"
          )
          request = Request(url, headers={"User-Agent": "Stabilize mobile asset builder"})
          with urlopen(request, timeout=60) as response:
              source_bytes = response.read()

          with Image.open(BytesIO(source_bytes)) as source:
              source = source.convert("RGB")
              source = ImageEnhance.Contrast(source).enhance(1.03)
              source = ImageEnhance.Color(source).enhance(1.04)

              sizes = [
                  (720, 1280, "public/scenes/lake-valley-portrait-720.webp"),
                  (1440, 2560, "public/scenes/lake-valley-portrait-1440.webp"),
                  (2160, 3840, "public/scenes/lake-valley-portrait-2160.webp"),
              ]
              for width, height, path_text in sizes:
                  portrait = ImageOps.fit(
                      source,
                      (width, height),
                      method=Image.Resampling.LANCZOS,
                      centering=(0.44, 0.5),
                  )
                  target = Path(path_text)
                  portrait.save(target, "WEBP", quality=88, method=6)
                  with Image.open(target) as check:
                      if check.size != (width, height):
                          raise SystemExit(f"Unexpected size for {target}: {check.size}")
                  print(f"Generated {target} ({target.stat().st_size:,} bytes)")

          Path("public/scenes/MOBILE_PHOTO_CREDIT.md").write_text(
              "Mobile background photo by Royce Fonseca on Unsplash.\n"
              "Source: https://unsplash.com/photos/3CoAGpZt7iU\n"
              "Used under the Unsplash License.\n",
              encoding="utf-8",
          )
          PY

      - name: Commit generated assets and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scenes/lake-valley-portrait-720.webp
          git add public/scenes/lake-valley-portrait-1440.webp
          git add public/scenes/lake-valley-portrait-2160.webp
          git add public/scenes/MOBILE_PHOTO_CREDIT.md
          git rm .github/workflows/generate-mobile-photo.yml
          git commit -m "Use a separate photo on mobile"
          git push origin HEAD:agent/mobile-photo

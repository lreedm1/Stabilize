name: Finalize memory generator idempotency

on:
  push:
    branches:
      - agent/memory-deletion-guest-session-v2
  workflow_dispatch:

concurrency:
  group: finalize-memory-generator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/memory-deletion-guest-session-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Make the generated guest test canonical
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "scripts/add-memory-deletion-and-guest-session.mjs";
          let source = fs.readFileSync(path, "utf8");
          const before = `  assert.match(privacyPage, /included with later guest messages/i);\\n`;
          const after = `  assert.match(privacyPage, /included with later guest\\\\s+messages/i);\\n`;
          if (!source.includes(before) && !source.includes(after)) {
            throw new Error("Could not locate the generated guest privacy assertion");
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source, "utf8");
          NODE

      - name: Validate the complete generated tree
        run: |
          npm ci
          npm test
          npm run check

      - name: Commit the permanent generator fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-memory-generator-idempotency.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make memory generation fully idempotent"
          npm run verify:clean
          git push origin HEAD:agent/memory-deletion-guest-session-v2

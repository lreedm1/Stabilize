<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173f31" />
  <title>Stabilize is offline</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #14251c; background: #eef3ed; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(34rem, 100%); border: 1px solid #cbd7ce; border-radius: 18px; background: #fffdf7; box-shadow: 0 18px 60px rgba(15, 49, 34, .12); padding: 28px; }
    h1 { margin-top: 0; font-size: 1.7rem; }
    p { line-height: 1.6; }
    button { min-height: 42px; border: 0; border-radius: 10px; background: #1f6f54; color: white; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Stabilize cannot connect right now.</h1>
    <p>Your current browser may still hold an unfinished draft, but AI replies require a network connection. Check the connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>

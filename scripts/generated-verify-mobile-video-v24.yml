name: Verify native selected mobile video

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-native-selected-mobile-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts

      - name: Verify canonical native selected-scene output
        shell: bash
        run: |
          set -euo pipefail
          npm run apply:prompt-policy
          git diff --exit-code

          video='public/scenes/mobile-forest-stream-video-v24-native-1080.mp4'
          poster='public/scenes/mobile-forest-stream-v24-native-1080.webp'
          route='/media/mobile-forest-stream-video-v24-native-1080.mp4'
          version='20260810-native-selected-mobile-v24-1'

          test -s "$video"
          test -s "$poster"
          test "$(wc -c < "$video" | tr -d '[:space:]')" -eq 2371524
          test "$(sha256sum "$video" | awk '{print $1}')" = \
            '69dd547594f86fb80f643fa7c823d076c414a630d9a5a53504b6d5f930b95ffc'
          test "$(sha256sum "$poster" | awk '{print $1}')" = \
            'c505ce3a83d342d7d47d7c0a09f3f3899225823d08156f2c757b940049b164ab'
          test "$(dd if="$video" bs=1 skip=4 count=4 status=none)" = 'ftyp'
          grep -aFq 'moov' "$video"
          grep -aFq 'mdat' "$video"
          grep -aFq 'avc1' "$video"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")" = 1080x1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$poster")" = 1080x1920
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$video")" -gt 1500000

          grep -Fq 'id="mobile-background-video"' src/page.js
          grep -Fq "$route" src/page.js
          grep -Fq '/scenes/mobile-forest-stream-v24-native-1080.webp' src/page.js
          grep -Fq "mobile-quality.js?v=${version}" src/page.js
          grep -Fq "mobile-woodland-loop.css?v=${version}" src/page.js
          grep -Fq "$route" public/mobile-quality.js
          grep -Fq 'native-source-1080x1920' public/mobile-quality.js
          grep -Fq 'video.autoplay = true' public/mobile-quality.js
          grep -Fq 'video.muted = true' public/mobile-quality.js
          grep -Fq 'video.defaultMuted = true' public/mobile-quality.js
          grep -Fq 'video.playsInline = true' public/mobile-quality.js
          grep -Fq 'video.play()' public/mobile-quality.js
          grep -Fq 'MOBILE_VIDEO_BYTES = 2_371_524' src/mobile-video-response.js
          grep -Fq "$route" src/mobile-video-response.js
          grep -Fq 'const assetByteCache = new WeakMap();' src/mobile-video-response.js
          grep -Fq 'Accept-Ranges' src/mobile-video-response.js
          grep -Fq 'Content-Range' src/mobile-video-response.js
          ! grep -Fq 'mobile-forest-stream-v20-true-hd-1440' src/page.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-payload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Wait for and verify the exact native release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          route='/media/mobile-forest-stream-video-v24-native-1080.mp4'
          poster_route='/scenes/mobile-forest-stream-v24-native-1080.webp'
          expected_video='public/scenes/mobile-forest-stream-video-v24-native-1080.mp4'
          expected_poster='public/scenes/mobile-forest-stream-v24-native-1080.webp'
          expected_video_bytes="$(wc -c < "$expected_video" | tr -d '[:space:]')"
          expected_video_sha="$(sha256sum "$expected_video" | awk '{print $1}')"
          expected_video_etag="\"${expected_video_sha}\""
          expected_poster_bytes="$(wc -c < "$expected_poster" | tr -d '[:space:]')"
          expected_poster_sha="$(sha256sum "$expected_poster" | awk '{print $1}')"
          version='20260810-native-selected-mobile-v24-1'
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          publish_status() {
            local state="$1"
            local description="$2"
            local payload
            payload="$(printf '{"state":"%s","context":"verification/mobile-video-background","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
              "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          }

          header_value() {
            local file="$1"
            local name="$2"
            awk -F': ' -v target="$name" '
              tolower($1) == tolower(target) {
                gsub("\r", "", $2)
                print $2
              }
            ' "$file" | tail -n 1
          }

          publish_status pending 'Waiting for the native selected forest native video'

          ready=false
          for attempt in {1..36}; do
            key="${GITHUB_SHA}-${attempt}"
            page_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/page.headers" \
                --output "$tmpdir/page.html" \
                --write-out '%{http_code}' \
                "https://stabilize.info/?native-selected-mobile=${key}" || true
            )"
            script_status="$(
              curl --max-time 25 --silent --show-error --compressed \
                --header 'Cache-Control: no-cache' \
                --output "$tmpdir/mobile-quality.js" \
                --write-out '%{http_code}' \
                "https://stabilize.info/mobile-quality.js?native-selected-mobile=${key}" || true
            )"
            poster_status="$(
              curl --max-time 40 --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --dump-header "$tmpdir/poster.headers" \
                --output "$tmpdir/poster.webp" \
                --write-out '%{http_code}' \
                "https://stabilize.info${poster_route}?release=${key}" || true
            )"
            poster_bytes="$(wc -c < "$tmpdir/poster.webp" | tr -d '[:space:]')"
            poster_sha="$(sha256sum "$tmpdir/poster.webp" | awk '{print $1}')"

            echo "Enhanced release attempt ${attempt}: page=${page_status:-000} script=${script_status:-000} poster=${poster_status:-000}; poster=${poster_bytes}/${expected_poster_bytes}."

            if [[ "$page_status" == 200 \
              && "$script_status" == 200 \
              && "$poster_status" == 200 \
              && "$poster_bytes" == "$expected_poster_bytes" \
              && "$poster_sha" == "$expected_poster_sha" ]] \
              && grep -Fq "$route" "$tmpdir/page.html" \
              && grep -Fq "$poster_route" "$tmpdir/page.html" \
              && grep -Fq "mobile-quality.js?v=${version}" "$tmpdir/page.html" \
              && grep -Fq "$route" "$tmpdir/mobile-quality.js" \
              && grep -Fq 'native-source-1080x1920' "$tmpdir/mobile-quality.js" \
              && grep -Fqi "media-src 'self'" "$tmpdir/page.headers"; then
              ready=true
              break
            fi
            sleep 10
          done

          if [[ "$ready" != true ]]; then
            publish_status failure 'Enhanced selected forest release is not live'
            echo '::error::Production did not expose the enhanced page and poster.'
            exit 1
          fi

          key="${GITHUB_SHA}-exact"
          video_status="$(
            curl --max-time 120 --silent --show-error \
              --header 'Cache-Control: no-cache' \
              --dump-header "$tmpdir/video.headers" \
              --output "$tmpdir/video.mp4" \
              --write-out '%{http_code}' \
              "https://stabilize.info${route}?release=${key}" || true
          )"
          range_status="$(
            curl --max-time 60 --silent --show-error \
              --header 'Cache-Control: no-cache' \
              --header 'Range: bytes=0-1023' \
              --dump-header "$tmpdir/range.headers" \
              --output "$tmpdir/range.bin" \
              --write-out '%{http_code}' \
              "https://stabilize.info${route}?range=${key}" || true
          )"

          video_bytes="$(wc -c < "$tmpdir/video.mp4" | tr -d '[:space:]')"
          video_sha="$(sha256sum "$tmpdir/video.mp4" | awk '{print $1}')"
          video_type="$(header_value "$tmpdir/video.headers" content-type | tr '[:upper:]' '[:lower:]')"
          video_etag="$(header_value "$tmpdir/video.headers" etag)"
          video_cache="$(header_value "$tmpdir/video.headers" cache-control | tr '[:upper:]' '[:lower:]')"
          accept_ranges="$(header_value "$tmpdir/video.headers" accept-ranges | tr '[:upper:]' '[:lower:]')"
          range_bytes="$(wc -c < "$tmpdir/range.bin" | tr -d '[:space:]')"
          range_content="$(header_value "$tmpdir/range.headers" content-range | tr '[:upper:]' '[:lower:]')"
          range_etag="$(header_value "$tmpdir/range.headers" etag)"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$tmpdir/video.mp4" 2>/dev/null || true)"
          bitrate="$(ffprobe -v error -select_streams v:0 -show_entries stream=bit_rate -of default=nw=1:nk=1 "$tmpdir/video.mp4" 2>/dev/null || echo 0)"

          if [[ "$video_status" != 200 \
            || "$range_status" != 206 \
            || "$video_bytes" != "$expected_video_bytes" \
            || "$video_sha" != "$expected_video_sha" \
            || "$video_type" != video/mp4* \
            || "$video_etag" != "$expected_video_etag" \
            || "$range_etag" != "$expected_video_etag" \
            || "$video_cache" != *no-store* \
            || "$accept_ranges" != bytes \
            || "$range_bytes" != 1024 \
            || "$range_content" != "bytes 0-1023/${expected_video_bytes}" \
            || "$dimensions" != 1080x1920 \
            || "$bitrate" -le 1500000 ]]; then
            publish_status failure 'Exact native video delivery failed verification'
            echo "::error::video=${video_status}, range=${range_status}, bytes=${video_bytes}, sha=${video_sha}, dimensions=${dimensions}, bitrate=${bitrate}"
            exit 1
          fi

          publish_status success 'Exact native-source 1080x1920 forest video is live'
          echo 'Production serves the exact native selected forest release.'

  verify-mobile-webkit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install mobile WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify visible enhanced playback on an iPhone viewport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-selected-mobile-v24
          node --input-type=module <<'NODE'
          import { webkit } from "playwright";
          import { writeFile } from "node:fs/promises";

          const browser = await webkit.launch({ headless: true });
          const evidence = { requiredTap: false, errors: [] };
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 " +
                "Mobile/15E148 Safari/604.1",
            });
            const page = await context.newPage();
            page.on("pageerror", (error) => evidence.errors.push(error.message));
            page.on("requestfailed", (request) =>
              evidence.errors.push(
                `${request.url()}: ${request.failure()?.errorText || "failed"}`,
              ),
            );

            await page.goto(
              `https://stabilize.info/?ai-enhanced-webkit=${Date.now()}`,
              { waitUntil: "domcontentloaded", timeout: 60_000 },
            );
            await page.waitForSelector("#mobile-background-video", {
              state: "attached",
              timeout: 60_000,
            });

            const isPlaying = () =>
              page.evaluate(() => {
                const video = document.querySelector("#mobile-background-video");
                return (
                  video instanceof HTMLVideoElement &&
                  video.videoWidth === 1080 &&
                  video.videoHeight === 1920 &&
                  video.readyState >= 2 &&
                  !video.paused &&
                  document.documentElement.dataset.mobileBackground ===
                    "video-playing"
                );
              });

            const deadline = Date.now() + 20_000;
            while (Date.now() < deadline && !(await isPlaying())) {
              await page.waitForTimeout(500);
            }
            if (!(await isPlaying())) {
              evidence.requiredTap = true;
              await page.tap("body", { position: { x: 20, y: 20 } });
            }

            await page.waitForFunction(
              () => {
                const video = document.querySelector("#mobile-background-video");
                return (
                  video instanceof HTMLVideoElement &&
                  video.videoWidth === 1080 &&
                  video.videoHeight === 1920 &&
                  video.readyState >= 2 &&
                  !video.paused &&
                  document.documentElement.dataset.mobileBackground ===
                    "video-playing"
                );
              },
              undefined,
              { timeout: 60_000 },
            );

            const sample = () =>
              page.evaluate(() => {
                const video = document.querySelector("#mobile-background-video");
                if (!(video instanceof HTMLVideoElement)) {
                  throw new Error("The enhanced selected video is missing.");
                }
                const style = getComputedStyle(video);
                return {
                  width: video.videoWidth,
                  height: video.videoHeight,
                  currentTime: video.currentTime,
                  duration: video.duration,
                  readyState: video.readyState,
                  paused: video.paused,
                  opacity: style.opacity,
                  display: style.display,
                  visibility: style.visibility,
                  state:
                    document.documentElement.dataset.mobileBackground || "",
                  quality:
                    document.documentElement.dataset.mobileVideoQuality || "",
                  source: video.currentSrc,
                };
              });

            evidence.first = await sample();
            await page.waitForTimeout(1_400);
            evidence.second = await sample();

            const { first, second } = evidence;
            if (first.width !== 1080 || first.height !== 1920) {
              throw new Error("WebKit did not decode the 1080x1920 source.");
            }
            if (first.opacity !== "1" || second.opacity !== "1") {
              throw new Error("The native video is not visibly opaque.");
            }
            if (first.display === "none" || first.visibility === "hidden") {
              throw new Error("The native video is hidden.");
            }
            if (first.paused || second.paused) {
              throw new Error("The native video is paused.");
            }
            if (second.currentTime - first.currentTime < 0.4) {
              throw new Error("The native video timeline did not advance.");
            }
            if (second.quality !== "native-source-1080x1920") {
              throw new Error("The page did not report enhanced 1080x1920 quality.");
            }
            if (!second.source.includes("mobile-forest-stream-video-v24-native-1080.mp4")) {
              throw new Error("WebKit decoded the wrong mobile source.");
            }

            await page.screenshot({
              path: "/tmp/native-selected-mobile-v24/production.png",
              fullPage: false,
            });
          } finally {
            await writeFile(
              "/tmp/native-selected-mobile-v24/evidence.json",
              JSON.stringify(evidence, null, 2),
            );
            await browser.close();
          }
          NODE

      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-selected-mobile-v24-v23-webkit-evidence
          path: /tmp/native-selected-mobile-v24
          if-no-files-found: warn
          retention-days: 7

name: Verify mobile HEVC v35

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-mobile-hevc-v35
  cancel-in-progress: true

jobs:
  verify-repository-release:
    name: Verify repository 1080x1920 release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without running generators
        shell: bash
        run: npm ci --ignore-scripts

      - name: Run application, Worker, and clean-tree gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run verify:clean
          git diff --exit-code

      - name: Verify the committed high-resolution media
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-mobile-hevc-v35.sh

          readarray -t release < <(
            python3 - <<'PY'
          import json
          metadata = json.load(open("scripts/mobile-hevc-v35.json", encoding="utf-8"))
          for key in ("hevcAsset", "h264Asset", "videoBytes", "videoSha256"):
              print(metadata[key])
          PY
          )
          hevc="public${release[0]}"
          h264="public${release[1]}"
          expected_bytes="${release[2]}"
          expected_sha="${release[3]}"

          test -s "$hevc"
          test -s "$h264"
          test "$(wc -c < "$hevc" | tr -d '[:space:]')" = "$expected_bytes"
          test "$(sha256sum "$hevc" | awk '{print $1}')" = "$expected_sha"

          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$hevc")"
          tag="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_tag_string -of csv=p=0 "$hevc")"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$hevc")"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$hevc")"
          audio="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$hevc")"

          test "$codec" = hevc
          test "$tag" = hvc1
          test "$dimensions" = 1080x1920
          test "$fps" = 60/1
          test -z "$audio"

          fallback_codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$h264")"
          fallback_dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$h264")"
          fallback_fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$h264")"
          test "$fallback_codec" = h264
          test "$fallback_dimensions" = 2160x3840
          test "$fallback_fps" = 24/1

  verify-live-release:
    name: Verify live 1080x1920 direct delivery
    needs: verify-repository-release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/mobile-hevc-v35.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Wait for the exact homepage, client, and media
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/mobile-hevc-v35-live"
          mkdir -p "$evidence"

          readarray -t release < <(
            python3 - <<'PY'
          import json
          metadata = json.load(open("scripts/mobile-hevc-v35.json", encoding="utf-8"))
          for key in ("version", "hevcAsset", "h264Asset", "videoBytes", "videoSha256"):
              print(metadata[key])
          PY
          )
          version="${release[0]}"
          hevc_asset="${release[1]}"
          h264_asset="${release[2]}"
          expected_bytes="${release[3]}"
          expected_sha="${release[4]}"

          ready=false
          for attempt in {1..180}; do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            page_status="$(
              curl --max-time 30 --silent --show-error --compressed \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -o "$evidence/page.html" \
                -w '%{http_code}' \
                "https://stabilize.info/?mobile-hevc-v35=${nonce}" || true
            )"
            client_status="$(
              curl --max-time 30 --silent --show-error --compressed \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -o "$evidence/client.js" \
                -w '%{http_code}' \
                "https://stabilize.info/mobile-video-handoff-v31.js?v=${version}&live=${nonce}" || true
            )"

            if [[ "$page_status" == 200 && "$client_status" == 200 ]] \
              && grep -Fq "${hevc_asset}?v=${version}" "$evidence/page.html" \
              && grep -Fq "${h264_asset}?v=${version}" "$evidence/page.html" \
              && grep -Fq 'codecs="hvc1"' "$evidence/page.html" \
              && grep -Fq 'placeholder="What needs attention?"' "$evidence/page.html" \
              && grep -Fq "const VERSION = \"${version}\"" "$evidence/client.js" \
              && grep -Fq 'native-video-hevc-1080x1920-60fps' "$evidence/client.js" \
              && grep -Fq 'native-video-h264-2160x3840-24fps' "$evidence/client.js"; then
              ready=true
              break
            fi

            if (( attempt % 6 == 0 )); then
              echo "Attempt ${attempt}: production has not exposed the exact v35 release yet."
            fi
            sleep 10
          done

          if [[ "$ready" != true ]]; then
            echo '::error::Production did not expose the exact v35 homepage and handoff client.'
            exit 1
          fi

          nonce="${GITHUB_SHA}-exact-$(date +%s)"
          video_status="$(
            curl --max-time 180 --silent --show-error \
              -H 'Cache-Control: no-cache' \
              -D "$evidence/hevc.headers" \
              -o "$evidence/hevc.mp4" \
              -w '%{http_code}' \
              "https://stabilize.info${hevc_asset}?v=${version}&live=${nonce}" || true
          )"
          fallback_status="$(
            curl --max-time 120 --silent --show-error \
              -H 'Cache-Control: no-cache' \
              -o /dev/null \
              -w '%{http_code}' \
              "https://stabilize.info${h264_asset}?v=${version}&live=${nonce}" || true
          )"

          header_value() {
            local file="$1"
            local name="$2"
            awk -F': ' -v target="$name" '
              tolower($1) == tolower(target) {
                gsub("\r", "", $2)
                print $2
              }
            ' "$file" | tail -n 1
          }

          actual_bytes="$(wc -c < "$evidence/hevc.mp4" | tr -d '[:space:]')"
          actual_sha="$(sha256sum "$evidence/hevc.mp4" | awk '{print $1}')"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$evidence/hevc.mp4")"
          tag="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_tag_string -of csv=p=0 "$evidence/hevc.mp4")"
          profile="$(ffprobe -v error -select_streams v:0 -show_entries stream=profile -of csv=p=0 "$evidence/hevc.mp4")"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$evidence/hevc.mp4")"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$evidence/hevc.mp4")"
          audio="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$evidence/hevc.mp4")"
          cache_control="$(header_value "$evidence/hevc.headers" cache-control | tr '[:upper:]' '[:lower:]')"
          content_type="$(header_value "$evidence/hevc.headers" content-type | tr '[:upper:]' '[:lower:]')"

          ffmpeg -hide_banner -v error -xerror -err_detect explode \
            -i "$evidence/hevc.mp4" -map 0:v:0 -f null -

          printf '%s\n' \
            "video_status=${video_status}" \
            "fallback_status=${fallback_status}" \
            "bytes=${actual_bytes}" \
            "sha256=${actual_sha}" \
            "codec=${codec}" \
            "tag=${tag}" \
            "profile=${profile}" \
            "dimensions=${dimensions}" \
            "fps=${fps}" \
            "cache_control=${cache_control}" \
            "content_type=${content_type}"

          [[ "$video_status" == 200 ]]
          [[ "$fallback_status" == 200 || "$fallback_status" == 206 ]]
          [[ "$actual_bytes" == "$expected_bytes" ]]
          [[ "$actual_sha" == "$expected_sha" ]]
          [[ "$codec" == hevc ]]
          [[ "$tag" == hvc1 ]]
          [[ "$profile" == Main ]]
          [[ "$dimensions" == 1080x1920 ]]
          [[ "$fps" == 60/1 ]]
          [[ -z "$audio" ]]
          [[ "$cache_control" == *public* ]]
          [[ "$cache_control" == *max-age=31536000* ]]
          [[ "$cache_control" == *immutable* ]]
          [[ "$content_type" == video/mp4* ]]

          echo 'Exact mobile HEVC v35 release is live at 1080x1920 with the native-resolution H.264 fallback.'

name: Stabilize

options:
  bundleIdPrefix: info.stabilize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.1
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages: {}

targets:
  Stabilize:
    type: application
    platform: iOS
    sources:
      - path: Stabilize
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.stabilize.app
        PRODUCT_NAME: Stabilize
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stabilize
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - StabilizeTests

  StabilizeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StabilizeTests
    dependencies:
      - target: Stabilize
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.stabilize.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stabilize.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Stabilize"
        BUNDLE_LOADER: "$(TEST_HOST)"
